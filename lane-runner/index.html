  /* Additive display: black is see-through, so the page is pure black. */

<body>
<canvas id="c" width="600" height="600" aria-label="Lane Runner: Vapor Freeway"></canvas>
<script>
'use strict';
(() => {
  const W = 600, H = 600, BUILD = 'v2';
  const ctx = document.getElementById('c').getContext('2d');

  // ---------- tuning ----------
  const START_SPEED = 12, EARLY_ACCEL = 0.22, LATE_ACCEL = 0.07, MAX_SPEED = 42; // world units / s, keeps climbing
  const KMH = 8.5;                                     // world units / s → km/h on the speedo
  const BOOST_MULT = 1.45, BOOST_T = 2.5, NITRO_MULT = 1.6, BRAKE_MULT = 0.6, BRAKE_T = 0.7;
  const GRAVITY = 16, STEP = 0.22;                     // STEP: tallest ledge the car drives up (ramps)
  const LANE_SPEED = 7;                                // lanes / s
  const MIN_LANES = 3, MAX_LANES = 6, TAPER = 12;      // freeway lanes come and go; tapers are TAPER units long
  const HALF_LEN = 0.6, HALF_W = 0.38;                 // player hitbox
  const RESTART_LOCK_MS = 800;

  // ---------- pseudo-3D projection; the camera slides sideways with the car ----------
  const HORIZON = 150, GROUND = 515, CX = 300;
  const LANE_PX = 130, UNIT_PX = 120, FAR = 64, NEAR = -4;
  const scaleAt = (z) => S.D / (Math.max(z, -S.D * 0.85) + S.D);
  const X = (x, z) => CX + (x - S.cam) * LANE_PX * scaleAt(z);
  const Y = (z, h = 0) => { const s = scaleAt(z); return HORIZON + (GROUND - HORIZON) * s - h * UNIT_PX * s; };
  const P = (x, z, h) => [X(x, z), Y(z, h)];
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const approach = (v, t, m) => (Math.abs(t - v) <= m ? t : v + Math.sign(t - v) * m);
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  const range = (a, b) => { const r = []; for (let i = a; i <= b; i++) r.push(i); return r; };
  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }

  const C = {
    pink: '#ff4fd8', cyan: '#35e0ff', purple: '#9b5cff', yellow: '#ffd23f', orange: '#ff8a3d',
    mint: '#3dffb5', red: '#ff3355', text: '#ffffff', dim: '#c3b4e6', chrome: '#9aa3b8',
    road: '#0d0418', grid: '#c21fb0', panel: '#140a22', tail: '#ff2a6d', body: '#0b0714', glass: '#061a26',
  };
  // Traffic, all seen from behind. h = roof height (what you'd drive on).
  const MODELS = {
    wedge: { w: 0.8, h: 0.5, len: 1.8, cols: [C.yellow, C.red, C.cyan], p: 3 },     // Countach
    delorean: { w: 0.78, h: 0.6, len: 1.8, cols: ['#d7e0ee'], p: 2 },
    muscle: { w: 0.82, h: 0.62, len: 2.0, cols: [C.orange, C.mint, C.pink], p: 3 },
    cop: { w: 0.78, h: 0.64, len: 1.9, cols: [C.text], p: 1 },
    van: { w: 0.8, h: 0.98, len: 2.0, cols: [C.purple, C.cyan], p: 2 },
    hatch: { w: 0.74, h: 0.62, len: 1.6, cols: [C.cyan, C.yellow, C.mint], p: 3 },
  };
  const MODEL_BAG = Object.entries(MODELS).flatMap(([k, m]) => Array(m.p).fill(k));
  const POWERS = {
    magnet: { label: 'MAGNET', color: C.cyan, dur: 10 },
    shield: { label: 'SHIELD', color: C.mint, dur: 15 },
    nitro: { label: 'NITRO', color: C.orange, dur: 5 },
    turbo: { label: 'BOOST FULL', color: C.purple, dur: 0 },
    double: { label: 'SCORE 2X', color: C.yellow, dur: 12 },
  };
  const SOLID = new Set(['car', 'truck', 'ramp', 'cones', 'barrier']);
  const VEHICLE = new Set(['car', 'truck', 'ramp']);

  // ---------- state ----------
  const S = {
    mode: 'title', // title | play | paused | over
    t: 0, dist: 0, score: 0, coins: 0, base: START_SPEED, speed: START_SPEED, D: 7,
    road: freshRoad(), lane: 0, px: 0, y: 0, vy: 0, ground: 0, onObj: null,
    boost: 1, boostT: 0, brakeT: 0, hornT: 0, pw: {}, invuln: 0,
    objs: [], parts: [], sinceRow: 0, gapNext: 14, nextPower: 8, nextLane: 160,
    cam: 0, shake: 0, flash: 0, anim: 0, wobble: 0, bounce: 0, overAt: 0, toast: null, streak: 0, streakT: 0,
    best: loadBest(), newBest: false,
  };

  function loadBest() { try { return Number(localStorage.getItem('laneRunner.vaporBest')) || 0; } catch { return 0; } }
  function saveBest(v) { try { localStorage.setItem('laneRunner.vaporBest', String(v)); } catch { /* storage unavailable */ } }
  const mult = () => (S.pw.double > 0 ? 2 : 1);
  const grounded = () => S.y <= S.ground + 0.001 && S.vy <= 0;
  const baseSpeed = (t) => Math.min(MAX_SPEED, t < 60 ? START_SPEED + t * EARLY_ACCEL : START_SPEED + 60 * EARLY_ACCEL + (t - 60) * LATE_ACCEL);

  function reset() {
    Object.assign(S, {
      mode: 'play', t: 0, dist: 0, score: 0, coins: 0, base: START_SPEED, speed: START_SPEED,
      road: freshRoad(), lane: 0, px: 0, y: 0, vy: 0, ground: 0, onObj: null,
      boost: 1, boostT: 0, brakeT: 0, hornT: 0, pw: {}, invuln: 0, objs: [], parts: [],
      sinceRow: 0, gapNext: 14, nextPower: 8, nextLane: 160, toast: null, streak: 0, streakT: 0, newBest: false,
    });
  }

  // ---------- the freeway: lanes open and end along the road ----------
  // Each side has a starting outermost lane and a list of changes at world distance w.
  // Opening: the new lane tapers in over TAPER and is usable from halfway through.
  // Ending: the lane is usable up to w (a chevron board sits there), then the edge tapers in.
  function freshRoad() { return { L: { v0: -1, ch: [] }, R: { v0: 1, ch: [] } }; }
  const dirOf = (side) => (side === 'L' ? -1 : 1);
  const isOpening = (side, c) => (c.to - c.from) * dirOf(side) > 0;
  function laneAt(side, w) {
    const sd = S.road[side];
    let v = sd.v0;
    for (const c of sd.ch) if (w >= (isOpening(side, c) ? c.w + TAPER * 0.5 : c.w)) v = c.to;
    return v;
  }
  function edgeAt(side, w) {
    const sd = S.road[side];
    let e = sd.v0;
    for (const c of sd.ch) if (w >= c.w) e = c.from + (c.to - c.from) * Math.min(1, (w - c.w) / TAPER);
    return e + dirOf(side) * 0.5;
  }
  const lastLane = (side) => { const ch = S.road[side].ch; return ch.length ? ch[ch.length - 1].to : S.road[side].v0; };

  function scheduleLaneChange() {
    const n = lastLane('R') - lastLane('L') + 1;
    const open = n <= MIN_LANES ? true : n >= MAX_LANES ? false : Math.random() < 0.5;
    const w = S.dist + FAR + 40;
    const sides = shuffle(['L', 'R']).filter((sd) => { const ch = S.road[sd].ch; return !ch.length || w - ch[ch.length - 1].w > TAPER + 40; });
    if (!sides.length) return;
    const side = sides[0], d = dirOf(side), from = lastLane(side), to = open ? from + d : from - d;
    S.road[side].ch.push({ w, from, to });
    if (open) add({ kind: 'sign', side, z: w - S.dist + TAPER * 0.5, text: 'NEW LANE', col: C.mint, dir: d });
    else {
      add({ kind: 'barrier', lane: from, z: w - S.dist, len: 0.6, w: 0.96, h: 1.5, dir: -d });
      for (const back of [36, 18]) add({ kind: 'sign', side, z: w - back - S.dist, text: 'LANE ENDS', col: C.yellow, dir: -d });
    }
  }

  function pruneRoad() {
    for (const side of ['L', 'R']) {
      const sd = S.road[side];
      while (sd.ch.length && sd.ch[0].w + TAPER < S.dist - 20) sd.v0 = sd.ch.shift().to;
    }
  }

  // ---------- audio (tiny synth blips + an engine drone; unlocked by the first pinch) ----------
  let actx = null, eng = null;
  function unlockAudio() {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
    } catch { actx = null; }
  }
  function tone(f1, f2, dur, type, vol, delay = 0) {
    if (!actx || actx.state !== 'running') return;
    const t0 = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f1, t0);
    o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(actx.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  function engine(on) {
    if (on && !eng && actx && actx.state === 'running') {
      const o = actx.createOscillator(), f = actx.createBiquadFilter(), g = actx.createGain();
      o.type = 'sawtooth'; f.type = 'lowpass'; f.frequency.value = 380; g.gain.value = 0.016;
      o.connect(f).connect(g).connect(actx.destination); o.start();
      eng = { o };
    } else if (!on && eng) { eng.o.stop(); eng = null; }
  }
  const sfx = {
    swish: () => tone(900, 600, 0.06, 'triangle', 0.05),
    bump: () => tone(120, 80, 0.12, 'square', 0.05),
    boost: () => { tone(180, 900, 0.35, 'sawtooth', 0.05); tone(360, 1800, 0.35, 'triangle', 0.03); },
    brake: () => tone(700, 300, 0.2, 'triangle', 0.03),
    horn: () => { tone(392, 392, 0.28, 'square', 0.035); tone(494, 494, 0.28, 'square', 0.03); },
    deny: () => tone(150, 110, 0.18, 'square', 0.05),
    coin: () => { const f = 1100 * (1 + Math.min(S.streak, 12) * 0.05); tone(f, f * 1.35, 0.08, 'square', 0.03); },
    near: () => tone(1500, 2400, 0.1, 'triangle', 0.04),
    power: () => [523, 659, 784, 1046].forEach((f, i) => tone(f, f * 1.01, 0.1, 'square', 0.035, i * 0.06)),
    smash: () => tone(320, 60, 0.25, 'sawtooth', 0.07),
    land: () => tone(160, 90, 0.08, 'triangle', 0.05),
    crash: () => tone(220, 40, 0.6, 'sawtooth', 0.09),
  };

  // ---------- input ----------
  // Neural Band / temple touchpad: thumb swipes arrive as Arrow keys, index pinch as Enter.
  // Match on `key`: device events have an empty `code`. Escape (system Back) is left alone.
  const DIRS = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' };
  window.addEventListener('keydown', (e) => {
    const k = e.key || e.code;
    if (k === 'Enter' || k === ' ') {
      e.preventDefault();
      if (!e.repeat) onSelect();
      return;
    }
    const d = DIRS[k];
    if (d) {
      e.preventDefault();
      if (!e.repeat) onDir(d);
    }
  });

  function onSelect() {
    unlockAudio();
    if (S.mode === 'title') reset();
    else if (S.mode === 'play') honk();
    else if (S.mode === 'paused') S.mode = 'play';
    else if (S.mode === 'over' && performance.now() - S.overAt > RESTART_LOCK_MS) reset();
  }

  function onDir(d) {
    if (S.mode !== 'play') return;
    if (d === 'left') steer(-1);
    else if (d === 'right') steer(1);
    else if (d === 'up') boost();
    else brake();
  }

  function steer(side) {
    const to = S.lane + side;
    if (to < laneAt('L', S.dist + 1) || to > laneAt('R', S.dist + 1)) { sfx.bump(); S.wobble = 0.07 * side; S.shake = 0.08; return; }
    S.lane = to; sfx.swish();
  }

  function boost() {
    if (S.boostT > 0) return;
    if (S.boost < 1) { sfx.deny(); toast('BOOST CHARGING', C.dim); return; }
    S.boost -= 1; S.boostT = BOOST_T; S.shake = 0.12; sfx.boost();
  }

  function brake() { S.brakeT = BRAKE_T; S.boostT = 0; sfx.brake(); }

  // Pinch = horn: traffic right in front of you tries to move over.
  function honk() {
    if (S.hornT > 0) return;
    S.hornT = 1.2; sfx.horn();
    for (const o of S.objs) {
      if (o.dead || !VEHICLE.has(o.kind) || o.mergeTo !== undefined || Math.round(o.lane) !== S.lane || o.z < 0 || o.z > 16) continue;
      for (const d of shuffle([-1, 1])) if (tryMerge(o, S.lane + d)) break;
    }
  }

  // ---------- world ----------
  function add(o) { const r = Object.assign({ frac: 0, len: 0.3, w: 0.5, h: 0 }, o); S.objs.push(r); return r; }

  // Height of an object's surface at distance u past its rear (-1 = not under you).
  function surf(o, u) {
    if (u < 0 || u > o.len) return -1;
    if (o.kind === 'truck') return u > o.len - 1.4 ? 1.0 : o.h;
    if (o.kind === 'ramp') return u < 2.4 ? (o.h * u) / 2.4 : u > o.len - 1.4 ? 1.0 : o.h;
    return o.h;
  }

  function laneClearAt(l, z0, z1, except = null) {
    return !S.objs.some((o) => o !== except && !o.dead && SOLID.has(o.kind) &&
      (Math.round(o.lane) === l || o.mergeTo === l) && o.z < z1 && o.z + o.len > z0);
  }

  function tryMerge(o, nl) {
    const w = S.dist + o.z;
    if (nl < laneAt('L', w + o.len) || nl > laneAt('R', w + o.len)) return false;
    if (!laneClearAt(nl, o.z - 2.5, o.z + o.len + 2.5, o)) return false;
    if (Math.abs(nl - S.px) < 0.9 && o.z < 3 && o.z + o.len > -3) return false; // never merge into the player
    o.mergeTo = nl;
    return true;
  }

  function addCar(lane, z) {
    const model = pick(MODEL_BAG), M = MODELS[model];
    const car = add({ kind: 'car', model, lane, z, len: M.len, w: M.w, h: M.h, frac: rand(0.35, 0.55), col: pick(M.cols) });
    if (model === 'cop') car.frac = rand(0.55, 0.62);
    return car;
  }

  function addTruck(lane, z, kind, frac = rand(0.5, 0.58)) {
    const ramp = kind === 'ramp';
    const t = add({ kind: ramp ? 'ramp' : 'truck', model: kind, lane, z, len: 7.5, w: 0.9, h: ramp ? 1.0 : 1.2, frac, col: pick([C.purple, C.cyan, C.orange, C.pink]) });
    if (ramp || Math.random() < 0.3) for (let i = 0; i < 5; i++) add({ kind: 'coin', lane, z: z + (ramp ? 2.9 : 0.6) + i * 0.8, h: t.h + 0.35, ride: t });
    return t;
  }

  function coinLine(lane, z, n) { for (let i = 0; i < n; i++) add({ kind: 'coin', lane, z: z + i * 1.4, h: 0.35 }); }

  function spawnRow() {
    const w = S.dist + FAR;
    const all = range(laneAt('L', w), laneAt('R', w));
    const open = shuffle(all.filter((l) => laneClearAt(l, FAR - 10, FAR + 20)));
    if (!open.length) return;
    const dens = Math.min(0.7, 0.3 + S.t / 200);
    let n = 0;
    for (let i = 0; i < open.length; i++) if (Math.random() < dens) n++;
    if (n === 0 && Math.random() < 0.6) n = 1;
    n = Math.min(n, all.length - 1, open.length); // always leave a way through
    for (let i = 0; i < n; i++) {
      const l = open[i], r = Math.random();
      if (r < 0.14) addTruck(l, FAR, 'ramp');
      else if (r < 0.3) {
        const t = addTruck(l, FAR, Math.random() < 0.3 ? 'tanker' : 'semi');
        if (Math.random() < 0.25) addTruck(l, FAR + t.len + 1.2, 'semi', t.frac); // convoy
      } else addCar(l, FAR);
    }
    const rest = open.slice(n);
    if (rest.length) {
      const r = Math.random();
      if (r < 0.45) coinLine(rest[0], FAR + 1, 6);
      else if (r < 0.55 && S.t > 10) add({ kind: 'cones', lane: rest[0], z: FAR + 2, len: 0.5, w: 0.9, h: 0.4 });
    }
  }

  function spawnPower() {
    const w = S.dist + FAR;
    const lanes = shuffle(range(laneAt('L', w), laneAt('R', w))).filter((l) => laneClearAt(l, FAR - 4, FAR + 3));
    if (lanes.length) add({ kind: 'power', power: pick(Object.keys(POWERS)), lane: lanes[0], z: FAR + 1, h: 0.55 });
  }

  function burst(x, z, h, n, color, spd = 3, life = 0.6) {
    for (let i = 0; i < n; i++) {
      S.parts.push({ x, z, h, vx: rand(-0.5, 0.5) * spd * 0.4, vz: rand(-0.5, 0.5) * spd, vh: rand(0.2, 1) * spd, life, max: life, color });
    }
    if (S.parts.length > 240) S.parts.splice(0, S.parts.length - 240);
  }

  function poof(o) {
    o.dead = true;
    if (o.kind !== 'coin') burst(o.lane, o.z + o.len / 2, (o.h || 0.4) / 2, 8, C.pink, 2, 0.4);
  }

  function smash(o) {
    o.dead = true;
    for (const c of S.objs) if (c.ride === o) c.ride = null;
    burst(o.lane, Math.max(o.z, 0.5), (o.h || 0.5) / 2, 18, o.col || C.orange, 7, 0.8);
    S.score += 25 * mult(); S.shake = Math.max(S.shake, 0.15); sfx.smash();
  }

  function toast(text, color) { S.toast = { text, color, t: 1.4 }; }

  function collectCoin(o) {
    S.coins++; S.streak++; S.streakT = 0.6;
    S.score += 10 * mult(); S.boost = Math.min(3, S.boost + 0.06);
    burst(o.lane, o.z, o.h, 4, C.yellow, 2, 0.35);
    sfx.coin();
  }

  function grantPower(kind, o) {
    if (kind === 'turbo') S.boost = 3; else S.pw[kind] = POWERS[kind].dur;
    toast(POWERS[kind].label, POWERS[kind].color);
    burst(o.lane, o.z, o.h, 14, POWERS[kind].color, 4, 0.6);
    sfx.power();
  }

  function nearMiss() {
    S.score += 30 * mult(); S.boost = Math.min(3, S.boost + 0.15);
    toast('NEAR MISS +' + 30 * mult(), C.cyan); sfx.near();
  }

  function crash() {
    S.mode = 'over'; S.overAt = performance.now(); S.shake = 0.45; S.flash = 0.35;
    for (const c of [C.pink, C.cyan, C.yellow]) burst(S.px, 0.3, S.y + 0.3, 14, c, 7, 1);
    sfx.crash(); engine(false);
    const sc = Math.floor(S.score);
    if (sc > S.best) { S.best = sc; S.newBest = true; saveBest(sc); }
  }

  // Faster traffic queues behind slower traffic instead of driving through it.
  function convoy() {
    const v = S.objs.filter((o) => !o.dead && VEHICLE.has(o.kind)).sort((a, b) => a.z - b.z);
    for (let i = 0; i < v.length; i++) {
      for (let j = i + 1; j < v.length; j++) {
        if (Math.round(v[j].lane) !== Math.round(v[i].lane)) continue;
        if (v[j].z - (v[i].z + v[i].len) < 1.5 && v[i].frac > v[j].frac) v[i].frac = v[j].frac;
        break;
      }
    }
  }

  // Traffic in an ending lane signals and merges; if it can't, it takes the exit.
  function trafficMerges(dt) {
    for (const side of ['L', 'R']) {
      for (const c of S.road[side].ch) {
        if (isOpening(side, c)) continue;
        for (const o of S.objs) {
          if (o.dead || !VEHICLE.has(o.kind) || o.mergeTo !== undefined || Math.round(o.lane) !== c.from) continue;
          const gap = c.w - (S.dist + o.z + o.len);
          if (gap < 16 && gap > -2 && !tryMerge(o, c.to) && gap < 3) poof(o);
        }
      }
    }
    for (const o of S.objs) {
      if (o.mergeTo === undefined) continue;
      o.lane = approach(o.lane, o.mergeTo, dt * 1.3);
      if (o.lane === o.mergeTo) delete o.mergeTo;
    }
  }

  function magnet(dt) {
    if (!(S.pw.magnet > 0)) return;
    const k = Math.min(1, dt * 7);
    for (const o of S.objs) {
      if (o.dead || o.kind !== 'coin' || o.z > 14 || o.z < -1 || Math.abs(o.lane - S.px) > 3) continue;
      o.ride = null; o.frac = 0;
      o.lane += (S.px - o.lane) * k;
      o.h += (S.y + 0.4 - o.h) * k;
      o.z -= o.z * Math.min(1, dt * 3);
    }
  }

  function step(h) {
    const dz = S.speed * h;
    S.dist += dz;
    S.score += dz * 0.5 * mult();

    // If a boost carried you through a lane-end board, you merge automatically.
    S.lane = clamp(S.lane, laneAt('L', S.dist), laneAt('R', S.dist));
    const diff = S.lane - S.px, mv = LANE_SPEED * h;
    S.px += Math.abs(diff) <= mv ? diff : Math.sign(diff) * mv;

    for (const o of S.objs) {
      o.z -= (S.speed - (o.ride ? o.ride.frac : o.frac) * S.base) * h;
      if (o.ride) o.lane = o.ride.lane;
    }

    S.sinceRow += dz;
    if (S.sinceRow >= S.gapNext) {
      S.sinceRow = 0;
      spawnRow();
      S.gapNext = Math.max(10, 17 - S.base * 0.2) + rand(0, 5);
    }
    if ((S.nextLane -= dz) <= 0) { scheduleLaneChange(); S.nextLane = rand(260, 420); }

    // Solid things: drive up onto what's low enough (ramps, roofs), crash into what isn't.
    let ground = 0, on = null;
    for (const o of S.objs) {
      if (o.dead || !SOLID.has(o.kind)) continue;
      if (Math.abs(S.px - o.lane) >= HALF_W + o.w / 2) continue;
      const sF = surf(o, HALF_LEN - o.z), sC = surf(o, -o.z), sB = surf(o, -HALF_LEN - o.z);
      const top = Math.max(sF, sC, sB);
      if (top < 0) continue;
      if (Math.max(sF, sC) > S.y + STEP) {
        if (S.pw.nitro > 0) { smash(o); continue; }
        if (S.invuln > 0) continue;
        if (S.pw.shield > 0) { S.pw.shield = 0; S.invuln = 1.2; smash(o); toast('SHIELD SAVED YOU', C.mint); continue; }
        crash(); return;
      }
      if (top > ground) { ground = top; on = o; }
    }
    S.ground = ground; S.onObj = on;
    if (S.y < ground) { S.y = ground; if (S.vy < 0) S.vy = 0; }
    if (S.y > ground || S.vy > 0) {
      S.vy -= GRAVITY * h;
      S.y += S.vy * h;
      if (S.y <= ground) {
        if (S.vy < -5) { sfx.land(); S.bounce = -0.06; burst(S.px, -0.4, ground, 6, C.cyan, 2, 0.35); }
        S.y = ground; S.vy = 0;
      }
    }

    for (const o of S.objs) {
      if (o.dead) continue;
      if (VEHICLE.has(o.kind) && !o.passed && o.z + o.len < -HALF_LEN) {
        o.passed = true;
        if (Math.abs(o.lane - S.px) < 1.3 && S.speed > 10 && S.onObj !== o) nearMiss();
        continue;
      }
      if (o.kind !== 'coin' && o.kind !== 'power') continue;
      if (Math.abs(o.z) > HALF_LEN + 0.25 || Math.abs(S.px - o.lane) > 0.6) continue;
      if (o.h < S.y - 0.25 || o.h > S.y + 0.95) continue;
      o.dead = true;
      if (o.kind === 'coin') collectCoin(o); else grantPower(o.power, o);
    }

    S.objs = S.objs.filter((o) => !o.dead && o.z + o.len > NEAR - 2);
  }

  function updateParts(dt) {
    for (const p of S.parts) {
      p.life -= dt;
      p.x += p.vx * dt; p.z += p.vz * dt - (S.mode === 'play' ? S.speed * dt : 0);
      p.vh -= 9 * dt; p.h = Math.max(0, p.h + p.vh * dt);
    }
    S.parts = S.parts.filter((p) => p.life > 0);
  }

  function update(dt) {
    S.anim += dt;
    S.shake = Math.max(0, S.shake - dt);
    S.flash = Math.max(0, S.flash - dt);
    S.wobble = approach(S.wobble, 0, dt * 0.4);
    S.bounce = approach(S.bounce, 0, dt * 0.4);
    if (S.toast && (S.toast.t -= dt) <= 0) S.toast = null;
    updateParts(dt);

    const mid = (laneAt('L', S.dist) + laneAt('R', S.dist)) / 2;
    const camT = S.mode === 'title' ? Math.sin(S.anim * 0.4) * 0.6 : S.px * 0.75 + mid * 0.25;
    S.cam += (camT - S.cam) * Math.min(1, dt * 5);
    S.D += ((S.boostT > 0 || S.pw.nitro > 0 ? 6.2 : 7) - S.D) * Math.min(1, dt * 4); // FOV kick while boosting

    if (S.mode === 'title') { S.dist += 9 * dt; return; }
    if (S.mode !== 'play') return;
    S.t += dt;
    S.base = baseSpeed(S.t);
    const target = S.base * (S.boostT > 0 ? BOOST_MULT : 1) * (S.pw.nitro > 0 ? NITRO_MULT : 1) * (S.brakeT > 0 ? BRAKE_MULT : 1);
    S.speed += (target - S.speed) * Math.min(1, dt * (target > S.speed ? 2.5 : 4));
    S.boostT = Math.max(0, S.boostT - dt);
    S.brakeT = Math.max(0, S.brakeT - dt);
    S.hornT = Math.max(0, S.hornT - dt);
    S.boost = Math.min(3, S.boost + dt * 0.04);

    S.invuln = Math.max(0, S.invuln - dt);
    for (const k in S.pw) {
      if (S.pw[k] > 0 && (S.pw[k] -= dt) <= 0) { S.pw[k] = 0; if (k === 'nitro') S.invuln = Math.max(S.invuln, 1); }
    }
    if ((S.streakT -= dt) <= 0) S.streak = 0;
    if ((S.nextPower -= dt) <= 0) { spawnPower(); S.nextPower = rand(9, 15); }
    magnet(dt);
    convoy();
    trafficMerges(dt);
    pruneRoad();

    // Sub-step so fast speeds can't tunnel through anything.
    const steps = Math.max(1, Math.ceil((S.speed * dt) / 0.3));
    for (let i = 0; i < steps && S.mode === 'play'; i++) step(dt / steps);
    if (S.mode !== 'play') return;

    engine(true);
    if (eng) eng.o.frequency.setTargetAtTime(38 + S.speed * 2.6, actx.currentTime, 0.1);
    S.bounce += Math.sin(S.anim * 31) * 0.0015 * (S.speed / 20); // road buzz
    const steerAmt = S.lane - S.px;
    if (Math.abs(steerAmt) > 0.4 && S.speed > 18 && grounded()) burst(S.px - 0.34 * Math.sign(steerAmt), -0.6, 0.05, 1, '#8f86b8', 1, 0.4);
    if (S.boostT > 0 || S.pw.nitro > 0) burst(S.px + rand(-0.2, 0.2), -0.9, S.y + 0.1, 1, pick([C.cyan, C.pink, C.text]), 1.5, 0.25);
  }

  // ---------- drawing: pre-baked sky ----------
  const SUN_R = 110;
  const sunImg = (() => {
    const c = document.createElement('canvas'); c.width = SUN_R * 2 + 4; c.height = SUN_R + 2;
    const g = c.getContext('2d');
    const grd = g.createLinearGradient(0, 0, 0, SUN_R);
    grd.addColorStop(0, '#ffd23f'); grd.addColorStop(0.55, '#ff7a6b'); grd.addColorStop(1, '#ff2fb3');
    g.fillStyle = grd; g.beginPath(); g.arc(SUN_R + 2, SUN_R + 1, SUN_R, Math.PI, 0); g.closePath(); g.fill();
    g.globalCompositeOperation = 'destination-out';
    for (let i = 0; i < 7; i++) g.fillRect(0, SUN_R * 0.45 + i * (SUN_R * 0.55 / 7), c.width, 1.5 + i * 1.4);
    return c;
  })();

  const glowImg = (() => {
    const c = document.createElement('canvas'); c.width = W; c.height = 50;
    const g = c.getContext('2d'), grd = g.createLinearGradient(0, 50, 0, 0);
    grd.addColorStop(0, 'rgba(255,79,216,0.35)'); grd.addColorStop(1, 'rgba(255,79,216,0)');
    g.fillStyle = grd; g.fillRect(0, 0, W, 50);
    return c;
  })();

  const MT_W = 600, MT_H = 80;
  const mtImg = (() => {
    const c = document.createElement('canvas'); c.width = MT_W; c.height = MT_H + 2;
    const g = c.getContext('2d');
    const pts = [];
    for (let x = 0; x <= MT_W; x += 30) pts.push([x, MT_H - (x % 60 === 0 ? rand(35, MT_H - 4) : rand(8, 30))]);
    pts[pts.length - 1][1] = pts[0][1]; // seamless tile
    g.beginPath(); g.moveTo(0, MT_H + 2);
    for (const [x, y] of pts) g.lineTo(x, y);
    g.lineTo(MT_W, MT_H + 2); g.closePath();
    g.fillStyle = '#000'; g.fill();
    g.strokeStyle = C.purple; g.lineWidth = 2; g.lineJoin = 'round'; g.stroke();
    g.globalAlpha = 0.45; g.lineWidth = 1;
    for (let i = 1; i < pts.length - 1; i++) {
      if (pts[i][1] < pts[i - 1][1] && pts[i][1] < pts[i + 1][1]) {
        g.beginPath(); g.moveTo(pts[i][0], pts[i][1]); g.lineTo(pts[i][0] + rand(-12, 12), MT_H); g.stroke();
      }
    }
    return c;
  })();

  const CITY_W = 380, CITY_H = 64;
  const cityImg = (() => {
    const c = document.createElement('canvas'); c.width = CITY_W; c.height = CITY_H;
    const g = c.getContext('2d');
    for (let x = 4; x < CITY_W - 20;) {
      const bw = rand(14, 32), mid = 1 - Math.abs(x - CITY_W / 2) / (CITY_W / 2);
      const bh = rand(12, 26) + mid * rand(10, 36);
      g.fillStyle = '#000'; g.fillRect(x, CITY_H - bh, bw, bh);
      g.strokeStyle = C.purple; g.lineWidth = 1.5; g.strokeRect(x + 0.5, CITY_H - bh + 0.5, bw - 1, bh);
      for (let wy = CITY_H - bh + 5; wy < CITY_H - 4; wy += 6) {
        for (let wx = x + 3; wx < x + bw - 4; wx += 5) {
          if (Math.random() < 0.28) { g.fillStyle = Math.random() < 0.6 ? C.cyan : C.pink; g.fillRect(wx, wy, 2, 2); }
        }
      }
      if (bh > 45) { g.strokeStyle = C.red; g.beginPath(); g.moveTo(x + bw / 2, CITY_H - bh); g.lineTo(x + bw / 2, CITY_H - bh - 8); g.stroke(); }
      x += bw + rand(1, 5);
    }
    return c;
  })();

  const STARS = Array.from({ length: 45 }, () => ({ x: rand(0, W), y: rand(8, HORIZON - 40), p: rand(0, 6) }));

  // ---------- drawing helpers ----------
  function line(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
  function rrect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function poly(pts, fill = true) {
    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath(); if (fill) ctx.fill(); ctx.stroke();
  }

  // A box seen from behind, optionally yawed (front centre xF ≠ rear centre xR).
  // Draws whichever side faces the camera, then the roof, then the rear.
  function box(xR, xF, w, z0, z1, h0, h1, stroke, fill, lw) {
    if (z0 < NEAR) { if (z1 <= NEAR) return; xR += ((xF - xR) * (NEAR - z0)) / (z1 - z0); z0 = NEAR; }
    const hw = w / 2, dz = z1 - z0, dx = xF - xR, cz = -S.D;
    ctx.strokeStyle = stroke; ctx.fillStyle = fill; ctx.lineWidth = lw;
    if ((S.cam - (xR + hw)) * dz - (cz - z0) * dx > 0) poly([P(xR + hw, z0, h0), P(xF + hw, z1, h0), P(xF + hw, z1, h1), P(xR + hw, z0, h1)]);
    if ((xR - hw - S.cam) * dz + (cz - z0) * dx > 0) poly([P(xR - hw, z0, h0), P(xF - hw, z1, h0), P(xF - hw, z1, h1), P(xR - hw, z0, h1)]);
    poly([P(xR - hw, z0, h1), P(xR + hw, z0, h1), P(xF + hw, z1, h1), P(xF - hw, z1, h1)]);
    poly([P(xR - hw, z0, h0), P(xR + hw, z0, h0), P(xR + hw, z0, h1), P(xR - hw, z0, h1)]);
  }

  // Local 2D frame on a rear face: a = lanes across from centre, b = height above h0.
  function frame(x, z, h0) { const s = scaleAt(z); return { s, cx: X(x, z), by: Y(z, h0), U: LANE_PX * s, V: UNIT_PX * s }; }
  const fx = (f, a) => f.cx + a * f.U, fy = (f, b) => f.by - b * f.V;
  function frect(f, a0, b0, a1, b1, fill, stroke) {
    const x = fx(f, a0), y = fy(f, b1), w = (a1 - a0) * f.U, h = (b1 - b0) * f.V;
    if (fill) { ctx.fillStyle = fill; ctx.fillRect(x, y, w, h); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.strokeRect(x, y, w, h); }
  }
  function fcircle(f, a, b, r, fill, stroke) {
    ctx.beginPath(); ctx.arc(fx(f, a), fy(f, b), Math.max(1, r * f.U), 0, Math.PI * 2);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.stroke(); }
  }
  function fline(f, a0, b0, a1, b1) { line(fx(f, a0), fy(f, b0), fx(f, a1), fy(f, b1)); }
  function fpoly(f, pts, fill, stroke) {
    ctx.beginPath(); ctx.moveTo(fx(f, pts[0][0]), fy(f, pts[0][1]));
    for (let i = 1; i < pts.length; i++) ctx.lineTo(fx(f, pts[i][0]), fy(f, pts[i][1]));
    ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.stroke(); }
  }
  function tyres(f, hw) {
    for (const a of [-hw + 0.06, hw - 0.2]) frect(f, a, 0, a + 0.14, 0.15, '#040407', '#3a3550');
  }
  function blinker(f, o, b) {
    if (o.mergeTo === undefined || Math.sin(S.anim * 14) < 0) return;
    const side = Math.sign(o.mergeTo - o.lane);
    fcircle(f, side * (o.w / 2 - 0.05), b, 0.05, C.orange);
  }

  // ---------- scenery ----------
  function drawSky() {
    for (const s of STARS) {
      ctx.globalAlpha = 0.35 + 0.35 * Math.sin(S.anim * 2 + s.p);
      ctx.fillStyle = C.text; ctx.fillRect(s.x, s.y, 2, 2);
    }
    ctx.globalAlpha = 0.6;
    ctx.drawImage(sunImg, CX - S.cam * 6 - SUN_R - 2, HORIZON - SUN_R - 1);
    ctx.globalAlpha = 1;
    ctx.drawImage(glowImg, 0, HORIZON - 50);
    const ox = -(((S.cam * 14) % MT_W) + MT_W) % MT_W;
    for (let x = ox - MT_W; x < W; x += MT_W) ctx.drawImage(mtImg, x, HORIZON - MT_H);
    ctx.drawImage(cityImg, CX - CITY_W / 2 - S.cam * 9, HORIZON - CITY_H);
    ctx.strokeStyle = C.pink; ctx.lineWidth = 2; ctx.globalAlpha = 0.8; line(0, HORIZON, W, HORIZON);
    ctx.globalAlpha = 1;
  }

  function drawGrid() {
    const zf = FAR + 8;
    ctx.strokeStyle = C.grid; ctx.lineWidth = 1.5;
    ctx.globalAlpha = 0.35;
    ctx.beginPath();
    const c0 = Math.floor(S.cam);
    for (let i = -16; i <= 16; i++) { const x = c0 + i + 0.5; ctx.moveTo(X(x, NEAR), Y(NEAR)); ctx.lineTo(X(x, zf), Y(zf)); }
    ctx.stroke();
    for (let z = -(S.dist % 4); z < zf; z += 4) {
      if (z < NEAR) continue;
      ctx.globalAlpha = clamp((zf - z) / FAR, 0.08, 0.5);
      line(0, Y(z), W, Y(z));
    }
    ctx.globalAlpha = 1;
  }

  function drawRoad() {
    const zf = FAR + 8, zs = [], eL = [], eR = [];
    for (let z = NEAR; z <= zf; z += 2) { zs.push(z); eL.push(edgeAt('L', S.dist + z)); eR.push(edgeAt('R', S.dist + z)); }
    const n = zs.length;

    ctx.fillStyle = C.road; ctx.globalAlpha = 0.95;
    ctx.beginPath();
    for (let i = 0; i < n; i++) ctx.lineTo(X(eL[i], zs[i]), Y(zs[i]));
    for (let i = n - 1; i >= 0; i--) ctx.lineTo(X(eR[i], zs[i]), Y(zs[i]));
    ctx.closePath(); ctx.fill();

    // Rumble strips hugging the (possibly tapering) edges.
    ctx.globalAlpha = 0.7; ctx.fillStyle = C.pink;
    ctx.beginPath();
    for (let z = -(S.dist % 3); z < zf; z += 3) {
      const z0 = Math.max(z, NEAR), z1 = z + 1.5;
      if (z1 <= NEAR) continue;
      for (const side of ['L', 'R']) {
        const d = -dirOf(side) * 0.1, a0 = edgeAt(side, S.dist + z0), a1 = edgeAt(side, S.dist + z1);
        ctx.moveTo(X(a0, z0), Y(z0)); ctx.lineTo(X(a0 + d, z0), Y(z0)); ctx.lineTo(X(a1 + d, z1), Y(z1)); ctx.lineTo(X(a1, z1), Y(z1)); ctx.closePath();
      }
    }
    ctx.fill();

    // Dashed lane dividers, only where both neighbouring lanes are full width.
    let lo = Infinity, hi = -Infinity;
    for (let i = 0; i < n; i++) { lo = Math.min(lo, eL[i]); hi = Math.max(hi, eR[i]); }
    ctx.globalAlpha = 0.9; ctx.strokeStyle = C.cyan; ctx.lineWidth = 3;
    ctx.beginPath();
    for (let x = Math.ceil(lo) + 0.5; x < hi - 0.5; x += 1) {
      for (let z = -(S.dist % 5); z < zf; z += 5) {
        const z0 = Math.max(z, NEAR), z1 = z + 2.2, wm = S.dist + (z0 + z1) / 2;
        if (z1 <= NEAR || edgeAt('L', wm) > x - 0.95 || edgeAt('R', wm) < x + 0.95) continue;
        ctx.moveTo(X(x, z0), Y(z0)); ctx.lineTo(X(x, z1), Y(z1));
      }
    }
    ctx.stroke();

    // Glowing edges.
    for (const [lw, a] of [[9, 0.25], [3, 1]]) {
      ctx.globalAlpha = a; ctx.strokeStyle = C.pink; ctx.lineWidth = lw;
      for (const e of [eL, eR]) {
        ctx.beginPath();
        for (let i = 0; i < n; i++) ctx.lineTo(X(e[i], zs[i]), Y(zs[i]));
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawPalm(x, z, a) {
    const s = scaleAt(z), bx = X(x, z), by = Y(z), u = UNIT_PX * s;
    const lean = x < S.cam ? -1 : 1;
    const tx = bx + lean * 0.35 * u, ty = by - 2.6 * u;
    ctx.globalAlpha = a;
    ctx.strokeStyle = C.purple; ctx.lineWidth = Math.max(1.5, 7 * s);

  // ---------- vehicles ----------

  function drawTruck(o) {

    const fs = frame(x, z1 - 1.3, 0);
    ctx.strokeStyle = C.chrome; ctx.lineWidth = Math.max(1.5, 4 * fs.s);
    fline(fs, -0.36, 0.9, -0.36, 1.45); fline(fs, 0.36, 0.9, 0.36, 1.45);
    if (detail) tyres(f, hw);

      ctx.lineWidth = lw;
      for (let k = 4; k >= 0; k--) {
        const zz = z0 + ((o.len - 1.5) * k) / 4;

  // ---------- other road things ----------

  function chevronRow(cx, cy, dir, n, size, gap) {
    ctx.beginPath();

  function drawObj(o) {
    const a = clamp((FAR + 5 - o.z) / 10, 0, 1); // fade in from the horizon instead of popping

    const zc = Math.max(o.z, NEAR), s = scaleAt(zc), u = UNIT_PX * s;

    else if (o.kind === 'truck' || o.kind === 'ramp') drawTruck(o);

      ctx.save(); ctx.translate(cx, cy); ctx.rotate(S.anim * 1.5);

  // Your ride: a white Testarossa-style wedge with louvred taillights and neon underglow.
  // It yaws toward the lane it's heading for, rolls into the turn, and buzzes with the road.
  function drawPlayer() {
    const steer = clamp(S.lane - S.px, -1, 1), x = S.px, y = S.y + S.bounce, z0 = -0.6, z1 = 1.0, xF = x + steer * 0.35;
    const g0 = frame(x, 0.2, S.ground);
    for (const [lw, al] of [[10, 0.18], [2.5, 0.8]]) {
      ctx.globalAlpha = al * (0.8 + 0.2 * Math.sin(S.anim * 6)); ctx.strokeStyle = C.cyan; ctx.lineWidth = lw;
      ctx.beginPath(); ctx.ellipse(g0.cx, g0.by, 0.52 * g0.U, 10, 0, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.globalAlpha = S.invuln > 0 && Math.floor(S.anim * 16) % 2 ? 0.35 : 1;
    const f = frame(x, z0, y);
    ctx.save();
    ctx.translate(f.cx, f.by); ctx.rotate(-steer * 0.07 + S.wobble); ctx.translate(-f.cx, -f.by);
    // Tyres with scrolling tread.
    for (const a of [-0.43, 0.29]) {

      ctx.strokeStyle = '#4b4566'; ctx.lineWidth = 2;

    }

    const sideX = x + (x > S.cam ? -0.43 : 0.43);
    ctx.strokeStyle = C.pink; ctx.lineWidth = 2;
    for (const hh of [0.17, 0.23, 0.29]) line(X(sideX, z0 + 0.15), Y(z0 + 0.15, y + hh), X(sideX + (xF - x) * 0.6, z0 + 1.0), Y(z0 + 1.0, y + hh));
    box(x, xF, 0.56, z0 + 0.55, z0 + 1.2, y + 0.38, y + 0.57, C.pink, '#12040f', 2.5);
    const fc = frame(x, z0 + 0.55, y);
    fpoly(fc, [[-0.25, 0.39], [0.25, 0.39], [0.2, 0.55], [-0.2, 0.55]], C.glass, C.cyan);
    ctx.strokeStyle = C.cyan; ctx.globalAlpha *= 0.6; fline(fc, -0.12, 0.42, 0.02, 0.53); ctx.globalAlpha /= 0.6;

    fpoly(f, [[-0.44, 0.37], [0.44, 0.37], [0.46, 0.42], [-0.46, 0.42]], '#1b0620', C.pink);

    const braking = S.brakeT > 0, ga = ctx.globalAlpha;
    ctx.globalAlpha = ga * (braking ? 0.5 : 0.25); frect(f, -0.43, 0.17, 0.43, 0.36, C.tail);
    ctx.globalAlpha = ga * (braking ? 1 : 0.8); frect(f, -0.39, 0.2, 0.39, 0.33, C.tail);
    ctx.globalAlpha = ga;
    ctx.strokeStyle = '#1b0620'; ctx.lineWidth = 1.5;
    for (const b of [0.235, 0.265, 0.295]) fline(f, -0.39, b, 0.39, b);
    frect(f, -0.08, 0.12, 0.08, 0.18, C.text);
    ctx.strokeStyle = C.chrome; ctx.lineWidth = 2;
    fcircle(f, -0.2, 0.08, 0.035, '#000', C.chrome); fcircle(f, 0.2, 0.08, 0.035, '#000', C.chrome);
    if (S.boostT > 0 || S.pw.nitro > 0) {
      for (const a of [-0.2, 0.2]) {
        const ex = fx(f, a), ey = fy(f, 0.08), len = rand(24, 44);
        ctx.fillStyle = S.pw.nitro > 0 ? C.orange : C.cyan;
        ctx.beginPath(); ctx.moveTo(ex - 8, ey); ctx.lineTo(ex + 8, ey); ctx.lineTo(ex, ey + len); ctx.closePath(); ctx.fill();
        ctx.fillStyle = C.text;
        ctx.beginPath(); ctx.moveTo(ex - 3, ey); ctx.lineTo(ex + 3, ey); ctx.lineTo(ex, ey + len * 0.5); ctx.closePath(); ctx.fill();
      }
    }
    ctx.restore();
    if (S.pw.shield > 0) {
      ctx.globalAlpha = 0.45 + 0.25 * Math.sin(S.anim * 6); ctx.strokeStyle = C.mint; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(X(x, 0), Y(0, y + 0.35), 0.62 * LANE_PX, 0.55 * UNIT_PX, 0, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function drawParts() {
    for (const p of S.parts) {
      if (p.z < NEAR) continue;
      const s = scaleAt(p.z), sz = Math.max(2, 6 * s);
      ctx.globalAlpha = clamp(p.life / p.max, 0, 1); ctx.fillStyle = p.color;
      ctx.fillRect(X(p.x, p.z) - sz / 2, Y(p.z, p.h) - sz / 2, sz, sz);
    }
    ctx.globalAlpha = 1;
  }

  function drawSpeedLines() {
    if (S.mode !== 'play' || !(S.boostT > 0 || S.pw.nitro > 0 || S.speed > 30)) return;
    ctx.strokeStyle = C.text; ctx.lineWidth = 2; ctx.globalAlpha = S.boostT > 0 || S.pw.nitro > 0 ? 0.4 : 0.18;
    ctx.beginPath();
    for (let i = 0; i < 12; i++) {
      const ang = rand(0, Math.PI * 2), r0 = rand(170, 260), r1 = r0 + rand(40, 100);
      ctx.moveTo(CX + Math.cos(ang) * r0, 300 + Math.sin(ang) * r0); ctx.lineTo(CX + Math.cos(ang) * r1, 300 + Math.sin(ang) * r1);
    }
    ctx.stroke(); ctx.globalAlpha = 1;
  }

  // ---------- HUD ----------
  const FONT = (w, s, it = '') => `${it}${w} ${s}px system-ui, -apple-system, Roboto, sans-serif`;
  function text(txt, x, y, size, color, weight = 700, align = 'center', it = '') {
    ctx.font = FONT(weight, size, it); ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'middle';
    ctx.fillText(txt, x, y);
  }
  function chroma(txt, y, size) { // vaporwave RGB-split title
    text(txt, CX - 3, y, size, C.pink, 900, 'center', 'italic ');
    text(txt, CX + 3, y + 1, size, C.cyan, 900, 'center', 'italic ');
    text(txt, CX, y, size, C.text, 900, 'center', 'italic ');
  }
  function panel(y, h) {
    ctx.globalAlpha = 0.92; ctx.fillStyle = C.panel; rrect(CX - 250, y, 500, h, 22); ctx.fill();
    ctx.globalAlpha = 0.8; ctx.strokeStyle = C.pink; ctx.lineWidth = 2; ctx.stroke(); ctx.globalAlpha = 1;
  }

  function drawSpeedo() {
    const cx = 528, cy = 540, r = 50, a0 = Math.PI * 0.8, a1 = Math.PI * 2.2;
    const kmh = Math.round(S.speed * KMH), frac = clamp(kmh / 450, 0, 1);
    ctx.lineWidth = 8; ctx.strokeStyle = '#2a1640';
    ctx.beginPath(); ctx.arc(cx, cy, r, a0, a1); ctx.stroke();
    ctx.strokeStyle = kmh < 180 ? C.cyan : kmh < 280 ? C.yellow : C.pink;
    ctx.beginPath(); ctx.arc(cx, cy, r, a0, a0 + (a1 - a0) * frac); ctx.stroke();
    ctx.lineWidth = 2; ctx.strokeStyle = C.dim;
    for (let i = 0; i <= 9; i++) { const a = a0 + ((a1 - a0) * i) / 9; line(cx + Math.cos(a) * (r - 12), cy + Math.sin(a) * (r - 12), cx + Math.cos(a) * (r - 7), cy + Math.sin(a) * (r - 7)); }
    text(String(kmh), cx, cy - 4, 28, C.text, 900, 'center', 'italic ');
    text('KM/H', cx, cy + 20, 12, C.dim, 800);
  }

  function drawBoostBar() {
    const x0 = CX - 78, y = H - 26;
    text('BOOST', x0 - 10, y + 1, 13, S.boostT > 0 ? C.cyan : C.dim, 800, 'right', 'italic ');
    for (let i = 0; i < 3; i++) {
      const x = x0 + i * 54, fill = clamp(S.boost - i, 0, 1);
      ctx.fillStyle = '#10223a'; rrect(x, y - 7, 48, 14, 5); ctx.fill();
      if (fill > 0) { ctx.fillStyle = fill >= 1 ? C.cyan : '#1e7f93'; rrect(x, y - 7, 48 * fill, 14, 5); ctx.fill(); }
      ctx.strokeStyle = C.cyan; ctx.lineWidth = 1.5; rrect(x, y - 7, 48, 14, 5); ctx.stroke();
    }
    if (S.boost >= 1 && S.boostT <= 0 && Math.sin(S.anim * 5) > 0) text('swipe ↑', x0 + 170, y + 1, 13, C.cyan, 700, 'left');
  }

  function drawHud() {
    ctx.globalAlpha = 1;
    const blink = 0.55 + 0.45 * Math.sin(S.anim * 5);
    if (S.mode !== 'title') {
      text(String(Math.floor(S.score)), 22, 30, 26, C.text, 800, 'left');
      if (mult() > 1) text(`x${mult()}`, 22, 60, 20, C.yellow, 800, 'left', 'italic ');
      text(String(S.coins), 578, 30, 26, C.yellow, 800, 'right');
      ctx.font = FONT(800, 26);
      const cw = ctx.measureText(String(S.coins)).width;
      ctx.strokeStyle = C.yellow; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.ellipse(578 - cw - 18, 30, 7, 10, 0, 0, Math.PI * 2); ctx.stroke();

      // Lane map for where you are right now.
      const L = laneAt('L', S.dist), R = laneAt('R', S.dist), n = R - L + 1, bw = 16, gap = 5, x0 = CX - (n * bw + (n - 1) * gap) / 2;
      for (let i = 0; i < n; i++) {
        ctx.strokeStyle = C.cyan; ctx.fillStyle = C.pink; ctx.lineWidth = 2;
        rrect(x0 + i * (bw + gap), 18, bw, 26, 4);
        if (L + i === S.lane) ctx.fill();
        ctx.stroke();
      }

      let py = H - 70;
      for (const k of Object.keys(POWERS)) {
        const left = S.pw[k] || 0;
        if (left <= 0) continue;
        drawPowerIcon(k, 34, py, 18, POWERS[k].color);
        ctx.fillStyle = POWERS[k].color; ctx.globalAlpha = 0.8;
        ctx.fillRect(56, py - 3, 70 * Math.min(1, left / POWERS[k].dur), 6); ctx.globalAlpha = 1;
        py -= 40;
      }
      drawSpeedo();
      drawBoostBar();

      // Your lane is about to end: say which way to merge.
      if (S.mode === 'play') {
        for (const side of ['L', 'R']) {
          for (const c of S.road[side].ch) {
            const ahead = c.w - S.dist;
            if (isOpening(side, c) || c.from !== S.lane || ahead < 0 || ahead > 55 || Math.sin(S.anim * 9) < -0.3) continue;
            ctx.globalAlpha = 0.9; ctx.fillStyle = '#2a1a02'; rrect(CX - 170, 62, 340, 48, 14); ctx.fill();
            ctx.strokeStyle = C.yellow; ctx.lineWidth = 2; ctx.stroke(); ctx.globalAlpha = 1;
            text('LANE ENDS · MERGE', CX, 86, 21, C.yellow, 900);
            ctx.strokeStyle = C.yellow; ctx.lineWidth = 4;
            chevronRow(CX + dirOf(side) * -140, 86, -dirOf(side), 2, 9, 12);
          }
        }
      }
      if (S.toast && S.mode === 'play') {
        ctx.globalAlpha = clamp(S.toast.t / 0.4, 0, 1);
        text(S.toast.text, CX, 170 - (1.4 - S.toast.t) * 20, 28, S.toast.color, 900, 'center', 'italic ');
        ctx.globalAlpha = 1;
      }
    }

    if (S.mode === 'title') {
      panel(110, 420);
      chroma('LANE RUNNER', 156, 50);
      text('V A P O R   F R E E W A Y', CX, 198, 18, C.pink, 700);
      const rows = [
        ['← →', 'change lanes'],
        ['swipe ↑', 'boost (charges as you drive)'],
        ['swipe ↓', 'brake'],
        ['pinch', 'horn: traffic moves over'],
      ];
      rows.forEach(([k, v], i) => {
        text(k, CX - 70, 242 + i * 32, 18, C.cyan, 800, 'right');
        text(v, CX - 54, 242 + i * 32, 17, C.dim, 500, 'left');
      });
      text('Lanes open and end. Watch for LANE ENDS.', CX, 380, 16, C.yellow, 700);
      text('Drive up the ramp trucks for coins.', CX, 404, 16, C.yellow, 700);
      ctx.globalAlpha = blink; text('Pinch to start', CX, 452, 28, C.text, 800); ctx.globalAlpha = 1;
      if (S.best) text(`Best ${S.best}`, CX, 494, 18, C.yellow, 600);
      text(BUILD, CX + 232, 514, 12, C.dim, 600, 'right');
    } else if (S.mode === 'paused') {
      panel(230, 130);
      text('Paused', CX, 272, 34, C.text, 800);
      ctx.globalAlpha = blink; text('Pinch to resume', CX, 322, 22, C.dim, 600); ctx.globalAlpha = 1;
    } else if (S.mode === 'over') {
      panel(150, 290);
      chroma('WRECKED', 196, 46);
      text(`Score ${Math.floor(S.score)}`, CX, 252, 30, C.text, 800);
      text(`${Math.round(S.dist / 100) / 10} km  ·  top ${Math.round(S.base * KMH)} km/h`, CX, 290, 19, C.dim, 500);
      text(`${S.coins} coins  ·  best ${S.best}`, CX, 318, 19, C.dim, 500);
      if (S.newBest) text('New best!', CX, 350, 22, C.yellow, 800);
      const ready = performance.now() - S.overAt > RESTART_LOCK_MS;
      ctx.globalAlpha = ready ? blink : 0.25; text('Pinch to drive again', CX, 398, 24, C.text, 800); ctx.globalAlpha = 1;
    }
  }

  function render() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (S.shake > 0) { const m = S.shake * 18; ctx.translate((Math.random() - 0.5) * m, (Math.random() - 0.5) * m); }
    drawSky();
    drawGrid();
    drawRoad();
    drawRoadside();
    const live = S.objs.filter((o) => !o.dead).sort((a, b) => b.z - a.z);
    const under = (o) => o.z > 0 || o === S.onObj;
    for (const o of live) if (under(o)) drawObj(o);
    if (S.mode !== 'title') drawPlayer();
    for (const o of live) if (!under(o)) drawObj(o);
    drawParts();
    drawSpeedLines();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    if (S.flash > 0) { ctx.globalAlpha = S.flash * 0.8; ctx.fillStyle = '#ff2840'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
    drawHud();
  }

  // Desktop testing hook (not used by the game itself).
  window.__laneRunner = S;
  window.__laneRunnerDebug = { reset, update, render, addCar, addTruck, add, scheduleLaneChange, laneAt, edgeAt, baseSpeed };

  // ---------- loop: capped at ~30 fps to match the 30 Hz panel ----------
  let raf = 0, last = 0;
  function tick(t) {
    raf = requestAnimationFrame(tick);
    if (!last) { last = t; return; }
    const elapsed = t - last;
    if (elapsed < 30) return;
    last = t;
    update(Math.min(elapsed / 1000, 0.05));
    render();
  }
  function startLoop() { if (!raf) { last = 0; raf = requestAnimationFrame(tick); } }
  function stopLoop() { if (raf) { cancelAnimationFrame(raf); raf = 0; } }

  // Nothing may run while hidden.
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      if (S.mode === 'play') S.mode = 'paused';
      engine(false);
      stopLoop();
      if (actx && actx.state === 'running') actx.suspend();
    } else {
      startLoop();
    }
  });

  render();
  startLoop();
})();
</script>
</body>
</html>
