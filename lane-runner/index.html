<body>
<canvas id="c" width="600" height="600" aria-label="Lane Runner: Vapor Freeway"></canvas>
<script>
'use strict';
(() => {
  const W = 600, H = 600, BUILD = 'v8';
  const ctx = document.getElementById('c').getContext('2d');

  // ---------- tuning ----------
  const START_SPEED = 12, EARLY_ACCEL = 0.22, LATE_ACCEL = 0.07, MAX_SPEED = 42; // world units / s, keeps climbing
  const KMH = 8.5;                                     // world units / s → km/h on the speedo
  const BOOST_MULT = 1.6, BOOST_T = 2.5, NITRO_MULT = 1.6, BRAKE_MULT = 0.6, BRAKE_T = 0.7;
  const GRAVITY = 16, STEP = 0.22;                     // STEP: tallest ledge the car drives up (ramps)
  const LANE_SPEED = 7;                                // lanes / s
  const MIN_LANES = 3, MAX_LANES = 6, TAPER = 12;      // freeway lanes come and go; tapers are TAPER units long
  const HALF_LEN = 0.6, HALF_W = 0.38;                 // player hitbox
  const RESTART_LOCK_MS = 800;
  const HIT_WINDOW = 60, HIT_SLOW_T = 2.5;             // a second hit within HIT_WINDOW s wrecks you
  const SIGNAL_T = 0.8, EXIT_T = 0.7;                  // traffic indicates before changing lanes; exits fade out

  // ---------- pseudo-3D projection; the camera slides sideways with the car ----------
  const HORIZON = 150, GROUND = 515, CX = 300;
  const LANE_PX = 130, UNIT_PX = 120, FAR = 64, NEAR = -4;
  const SPAWN = FAR + 10; // things appear out here, fully transparent, and fade in on the way to FAR
  const scaleAt = (z) => S.D / (Math.max(z, -S.D * 0.85) + S.D);
  const X = (x, z) => CX + (x - S.cam) * LANE_PX * scaleAt(z);
  const Y = (z, h = 0) => { const s = scaleAt(z); return HORIZON + (GROUND - HORIZON) * s - (h - S.camH) * UNIT_PX * s; }; // camH: camera rises with big air
  const P = (x, z, h) => [X(x, z), Y(z, h)];
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const approach = (v, t, m) => (Math.abs(t - v) <= m ? t : v + Math.sign(t - v) * m);
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  const range = (a, b) => { const r = []; for (let i = a; i <= b; i++) r.push(i); return r; };
  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }

  const C = {
    pink: '#ff4fd8', cyan: '#35e0ff', purple: '#9b5cff', yellow: '#ffd23f', orange: '#ff8a3d',
    mint: '#3dffb5', red: '#ff3355', text: '#ffffff', dim: '#c3b4e6', chrome: '#9aa3b8',
    road: '#0d0418', grid: '#c21fb0', panel: '#140a22', tail: '#ff2a6d', body: '#0b0714', glass: '#061a26',
  };
  // Traffic, all seen from behind. h = roof height (what you'd drive on).
  const MODELS = {
    wedge: { w: 0.8, h: 0.5, len: 1.8, cols: [C.yellow, C.red, C.cyan], p: 3 },     // Countach
    delorean: { w: 0.78, h: 0.6, len: 1.8, cols: ['#d7e0ee'], p: 2 },
    muscle: { w: 0.82, h: 0.62, len: 2.0, cols: [C.orange, C.mint, C.pink], p: 3 },
    cop: { w: 0.78, h: 0.64, len: 1.9, cols: [C.text], p: 1 },
    van: { w: 0.8, h: 0.98, len: 2.0, cols: [C.purple, C.cyan], p: 2 },
    hatch: { w: 0.74, h: 0.62, len: 1.6, cols: [C.cyan, C.yellow, C.mint], p: 3 },
  };
  const MODEL_BAG = Object.entries(MODELS).flatMap(([k, m]) => Array(m.p).fill(k));
  const POWERS = {
    magnet: { label: 'MAGNET', color: C.cyan, dur: 10 },
    shield: { label: 'SHIELD', color: C.mint, dur: 15 },
    nitro: { label: 'NITRO', color: C.orange, dur: 5 },
    turbo: { label: 'BOOST FULL', color: C.purple, dur: 0 },
    double: { label: 'SCORE 2X', color: C.yellow, dur: 12 },
  };
  const SOLID = new Set(['car', 'truck', 'ramp', 'cones', 'barrier', 'kicker']);
  const VEHICLE = new Set(['car', 'truck', 'ramp']);
  const LIGHT = new Set(['cones', 'barrier']); // boosting smashes straight through these

  // Trick ramps: drive over one to launch into slow motion, then swipe the combo shown on screen.
  const KICK_LEN = 1.8, KICK_H = 0.65, LAUNCH_V = 8.5, SLOW = 0.3, TRICK_T = 0.42, CHAIN_T = 30;
  const TRICKS = { left: 'BARREL ROLL', right: 'CORKSCREW', up: 'KICKFLIP', down: 'BOP 360' };
  const DIR_LIST = Object.keys(TRICKS);

  // The freeway runs through zones, each with its own colours and roadside.
  const ZONE_LEN = 900;
  const ZONES = [
    { name: 'SUNSET STRIP', grid: '#c21fb0', edge: C.pink, props: 'palms' },
    { name: 'NEON CITY', grid: '#2f6bff', edge: C.cyan, props: 'towers' },
    { name: 'DESERT NIGHT', grid: '#d8641c', edge: C.orange, props: 'cacti' },
    { name: 'HYPER TUNNEL', grid: '#7a3cff', edge: C.purple, props: 'tunnel' },
  ];
  const zoneIndex = (w) => Math.floor(w / ZONE_LEN);
  const zoneAt = (w) => ZONES[((zoneIndex(w) % ZONES.length) + ZONES.length) % ZONES.length];

  // Timed events that change what the road throws at you.
  const EVENTS = {
    rush: { name: 'RUSH HOUR', col: C.red, dur: 18 },
    coins: { name: 'COIN RUSH', col: C.yellow, dur: 14 },
    stunt: { name: 'STUNT ZONE', col: C.pink, dur: 16 },
  };

  // ---------- state ----------
  const S = {
    mode: 'title', // title | play | paused | over
    t: 0, dist: 0, score: 0, coins: 0, base: START_SPEED, speed: START_SPEED, D: 7,
    road: freshRoad(), lane: 0, px: 0, y: 0, vy: 0, ground: 0, onObj: null,
    boost: 1, boostT: 0, brakeT: 0, hornT: 0, pw: {}, invuln: 0,
    objs: [], parts: [], sinceRow: 0, gapNext: 14, nextPower: 8, nextLane: 160,
    cam: 0, camH: 0, shake: 0, flash: 0, anim: 0, ui: 0, wobble: 0, bounce: 0, overAt: 0, toast: null, streak: 0, streakT: 0,
    trick: null, trickAnim: null, slow: 1, chain: 0, chainT: 0, nextKick: 180, event: null, nextEvent: 40, zone: 0, zoneBanner: null,
    lastHitT: -1e9, hitSlowT: 0, perfects: 0, squash: 0, hud: freshHud(), flyers: [], rings: [],
    best: loadBest(), newBest: false,
  };

  // Animated HUD state (real time): rolling score, pops, slide-ins.
  function freshHud() { return { score: 0, lastScore: 0, scorePop: 0, coinPop: 0, kick: 0, in: 0, overT: 0, dot: 0, dmgPop: 0, ready: 0, lastSeg: 1, flash: 0 }; }
  const easeOut = (t) => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
  const easeBack = (t) => { t = clamp(t, 0, 1); const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };

  function loadBest() { try { return Number(localStorage.getItem('laneRunner.vaporBest')) || 0; } catch { return 0; } }
  function saveBest(v) { try { localStorage.setItem('laneRunner.vaporBest', String(v)); } catch { /* storage unavailable */ } }
  const mult = () => (S.pw.double > 0 ? 2 : 1) * (1 + S.chain);
  const grounded = () => S.y <= S.ground + 0.001 && S.vy <= 0;
  const baseSpeed = (t) => Math.min(MAX_SPEED, t < 60 ? START_SPEED + t * EARLY_ACCEL : START_SPEED + 60 * EARLY_ACCEL + (t - 60) * LATE_ACCEL);

  function reset() {
    Object.assign(S, {
      mode: 'play', t: 0, dist: 0, score: 0, coins: 0, base: START_SPEED, speed: START_SPEED,
      road: freshRoad(), lane: 0, px: 0, y: 0, vy: 0, ground: 0, onObj: null,
      boost: 1, boostT: 0, brakeT: 0, hornT: 0, pw: {}, invuln: 0, objs: [], parts: [],
      sinceRow: 0, gapNext: 14, nextPower: 8, nextLane: 160, toast: null, streak: 0, streakT: 0, newBest: false,
      trick: null, trickAnim: null, slow: 1, chain: 0, chainT: 0, nextKick: 180, event: null, nextEvent: 40, zone: 0, zoneBanner: null,
      lastHitT: -1e9, hitSlowT: 0, perfects: 0, squash: 0, hud: freshHud(), flyers: [], rings: [],
    });
    toast('GO!', C.mint);
  }

  // ---------- the freeway: lanes open and end along the road ----------
  // Each side has a starting outermost lane and a list of changes at world distance w.
  // Opening: the new lane tapers in over TAPER and is usable from halfway through.
  // Ending: the lane is usable up to w (a chevron board sits there), then the edge tapers in.
  function freshRoad() { return { L: { v0: -1, ch: [] }, R: { v0: 1, ch: [] } }; }
  const dirOf = (side) => (side === 'L' ? -1 : 1);
  const isOpening = (side, c) => (c.to - c.from) * dirOf(side) > 0;
  function laneAt(side, w) {
    const sd = S.road[side];
    let v = sd.v0;
    for (const c of sd.ch) if (w >= (isOpening(side, c) ? c.w + TAPER * 0.5 : c.w)) v = c.to;
    return v;
  }
  function edgeAt(side, w) {
    const sd = S.road[side];
    let e = sd.v0;
    for (const c of sd.ch) if (w >= c.w) e = c.from + (c.to - c.from) * Math.min(1, (w - c.w) / TAPER);
    return e + dirOf(side) * 0.5;
  }
  const lastLane = (side) => { const ch = S.road[side].ch; return ch.length ? ch[ch.length - 1].to : S.road[side].v0; };

  function scheduleLaneChange() {
    const n = lastLane('R') - lastLane('L') + 1;
    const open = n <= MIN_LANES ? true : n >= MAX_LANES ? false : Math.random() < 0.5;
    const w = S.dist + SPAWN + 40;
    const sides = shuffle(['L', 'R']).filter((sd) => { const ch = S.road[sd].ch; return !ch.length || w - ch[ch.length - 1].w > TAPER + 40; });
    if (!sides.length) return;
    // End the lane with the least traffic in it, so fewer cars have to merge out.
    const busy = (sd) => S.objs.filter((o) => !o.dead && VEHICLE.has(o.kind) && Math.round(o.lane) === lastLane(sd)).length;
    if (!open) sides.sort((a, b) => busy(a) - busy(b));
    const side = sides[0], d = dirOf(side), from = lastLane(side), to = open ? from + d : from - d;
    S.road[side].ch.push({ w, from, to });
    if (open) add({ kind: 'sign', side, z: w - S.dist + TAPER * 0.5, text: 'NEW LANE', col: C.mint, dir: d });
    else {
      add({ kind: 'barrier', lane: from, z: w - S.dist, len: 0.6, w: 0.96, h: 1.5, dir: -d });
      for (const back of [36, 18]) add({ kind: 'sign', side, z: w - back - S.dist, text: 'LANE ENDS', col: C.yellow, dir: -d });
    }
  }

  function pruneRoad() {
    for (const side of ['L', 'R']) {
      const sd = S.road[side];
      while (sd.ch.length && sd.ch[0].w + TAPER < S.dist - 20) sd.v0 = sd.ch.shift().to;
    }
  }

  // ---------- audio (tiny synth blips + an engine drone; unlocked by the first pinch) ----------
  let actx = null, eng = null;
  function unlockAudio() {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
    } catch { actx = null; }
  }
  function tone(f1, f2, dur, type, vol, delay = 0) {
    if (!actx || actx.state !== 'running') return;
    const t0 = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f1, t0);
    o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(actx.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  function engine(on) {
    if (on && !eng && actx && actx.state === 'running') {
      const o = actx.createOscillator(), f = actx.createBiquadFilter(), g = actx.createGain();
      o.type = 'sawtooth'; f.type = 'lowpass'; f.frequency.value = 380; g.gain.value = 0.016;
      o.connect(f).connect(g).connect(actx.destination); o.start();
      eng = { o };
    } else if (!on && eng) { eng.o.stop(); eng = null; }
  }
  const sfx = {
    swish: () => tone(900, 600, 0.06, 'triangle', 0.05),
    bump: () => tone(120, 80, 0.12, 'square', 0.05),
    boost: () => { tone(90, 38, 0.6, 'sine', 0.14); tone(180, 900, 0.35, 'sawtooth', 0.06); tone(360, 1800, 0.45, 'triangle', 0.035); },
    ready: () => tone(1200, 1800, 0.09, 'triangle', 0.035),
    brake: () => tone(700, 300, 0.2, 'triangle', 0.03),
    horn: () => { tone(392, 392, 0.28, 'square', 0.035); tone(494, 494, 0.28, 'square', 0.03); },
    deny: () => tone(150, 110, 0.18, 'square', 0.05),
    coin: () => { const f = 1100 * (1 + Math.min(S.streak, 12) * 0.05); tone(f, f * 1.35, 0.08, 'square', 0.03); },
    near: () => tone(1500, 2400, 0.1, 'triangle', 0.04),
    power: () => [523, 659, 784, 1046].forEach((f, i) => tone(f, f * 1.01, 0.1, 'square', 0.035, i * 0.06)),
    smash: () => tone(320, 60, 0.25, 'sawtooth', 0.07),
    land: () => tone(160, 90, 0.08, 'triangle', 0.05),
    crash: () => tone(220, 40, 0.6, 'sawtooth', 0.09),
    launch: () => { tone(200, 1200, 0.4, 'sawtooth', 0.05); tone(900, 180, 0.6, 'triangle', 0.04, 0.15); },
    trick: (i) => tone(600 + i * 160, 900 + i * 220, 0.12, 'square', 0.04),
    perfect: () => [659, 784, 988, 1319, 1568].forEach((f, i) => tone(f, f * 1.01, 0.12, 'square', 0.04, i * 0.07)),
    hit: () => { tone(320, 70, 0.35, 'square', 0.08); tone(900, 200, 0.2, 'sawtooth', 0.04); },
    event: () => [392, 523, 392, 523].forEach((f, i) => tone(f, f, 0.09, 'square', 0.035, i * 0.1)),
  };

  // ---------- input ----------
  // Neural Band / temple touchpad: thumb swipes arrive as Arrow keys, index pinch as Enter.
  // Match on `key`: device events have an empty `code`. Escape (system Back) is left alone.
  const DIRS = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' };
  window.addEventListener('keydown', (e) => {
    const k = e.key || e.code;
    if (k === 'Enter' || k === ' ') {
      e.preventDefault();
      if (!e.repeat) onSelect();
      return;
    }
    const d = DIRS[k];
    if (d) {
      e.preventDefault();
      if (!e.repeat) onDir(d);
    }
  });

  function onSelect() {
    unlockAudio();
    if (S.mode === 'title') reset();
    else if (S.mode === 'play') honk();
    else if (S.mode === 'paused') S.mode = 'play';
    else if (S.mode === 'over' && performance.now() - S.overAt > RESTART_LOCK_MS) restart();
  }

  // Restart reloads from the server under a fresh URL so the glasses pick up any new build;
  // `go` skips the title screen. Offline, just reset in place.
  function restart() {
    if (navigator.onLine === false) { reset(); return; }
    engine(false);
    location.replace(`${location.pathname}?v=${Date.now()}&go=1`);
  }

  function onDir(d) {
    if (S.mode !== 'play') return;
    if (S.trick && S.trick.state === 'active' && !S.trick.landed) { trickInput(d); return; }
    if (d === 'left') steer(-1);
    else if (d === 'right') steer(1);
    else if (d === 'up') boost();
    else brake();
  }

  function steer(side) {
    const to = S.lane + side;
    if (to < laneAt('L', S.dist + 1) || to > laneAt('R', S.dist + 1)) { sfx.bump(); S.wobble = 0.07 * side; S.shake = 0.08; return; }
    S.lane = to; sfx.swish();
  }

  function boost() {
    if (S.boostT > 0) return;
    if (S.boost < 1) { sfx.deny(); toast('BOOST CHARGING', C.dim); return; }
    S.boost -= 1; S.boostT = BOOST_T; sfx.boost();
    // Make it hit: an instant jolt of speed, a FOV punch, a shockwave ring, shake and a flash.
    S.speed = Math.max(S.speed * 1.3, S.base * 1.3);
    S.hud.kick = 1; S.hud.flash = 1; S.shake = 0.3;
    ring(C.cyan); toast('BOOST!', C.cyan);
    burst(S.px, -0.7, S.y + 0.2, 18, C.cyan, 6, 0.5);
  }

  function brake() { S.brakeT = BRAKE_T; S.boostT = 0; sfx.brake(); }

  // Pinch = horn: traffic right in front of you tries to move over.
  function honk() {
    if (S.hornT > 0) return;
    S.hornT = 1.2; sfx.horn();
    for (const o of S.objs) {
      if (o.dead || !VEHICLE.has(o.kind) || o.mergeTo !== undefined || Math.round(o.lane) !== S.lane || o.z < 0 || o.z > 16) continue;
      for (const d of shuffle([-1, 1])) if (tryMerge(o, S.lane + d)) break;
    }
  }

  // ---------- tricks ----------
  // Sim seconds until you land on flat ground, from the current height and vertical speed.
  const airLeft = () => (S.vy + Math.sqrt(Math.max(0, S.vy * S.vy + 2 * GRAVITY * S.y))) / GRAVITY;

  function launch() {
    S.vy = LAUNCH_V + (S.boostT > 0 ? 1.5 : 0);
    const n = Math.min(5, 3 + (S.t > 60) + (S.t > 150));
    S.trick = { seq: Array.from({ length: n }, () => pick(DIR_LIST)), i: 0, state: 'active', total: airLeft(), landed: false, hide: 0 };
    // Traffic scatters from where you'll come down.
    for (const o of S.objs) {
      if (!o.dead && SOLID.has(o.kind) && o.kind !== 'kicker' && Math.abs(o.lane - S.lane) < 0.75 && o.z > 1 && o.z < 45) exitObj(o);
    }
    burst(S.px, 0.5, S.y, 16, C.pink, 5, 0.6);
    S.shake = 0.15; sfx.launch();
  }

  function trickInput(d) {
    const T = S.trick;
    if (d !== T.seq[T.i]) {
      T.state = 'fail'; T.failAt = S.ui; S.chain = 0; sfx.deny();
      return;
    }
    T.i++;
    const pts = 100 * T.i * mult();
    S.score += pts;
    S.trickAnim = { dir: d, t: 0 };
    (T.hitAt = T.hitAt || [])[T.i - 1] = S.ui;
    toast(`${TRICKS[d]} +${pts}`, C.cyan);
    burst(S.px, 0.3, S.y + 0.3, 10, pick([C.pink, C.cyan, C.yellow]), 4, 0.5);
    sfx.trick(T.i);
    if (T.i === T.seq.length) {
      T.state = 'done';
      S.chain = Math.min(4, S.chain + 1); S.chainT = CHAIN_T; S.perfects++;
      ring(C.mint);
      const bonus = 500 * mult();
      S.score += bonus; S.boost = Math.min(3, S.boost + 1);
      toast(`PERFECT! +${bonus}`, C.mint);
      sfx.perfect();
    }
  }

  function landTrick() {
    const T = S.trick;
    T.landed = true; T.hide = 1.3;
    S.trickAnim = null; S.squash = 1;
    S.shake = 0.2; S.bounce = -0.1;
    burst(S.px, 0, 0.1, 20, T.state === 'done' ? C.mint : C.cyan, 5, 0.6);
    sfx.land();
  }

  // ---------- events ----------
  function startEvent() {
    const kind = pick(Object.keys(EVENTS));
    S.event = { kind, t: EVENTS[kind].dur };
    if (kind === 'stunt') S.nextKick = 0;
    sfx.event();
  }

  // ---------- world ----------
  function add(o) { const r = Object.assign({ frac: 0, len: 0.3, w: 0.5, h: 0 }, o); S.objs.push(r); return r; }

  // Height of an object's surface at distance u past its rear (-1 = not under you).
  function surf(o, u) {
    if (u < 0 || u > o.len) return -1;
    if (o.kind === 'truck') return u > o.len - 1.4 ? 1.0 : o.h;
    if (o.kind === 'ramp') return u < 2.4 ? (o.h * u) / 2.4 : u > o.len - 1.4 ? 1.0 : o.h;
    if (o.kind === 'kicker') return (o.h * u) / o.len;
    return o.h;
  }

  function laneClearAt(l, z0, z1, except = null) {
    return !S.objs.some((o) => o !== except && !o.dead && !o.exiting && SOLID.has(o.kind) &&
      (Math.round(o.lane) === l || o.mergeTo === l) && o.z < z1 && o.z + o.len > z0);
  }

  function tryMerge(o, nl) {
    const w = S.dist + o.z;
    if (nl < laneAt('L', w + o.len) || nl > laneAt('R', w + o.len)) return false;
    if (!laneClearAt(nl, o.z - 2.5, o.z + o.len + 8, o)) return false; // room for the ~1 s the merge takes
    // Never cut in right in front of the player (or into the lane they're steering to).
    if ((Math.abs(nl - S.px) < 0.9 || nl === S.lane) && o.z < 14 && o.z + o.len > -3) return false;
    if (S.trick && nl === S.lane && o.z < 45) return false; // keep the landing zone clear
    o.mergeTo = nl; o.signal = SIGNAL_T; // indicate first, then move over
    return true;
  }

  function addCar(lane, z) {
    const model = pick(MODEL_BAG), M = MODELS[model];
    const car = add({ kind: 'car', model, lane, z, len: M.len, w: M.w, h: M.h, frac: rand(0.35, 0.55), col: pick(M.cols) });
    if (model === 'cop') car.frac = rand(0.55, 0.62);
    return car;
  }

  function addTruck(lane, z, kind, frac = rand(0.5, 0.58)) {
    const ramp = kind === 'ramp';
    const t = add({ kind: ramp ? 'ramp' : 'truck', model: kind, lane, z, len: 7.5, w: 0.9, h: ramp ? 1.0 : 1.2, frac, col: pick([C.purple, C.cyan, C.orange, C.pink]) });
    if (ramp || Math.random() < 0.3) for (let i = 0; i < 5; i++) add({ kind: 'coin', lane, z: z + (ramp ? 2.9 : 0.6) + i * 0.8, h: t.h + 0.35, ride: t });
    return t;
  }

  // A trick ramp, a coin trail leading onto it, and a coin arc along the flight path.
  function addKicker(lane, z) {
    add({ kind: 'kicker', lane, z, len: KICK_LEN, w: 0.9, h: KICK_H });
    for (let i = 0; i < 4; i++) add({ kind: 'coin', lane, z: z - 6 + i * 1.3, h: 0.35 });
    const v = S.base;
    for (let i = 0; i < 6; i++) {
      const d = 2 + i * 2.5, t = d / v;
      add({ kind: 'coin', lane, z: z + KICK_LEN + d, h: KICK_H + LAUNCH_V * t - 0.5 * GRAVITY * t * t + 0.3 });
    }
  }

  function coinLine(lane, z, n) { for (let i = 0; i < n; i++) add({ kind: 'coin', lane, z: z + i * 1.4, h: 0.35 }); }

  function spawnRow() {
    const w = S.dist + SPAWN;
    const all = range(laneAt('L', w), laneAt('R', w));
    const open = shuffle(all.filter((l) => laneClearAt(l, SPAWN - 10, SPAWN + 20)));
    if (!open.length) return;
    // Traffic only goes in lanes that don't end soon, and cones / ramps only go in lanes with no traffic
    // ahead that would have to swerve around them: both used to cause most of the lane changes.
    const lasting = (l) => l >= laneAt('L', w + 150) && l <= laneAt('R', w + 150);
    // A lane is quiet for a static placed at zs if every vehicle ahead in it will be overtaken by you before it could reach zs.
    const quiet = (l, zs = SPAWN + 8) => !S.objs.some((o) => {
      if (o.dead || o.exiting || !VEHICLE.has(o.kind) || o.z < -2 || !(Math.abs(o.lane - l) < 0.75 || o.mergeTo === l)) return false;
      const passed = (o.z + o.len) / Math.max(0.05, 1 - o.frac), reach = (zs - o.z - o.len) / Math.max(0.01, o.frac);
      return passed * 1.3 > reach;
    });
    open.sort((a, b) => lasting(b) - lasting(a));
    const ev = S.event && S.event.kind;
    let dens = Math.min(0.6, 0.25 + S.t / 240);
    if (ev === 'rush') dens = Math.min(0.85, dens + 0.3);
    if (ev === 'stunt') dens *= 0.6;
    let n = 0;
    for (let i = 0; i < open.length; i++) if (Math.random() < dens) n++;
    if (n === 0 && Math.random() < 0.6) n = 1;
    n = Math.min(n, all.length - 1, open.filter(lasting).length); // always leave a way through
    for (let i = 0; i < n; i++) {
      const l = open[i], r = Math.random();
      if (r < 0.14) addTruck(l, SPAWN, 'ramp');
      else if (r < 0.3) {
        const t = addTruck(l, SPAWN, Math.random() < 0.3 ? 'tanker' : 'semi');
        if (Math.random() < 0.25) addTruck(l, SPAWN + t.len + 1.2, 'semi', t.frac); // convoy
      } else addCar(l, SPAWN);
    }
    const rest = open.slice(n);
    if (S.nextKick <= 0 && rest.length) {
      const l = rest.find((k) => laneAt('L', w + 30) <= k && k <= laneAt('R', w + 30) && quiet(k));
      if (l !== undefined) {
        addKicker(l, SPAWN + 8);
        rest.splice(rest.indexOf(l), 1);
        S.nextKick = ev === 'stunt' ? rand(45, 70) : rand(300, 470);
      }
    }
    if (ev === 'coins') { for (const l of rest) coinLine(l, SPAWN + 1, 6); return; }
    if (rest.length) {
      const r = Math.random();
      if (r < 0.45) coinLine(rest[0], SPAWN + 1, 6);
      else if (r < 0.55 && S.t > 10 && quiet(rest[0])) add({ kind: 'cones', lane: rest[0], z: SPAWN + 2, len: 0.5, w: 0.9, h: 0.4 });
    }
  }

  function spawnPower() {
    const w = S.dist + SPAWN;
    const lanes = shuffle(range(laneAt('L', w), laneAt('R', w))).filter((l) => laneClearAt(l, SPAWN - 4, SPAWN + 3));
    if (lanes.length) add({ kind: 'power', power: pick(Object.keys(POWERS)), lane: lanes[0], z: SPAWN + 1, h: 0.55 });
  }

  function burst(x, z, h, n, color, spd = 3, life = 0.6) {
    for (let i = 0; i < n; i++) {
      S.parts.push({ x, z, h, vx: rand(-0.5, 0.5) * spd * 0.4, vz: rand(-0.5, 0.5) * spd, vh: rand(0.2, 1) * spd, life, max: life, color });
    }
    if (S.parts.length > 240) S.parts.splice(0, S.parts.length - 240);
  }

  function smash(o) {
    o.dead = true;
    for (const c of S.objs) if (c.ride === o) c.ride = null;
    burst(o.lane, Math.max(o.z, 0.5), (o.h || 0.5) / 2, 18, o.col || C.orange, 7, 0.8);
    S.score += 25 * mult(); S.shake = Math.max(S.shake, 0.15); sfx.smash();
  }

  function toast(text, color) { S.toast = { text, color, t: 1.4 }; }
  function ring(color) { S.rings.push({ t: 0, color }); }
  // A coin that flies from where you grabbed it into the HUD counter.
  function flyCoin(o) {
    if (S.flyers.length < 12) S.flyers.push({ x: X(o.lane, Math.max(o.z, NEAR)), y: Y(Math.max(o.z, NEAR), o.h), t: 0 });
  }

  function collectCoin(o) {
    S.coins++; S.streak++; S.streakT = 0.6;
    S.score += 10 * mult(); S.boost = Math.min(3, S.boost + 0.06);
    burst(o.lane, o.z, o.h, 4, C.yellow, 2, 0.35);
    flyCoin(o);
    sfx.coin();
  }

  function grantPower(kind, o) {
    if (kind === 'turbo') S.boost = 3; else S.pw[kind] = POWERS[kind].dur;
    toast(POWERS[kind].label, POWERS[kind].color);
    burst(o.lane, o.z, o.h, 14, POWERS[kind].color, 4, 0.6);
    ring(POWERS[kind].color);
    sfx.power();
  }

  function nearMiss() {
    S.score += 30 * mult(); S.boost = Math.min(3, S.boost + 0.15);
    toast('NEAR MISS +' + 30 * mult(), C.cyan); sfx.near();
  }

  // First hit: you're knocked down to half speed and damaged for HIT_WINDOW s. Hit again in that time: wrecked.
  function hit(o) {
    if (S.t - S.lastHitT < HIT_WINDOW) { crash(); return; }
    S.lastHitT = S.t; S.invuln = 1.5; S.hitSlowT = HIT_SLOW_T; S.speed *= 0.5; S.boostT = 0;
    S.shake = 0.35; S.flash = 0.25;
    burst(S.px, 0.6, S.y + 0.3, 16, C.orange, 5, 0.6);
    exitObj(o); // whatever you hit is knocked out of the way
    S.hud.dmgPop = 1;
    toast('HIT! ONE MORE = WRECKED', C.red); sfx.hit();
  }

  // Remove something without popping: it slides off the nearer side of the road and fades out.
  function exitObj(o) {
    if (o.exiting) return;
    const mid = (laneAt('L', S.dist + o.z) + laneAt('R', S.dist + o.z)) / 2;
    o.exiting = EXIT_T; o.exitDir = o.lane < mid ? -1 : 1; delete o.mergeTo;
    for (const c of S.objs) if (c.ride === o) { c.exiting = EXIT_T; c.exitDir = o.exitDir; }
  }

  // No impossible walls: if every lane is blocked at about the same distance, the furthest vehicle takes an exit.
  function fairness() {
    const solids = S.objs.filter((o) => !o.dead && !o.exiting && SOLID.has(o.kind) && o.kind !== 'kicker' && o.kind !== 'ramp');
    for (let z = 2; z < SPAWN; z += 1) {
      const w = S.dist + z, L = laneAt('L', w), R = laneAt('R', w), hits = [];
      for (let l = L; l <= R; l++) {
        const b = solids.find((o) => o.z < z + 1.5 && o.z + o.len > z - 1.5 && (Math.abs(o.lane - l) < 0.8 || o.mergeTo === l));
        if (!b) break;
        hits.push(b);
      }
      if (hits.length < R - L + 1) continue;
      const vehicles = hits.filter((o) => VEHICLE.has(o.kind)), pool = vehicles.length ? vehicles : hits;
      exitObj(pool.reduce((a, b) => (b.z > a.z ? b : a)));
      return;
    }
  }

  function crash() {
    S.mode = 'over'; S.overAt = performance.now(); S.shake = 0.45; S.flash = 0.35;
    for (const c of [C.pink, C.cyan, C.yellow]) burst(S.px, 0.3, S.y + 0.3, 14, c, 7, 1);
    sfx.crash(); engine(false);
    const sc = Math.floor(S.score);
    if (sc > S.best) { S.best = sc; S.newBest = true; saveBest(sc); }
  }

  // Faster traffic queues behind slower traffic instead of driving through it.
  function convoy() {
    const v = S.objs.filter((o) => !o.dead && !o.exiting && VEHICLE.has(o.kind)).sort((a, b) => a.z - b.z);
    for (let i = 0; i < v.length; i++) {
      for (let j = i + 1; j < v.length; j++) {
        if (Math.round(v[j].lane) !== Math.round(v[i].lane)) continue;
        if (v[j].z - (v[i].z + v[i].len) < 1.5 && v[i].frac > v[j].frac) v[i].frac = v[j].frac;
        break;
      }
    }
  }

  // Traffic in an ending lane signals and merges; if it can't, it takes the exit.
  function trafficMerges(dt) {
    for (const side of ['L', 'R']) {
      for (const c of S.road[side].ch) {
        if (isOpening(side, c)) continue;
        for (const o of S.objs) {
          if (o.dead || !VEHICLE.has(o.kind) || o.mergeTo !== undefined || Math.round(o.lane) !== c.from) continue;
          const gap = c.w - (S.dist + o.z + o.len);
          if (gap < 16 && gap > -2) tryMerge(o, c.to);
        }
      }
    }
    // Traffic never drives through things on the road (that used to hide them until the last moment):
    // it changes lanes around cones, lane-end boards and stopped cars, or brakes to a stop behind them.
    for (const o of S.objs) {
      if (o.dead || o.exiting || !VEHICLE.has(o.kind)) continue;
      const front = o.z + o.len;
      let gap = Infinity;
      for (const b of S.objs) {
        if (b === o || b.dead || b.exiting || Math.abs(b.lane - o.lane) > 0.75 || !(b.kind === 'cones' || b.kind === 'barrier' || b.kind === 'kicker' || b.stopped)) continue;
        if (b.z > front - 0.5) gap = Math.min(gap, b.z - front);
      }
      if (gap > 16) {
        if (o.stopped && o.mergeTo === undefined) { o.stopped = false; o.frac = o.cruise; } // clear again: pull away
        continue;
      }
      const merging = o.mergeTo !== undefined;
      if (!merging && !o.stopped && shuffle([-1, 1]).some((d) => tryMerge(o, Math.round(o.lane) + d))) continue;
      if (gap < 5 && !o.stopped) { o.stopped = true; o.cruise = o.frac; }
      if (o.stopped) o.frac = gap < 0.4 ? 0 : Math.max(0, o.frac - dt * 0.9);
    }
    for (const o of S.objs) {
      if (o.mergeTo === undefined) continue;
      if (o.signal > 0) { o.signal -= dt; continue; }
      o.lane = approach(o.lane, o.mergeTo, dt * 1.3);
      if (o.lane === o.mergeTo) delete o.mergeTo;
    }
  }

  function magnet(dt) {
    if (!(S.pw.magnet > 0)) return;
    const k = Math.min(1, dt * 7);
    for (const o of S.objs) {
      if (o.dead || o.kind !== 'coin' || o.z > 14 || o.z < -1 || Math.abs(o.lane - S.px) > 3) continue;
      o.ride = null; o.frac = 0;
      o.lane += (S.px - o.lane) * k;
      o.h += (S.y + 0.4 - o.h) * k;
      o.z -= o.z * Math.min(1, dt * 3);
    }
  }

  function step(h) {
    const dz = S.speed * h;
    S.dist += dz;
    S.score += dz * 0.5 * mult();

    // If a boost carried you through a lane-end board, you merge automatically.
    S.lane = clamp(S.lane, laneAt('L', S.dist), laneAt('R', S.dist));
    const diff = S.lane - S.px, mv = LANE_SPEED * h;
    S.px += Math.abs(diff) <= mv ? diff : Math.sign(diff) * mv;

    for (const o of S.objs) {
      o.z -= (S.speed - (o.ride ? o.ride.frac : o.frac) * S.base) * h;
      if (o.ride) o.lane = o.ride.lane;
    }

    S.sinceRow += dz;
    if (S.sinceRow >= S.gapNext) {
      S.sinceRow = 0;
      spawnRow();
      S.gapNext = Math.max(10, 17 - S.base * 0.2) + rand(0, 5);
    }
    if ((S.nextLane -= dz) <= 0) { scheduleLaneChange(); S.nextLane = rand(260, 420); }
    S.nextKick -= dz;

    // Solid things: drive up onto what's low enough (ramps, roofs), crash into what isn't.
    let ground = 0, on = null;
    for (const o of S.objs) {
      if (o.dead || o.exiting || !SOLID.has(o.kind)) continue;
      if (Math.abs(S.px - o.lane) >= HALF_W + o.w / 2) continue;
      const sF = surf(o, HALF_LEN - o.z), sC = surf(o, -o.z), sB = surf(o, -HALF_LEN - o.z);
      const top = Math.max(sF, sC, sB);
      if (top < 0) continue;
      if (Math.max(sF, sC) > S.y + STEP) {
        if (S.pw.nitro > 0 || (S.boostT > 0 && LIGHT.has(o.kind))) { smash(o); continue; }
        if (S.invuln > 0) continue;
        if (S.pw.shield > 0) { S.pw.shield = 0; S.invuln = 1.2; smash(o); toast('SHIELD SAVED YOU', C.mint); continue; }
        hit(o);
        if (S.mode !== 'play') return;
        continue;
      }
      if (top > ground) { ground = top; on = o; }
    }
    S.ground = ground; S.onObj = on;
    if (S.y < ground) { S.y = ground; if (S.vy < 0) S.vy = 0; }
    if (on && on.kind === 'kicker' && -on.z >= on.len - 0.3 && !S.trick) launch();
    if (S.y > ground || S.vy > 0) {
      S.vy -= GRAVITY * h;
      S.y += S.vy * h;
      if (S.y <= ground) {
        if (S.trick && !S.trick.landed) landTrick();
        else if (S.vy < -5) { sfx.land(); S.bounce = -0.06; S.squash = 0.6; burst(S.px, -0.4, ground, 6, C.cyan, 2, 0.35); }
        S.y = ground; S.vy = 0;
      }
    }

    for (const o of S.objs) {
      if (o.dead) continue;
      if (VEHICLE.has(o.kind) && !o.passed && o.z + o.len < -HALF_LEN) {
        o.passed = true;
        if (Math.abs(o.lane - S.px) < 1.3 && S.speed > 10 && S.onObj !== o) nearMiss();
        continue;
      }
      if (o.kind !== 'coin' && o.kind !== 'power') continue;
      if (Math.abs(o.z) > HALF_LEN + 0.25 || Math.abs(S.px - o.lane) > 0.6) continue;
      if (o.h < S.y - 0.25 || o.h > S.y + 0.95) continue;
      o.dead = true;
      if (o.kind === 'coin') collectCoin(o); else grantPower(o.power, o);
    }

    S.objs = S.objs.filter((o) => !o.dead && o.z + o.len > NEAR - 2);
  }

  function updateParts(dt) {
    for (const p of S.parts) {
      p.life -= dt;
      p.x += p.vx * dt; p.z += p.vz * dt - (S.mode === 'play' ? S.speed * dt : 0);
      p.vh -= 9 * dt; p.h = Math.max(0, p.h + p.vh * dt);
    }
    S.parts = S.parts.filter((p) => p.life > 0);
  }

  function update(dt) {
    // Real-time UI first; everything after this runs in (possibly slowed) world time.
    S.ui += dt;
    if (S.toast && (S.toast.t -= dt) <= 0) S.toast = null;
    if (S.zoneBanner && (S.zoneBanner.t -= dt) <= 0) S.zoneBanner = null;
    if (S.trickAnim && (S.trickAnim.t += dt) >= TRICK_T) S.trickAnim = null;
    if (S.trick && S.trick.landed && (S.trick.hide -= dt) <= 0) S.trick = null;
    const Hh = S.hud;
    if (S.score - Hh.lastScore > 40) Hh.scorePop = 1;
    Hh.lastScore = S.score;
    Hh.score += (S.score - Hh.score) * Math.min(1, dt * 10);
    Hh.scorePop = Math.max(0, Hh.scorePop - dt * 3); Hh.coinPop = Math.max(0, Hh.coinPop - dt * 4);
    Hh.kick = Math.max(0, Hh.kick - dt * 1.6); Hh.flash = Math.max(0, Hh.flash - dt * 4);
    Hh.dmgPop = Math.max(0, Hh.dmgPop - dt * 2); Hh.ready = Math.max(0, Hh.ready - dt * 2);
    Hh.in = S.mode === 'title' ? 0 : Math.min(1, Hh.in + dt * 2.5);
    Hh.overT = S.mode === 'over' ? Hh.overT + dt : 0;
    Hh.dot += (S.px - Hh.dot) * Math.min(1, dt * 12);
    const seg = Math.floor(S.boost);
    if (seg > Hh.lastSeg && S.mode === 'play') { Hh.ready = 1; sfx.ready(); }
    Hh.lastSeg = seg;
    for (const f of S.flyers) if ((f.t += dt) >= 0.45) Hh.coinPop = 1;
    S.flyers = S.flyers.filter((f) => f.t < 0.45);
    for (const r of S.rings) r.t += dt;
    S.rings = S.rings.filter((r) => r.t < 0.6);
    S.squash = Math.max(0, S.squash - dt * 4);

    const slowTarget = S.trick && S.trick.state === 'active' && !S.trick.landed ? SLOW : 1;
    S.slow = approach(S.slow, slowTarget, dt * 3);
    dt *= S.slow;

    S.anim += dt;
    S.shake = Math.max(0, S.shake - dt);
    S.flash = Math.max(0, S.flash - dt);
    S.wobble = approach(S.wobble, 0, dt * 0.4);
    S.bounce = approach(S.bounce, 0, dt * 0.4);
    updateParts(dt);

    const mid = (laneAt('L', S.dist) + laneAt('R', S.dist)) / 2;
    const camT = S.mode === 'title' ? Math.sin(S.anim * 0.4) * 0.6 : S.px * 0.75 + mid * 0.25;
    S.cam += (camT - S.cam) * Math.min(1, dt * 5);
    S.D += ((S.boostT > 0 || S.pw.nitro > 0 ? 5.7 : 7) - S.hud.kick * 1.2 - S.D) * Math.min(1, dt * 7); // FOV punch while boosting
    S.camH += ((S.trick && !S.trick.landed ? Math.max(0, S.y - 0.3) * 0.8 : 0) - S.camH) * Math.min(1, dt * 5);

    if (S.mode === 'title') { S.dist += 9 * dt; return; }
    if (S.mode !== 'play') return;
    S.t += dt;
    S.base = baseSpeed(S.t);
    const target = S.base * (S.boostT > 0 ? BOOST_MULT : 1) * (S.pw.nitro > 0 ? NITRO_MULT : 1) * (S.brakeT > 0 ? BRAKE_MULT : 1) * (S.hitSlowT > 0 ? 0.6 : 1);
    S.hitSlowT = Math.max(0, S.hitSlowT - dt);
    S.speed += (target - S.speed) * Math.min(1, dt * (target > S.speed ? 2.5 : 4));
    S.boostT = Math.max(0, S.boostT - dt);
    S.brakeT = Math.max(0, S.brakeT - dt);
    S.hornT = Math.max(0, S.hornT - dt);
    S.boost = Math.min(3, S.boost + dt * 0.04);

    if ((S.nextPower -= dt) <= 0) { spawnPower(); S.nextPower = rand(9, 15); }
    if (S.chain && !S.trick && (S.chainT -= dt) <= 0) S.chain = 0;
    if (S.event) { if ((S.event.t -= dt) <= 0) { S.event = null; S.nextEvent = rand(35, 55); } }
    else if ((S.nextEvent -= dt) <= 0 && S.t > 20) startEvent();

    if (S.t - S.lastHitT < HIT_WINDOW && Math.random() < 0.35) burst(S.px + rand(-0.2, 0.2), 0.8, S.y + 0.6, 1, '#8f86b8', 1, 0.7); // damage smoke
    if (S.trickAnim) burst(S.px + rand(-0.4, 0.4), 0.2, S.y + rand(0, 0.6), 1, pick([C.pink, C.cyan, C.yellow]), 2, 0.4);

  // ---------- drawing: pre-baked sky ----------
  const SUN_R = 110;
  const sunImg = (() => {
    const c = document.createElement('canvas'); c.width = SUN_R * 2 + 4; c.height = SUN_R + 2;
    const g = c.getContext('2d');
    const grd = g.createLinearGradient(0, 0, 0, SUN_R);
    grd.addColorStop(0, '#ffd23f'); grd.addColorStop(0.55, '#ff7a6b'); grd.addColorStop(1, '#ff2fb3');

    return c;
  })();

  const glowImg = (() => {
    const c = document.createElement('canvas'); c.width = W; c.height = 50;
    const g = c.getContext('2d'), grd = g.createLinearGradient(0, 50, 0, 0);
    grd.addColorStop(0, 'rgba(255,79,216,0.35)'); grd.addColorStop(1, 'rgba(255,79,216,0)');
    g.fillStyle = grd; g.fillRect(0, 0, W, 50);
    return c;
  })();

  const MT_W = 600, MT_H = 80;
  const mtImg = (() => {
    const c = document.createElement('canvas'); c.width = MT_W; c.height = MT_H + 2;
    const g = c.getContext('2d');
    const pts = [];
    for (let x = 0; x <= MT_W; x += 30) pts.push([x, MT_H - (x % 60 === 0 ? rand(35, MT_H - 4) : rand(8, 30))]);
    pts[pts.length - 1][1] = pts[0][1]; // seamless tile
    g.beginPath(); g.moveTo(0, MT_H + 2);
    for (const [x, y] of pts) g.lineTo(x, y);
    g.lineTo(MT_W, MT_H + 2); g.closePath();
    g.fillStyle = '#000'; g.fill();
    g.strokeStyle = C.purple; g.lineWidth = 2; g.lineJoin = 'round'; g.stroke();
    return c;
  })();

  const CITY_W = 380, CITY_H = 64;
  const cityImg = (() => {
    const c = document.createElement('canvas'); c.width = CITY_W; c.height = CITY_H;
    const g = c.getContext('2d');
    for (let x = 4; x < CITY_W - 20;) {
      const bw = rand(14, 32), mid = 1 - Math.abs(x - CITY_W / 2) / (CITY_W / 2);

    }
    return c;
  })();

  const STARS = Array.from({ length: 45 }, () => ({ x: rand(0, W), y: rand(8, HORIZON - 40), p: rand(0, 6) }));

  // ---------- drawing helpers ----------
  function line(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }

  // Flat shading: each object is one colour, lit from above (roof brightest, sides darkest).
  const shadeCache = new Map();
  function shade(hex, k) {

  // A solid box seen from behind, optionally yawed (front centre xF ≠ rear centre xR).
  // Draws whichever side faces the camera, then the roof, then the rear.
  function box(xR, xF, w, z0, z1, h0, h1, col) {
    if (z0 < NEAR) { if (z1 <= NEAR) return; xR += ((xF - xR) * (NEAR - z0)) / (z1 - z0); z0 = NEAR; }
    const hw = w / 2, dz = z1 - z0, dx = xF - xR, cz = -S.D;
    ctx.lineWidth = 1;
    if ((S.cam - (xR + hw)) * dz - (cz - z0) * dx > 0) face([P(xR + hw, z0, h0), P(xF + hw, z1, h0), P(xF + hw, z1, h1), P(xR + hw, z0, h1)], shade(col, 0.42));
    if ((xR - hw - S.cam) * dz + (cz - z0) * dx > 0) face([P(xR - hw, z0, h0), P(xF - hw, z1, h0), P(xF - hw, z1, h1), P(xR - hw, z0, h1)], shade(col, 0.42));
    face([P(xR - hw, z0, h1), P(xR + hw, z0, h1), P(xF + hw, z1, h1), P(xF - hw, z1, h1)], shade(col, 0.95));
    face([P(xR - hw, z0, h0), P(xR + hw, z0, h0), P(xR + hw, z0, h1), P(xR - hw, z0, h1)], shade(col, 0.7));
  }

  // Local 2D frame on a rear face: a = lanes across from centre, b = height above h0.
  function frame(x, z, h0) { const s = scaleAt(z); return { s, cx: X(x, z), by: Y(z, h0), U: LANE_PX * s, V: UNIT_PX * s }; }
  const fx = (f, a) => f.cx + a * f.U, fy = (f, b) => f.by - b * f.V;

  function fpoly(f, pts, fill) {

    for (let i = 1; i < pts.length; i++) ctx.lineTo(fx(f, pts[i][0]), fy(f, pts[i][1]));
    ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
  }
  function tyres(f, hw) {

  }
  function blinker(f, o, b) {
    if ((o.mergeTo === undefined && !o.stopped) || Math.sin(S.anim * 14) < 0) return;
    const sides = o.stopped ? [-1, 1] : [Math.sign(o.mergeTo - o.lane)]; // stopped = hazard lights
    for (const side of sides) {
      const ga = ctx.globalAlpha;
      ctx.globalAlpha = ga * 0.35; frect(f, side * (o.w / 2) - 0.13, b - 0.04, side * (o.w / 2) + 0.13, b + 0.15, C.orange);
      ctx.globalAlpha = ga; frect(f, side * (o.w / 2) - 0.08, b, side * (o.w / 2) + 0.08, b + 0.11, C.yellow);

  }

  function chevronRow(cx, cy, dir, n, size, gap) {
    ctx.beginPath();

      ctx.moveTo(x - dir * size * 0.5, cy - size); ctx.lineTo(x + dir * size * 0.5, cy); ctx.lineTo(x - dir * size * 0.5, cy + size);
    }
    ctx.stroke();
  }

  // ---------- scenery ----------
  // 0 outside the tunnel, easing to 1 once you're inside it (the sky fades out).
  function tunnelAmt() {
    if (zoneAt(S.dist).props !== 'tunnel') return 0;
    const d = S.dist - zoneIndex(S.dist) * ZONE_LEN;
    return clamp(Math.min(d, ZONE_LEN - d) / 30, 0, 1);
  }

  function drawSky() {
    const k = 1 - tunnelAmt();
    if (k <= 0) return;
    for (const s of STARS) {
      ctx.globalAlpha = k * (0.35 + 0.35 * Math.sin(S.anim * 2 + s.p));
      ctx.fillStyle = C.text; ctx.fillRect(s.x, s.y, 2, 2);
    }
    ctx.globalAlpha = 0.6 * k;
    ctx.drawImage(sunImg, CX - S.cam * 6 - SUN_R - 2, HORIZON - SUN_R - 1);
    ctx.globalAlpha = k;
    ctx.drawImage(glowImg, 0, HORIZON - 50);
    const ox = -(((S.cam * 14) % MT_W) + MT_W) % MT_W;
    for (let x = ox - MT_W; x < W; x += MT_W) ctx.drawImage(mtImg, x, HORIZON - MT_H);
    ctx.drawImage(cityImg, CX - CITY_W / 2 - S.cam * 9, HORIZON - CITY_H);
    ctx.strokeStyle = zoneAt(S.dist).edge; ctx.lineWidth = 2; ctx.globalAlpha = 0.8 * k; line(0, HORIZON, W, HORIZON);
    ctx.globalAlpha = 1;
  }

  function drawGrid() {
    const zf = SPAWN + 2;
    ctx.strokeStyle = zoneAt(S.dist).grid; ctx.lineWidth = 1.5;
    ctx.globalAlpha = 0.35;
    ctx.beginPath();
    const c0 = Math.floor(S.cam);
    for (let i = -16; i <= 16; i++) { const x = c0 + i + 0.5; ctx.moveTo(X(x, NEAR), Y(NEAR)); ctx.lineTo(X(x, zf), Y(zf)); }
    ctx.stroke();
    for (let z = -(S.dist % 4); z < zf; z += 4) {
      if (z < NEAR) continue;
      ctx.globalAlpha = clamp((zf - z) / FAR, 0.08, 0.5);
      line(0, Y(z), W, Y(z));
    }
    ctx.globalAlpha = 1;
  }

  function drawRoad() {
    const zf = SPAWN + 2, zs = [], eL = [], eR = [];
    for (let z = NEAR; z <= zf; z += 2) { zs.push(z); eL.push(edgeAt('L', S.dist + z)); eR.push(edgeAt('R', S.dist + z)); }
    const n = zs.length;

    ctx.fillStyle = C.road; ctx.globalAlpha = 0.95;
    ctx.beginPath();
    for (let i = 0; i < n; i++) ctx.lineTo(X(eL[i], zs[i]), Y(zs[i]));
    for (let i = n - 1; i >= 0; i--) ctx.lineTo(X(eR[i], zs[i]), Y(zs[i]));
    ctx.closePath(); ctx.fill();

    // Rumble strips hugging the (possibly tapering) edges.
    const edgeCol = zoneAt(S.dist).edge;
    ctx.globalAlpha = 0.7; ctx.fillStyle = edgeCol;
    ctx.beginPath();
    for (let z = -(S.dist % 3); z < zf; z += 3) {
      const z0 = Math.max(z, NEAR), z1 = z + 1.5;
      if (z1 <= NEAR) continue;
      for (const side of ['L', 'R']) {
        const d = -dirOf(side) * 0.1, a0 = edgeAt(side, S.dist + z0), a1 = edgeAt(side, S.dist + z1);
        ctx.moveTo(X(a0, z0), Y(z0)); ctx.lineTo(X(a0 + d, z0), Y(z0)); ctx.lineTo(X(a1 + d, z1), Y(z1)); ctx.lineTo(X(a1, z1), Y(z1)); ctx.closePath();
      }
    }
    ctx.fill();

    // Dashed lane dividers, only where both neighbouring lanes are full width.
    let lo = Infinity, hi = -Infinity;

        if (z1 <= NEAR || edgeAt('L', wm) > x - 0.95 || edgeAt('R', wm) < x + 0.95) continue;

    }
    ctx.globalAlpha = 1;
  }

  // A flashing arrow painted flat on the lane a car is moving into.
  function drawMergeArrows() {
    if (Math.sin(S.anim * 14) < 0) return;
    ctx.strokeStyle = C.orange;
    for (const o of S.objs) {
      if (o.dead || o.exiting || o.mergeTo === undefined || o.z + o.len < NEAR + 1) continue;
      const dir = Math.sign(o.mergeTo - o.lane) || Math.sign(o.mergeTo - Math.round(o.lane)) || 1, nl = o.mergeTo;
      const zc = Math.max(o.z + o.len / 2, NEAR + 1);

      ctx.lineWidth = Math.max(2, 11 * scaleAt(zc));

      for (const k of [0, 1]) {
        const bx = nl - dir * 0.32 + dir * k * 0.3;

      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function drawPalm(x, z, a) {
    const s = scaleAt(z), bx = X(x, z), by = Y(z), u = UNIT_PX * s;
    const lean = x < S.cam ? -1 : 1;
    const tx = bx + lean * 0.35 * u, ty = by - 2.6 * u;
    ctx.globalAlpha = a;
    ctx.strokeStyle = C.purple; ctx.lineWidth = Math.max(1.5, 7 * s);

  function drawTower(edge, side, z, k, a) {
    const w = 1.0 + hash(k + 0.5) * 0.9, x = edge + side * (1.7 + hash(k) * 1.4 + w / 2), h = 1.2 + hash(k + 0.25) * 1.6;
    const cols = ['#4a2a8a', '#1f3a8a', '#156a80', '#7a2466'], tops = [C.purple, '#3d6bff', C.cyan, C.pink], c = Math.floor(hash(k + 0.75) * 4);

  }

  function drawCactus(x, z, k, a) {

    ctx.moveTo(bx, by - h * 0.45); ctx.lineTo(bx - 0.28 * u, by - h * 0.45); ctx.lineTo(bx - 0.28 * u, by - h * 0.75);
    ctx.moveTo(bx, by - h * 0.6); ctx.lineTo(bx + 0.26 * u, by - h * 0.6); ctx.lineTo(bx + 0.26 * u, by - h * 0.85);

  function drawRing(eL, eR, z, k, a) {
    const xl = eL - 0.5, xr = eR + 0.5, top = 4.0; // taller than the camera, so rings sweep overhead
    ctx.globalAlpha = a;
    ctx.strokeStyle = (k / 2) % 2 ? C.purple : C.cyan; ctx.lineWidth = Math.max(2, 12 * scaleAt(z));
    ctx.beginPath(); ctx.moveTo(X(xl, z), Y(z)); ctx.lineTo(X(xl, z), Y(z, top)); ctx.lineTo(X(xr, z), Y(z, top)); ctx.lineTo(X(xr, z), Y(z)); ctx.stroke();
  }

  function drawRoadside() {
    const sp = 3;
    for (let z = FAR + 6 - ((S.dist + FAR + 6) % sp); z > NEAR + 1; z -= sp) {
      const a = clamp((FAR + 6 - z) / 12, 0, 1);

  // ---------- vehicles: flat-coloured shapes, one signature feature each ----------
  function drawCar(o) {
    const x = o.lane, z0 = o.z, z1 = z0 + o.len, col = o.col, hw = o.w / 2, m = o.model;
    const f = frame(x, Math.max(z0, NEAR), 0), near = z0 > NEAR;

    if (near) tyres(f, hw);
    if (m === 'van') box(x, x, o.w, z0, z1, 0.12, o.h, col);
    else { box(x, x, o.w, z0, z1, 0.1, low, col); box(x, x, m === 'wedge' ? 0.5 : 0.6, cz0, z1 - 0.4, low, o.h, col); }
    if (!near) return;
    const fc = frame(x, cz0, 0);
    if (m === 'van') frect(f, -0.33, 0.6, 0.33, 0.86, C.glass);
    else fpoly(fc, [[-0.23, low + 0.03], [0.23, low + 0.03], [0.18, o.h - 0.03], [-0.18, o.h - 0.03]], C.glass);
    if (m === 'delorean') frect(f, -hw + 0.02, 0.2, hw - 0.02, 0.33, '#101018');   // black tail panel
    if (m === 'muscle') { frect(f, -0.1, 0.1, -0.04, low, C.text); frect(f, 0.04, 0.1, 0.1, low, C.text); } // stripes
    if (m === 'wedge') {                                                            // big wing
      frect(f, -0.28, low, -0.24, 0.56, shade(col, 0.42)); frect(f, 0.24, low, 0.28, 0.56, shade(col, 0.42));
      frect(f, -0.45, 0.55, 0.45, 0.62, shade(col, 0.95));
    }
    if (m === 'cop') {                                                              // light bar
      const fb = frame(x, z0 + 0.9, 0), on = Math.sin(S.anim * 16) > 0;
      frect(fb, -0.24, o.h, 0, o.h + 0.08, on ? C.red : '#401018');
      frect(fb, 0, o.h, 0.24, o.h + 0.08, on ? '#18204a' : '#3d6bff');
    }
    const [t0, t1] = m === 'van' ? [0.16, 0.3] : [0.23, 0.31];
    frect(f, -hw + 0.04, t0, -hw + 0.22, t1, C.tail); frect(f, hw - 0.22, t0, hw - 0.04, t1, C.tail);
    blinker(f, o, 0.36);
  }

  function drawTruck(o) {
    const x = o.lane, z0 = o.z, z1 = z0 + o.len, col = o.col, hw = o.w / 2;
    const f = frame(x, Math.max(z0, NEAR), 0), near = z0 > NEAR;
    box(x, x, 0.84, z1 - 1.4, z1, 0.1, 1.0, '#c9d2e3');                          // cab at the far end
    if (near) tyres(f, hw);
    if (o.model === 'tanker') {
      for (let k = 4; k >= 0; k--) {                                                // a cylinder: discs far → near
        const zz = z0 + ((o.len - 1.5) * k) / 4;
        if (zz < NEAR) continue;
        const ff = frame(x, zz, 0);
        ctx.fillStyle = shade(col, k === 0 ? 0.7 : 0.45);
        ctx.beginPath(); ctx.ellipse(ff.cx, fy(ff, 0.66), hw * ff.U, 0.42 * ff.V, 0, 0, Math.PI * 2); ctx.fill();
      }
    } else if (o.model === 'semi') box(x, x, o.w, z0, z1 - 1.5, 0.28, o.h, col);
    else {
      // Car carrier: a yellow ramp to drive up and a flat deck to ride.
      box(x, x, o.w, z0 + 2.4, z1 - 1.5, 0.75, o.h, col);
      const r0 = Math.max(z0, NEAR), rh = (o.h * (r0 - z0)) / 2.4;
      if (r0 < z0 + 2.4) {
        ctx.lineWidth = 1;
        face([P(x - hw, r0, rh), P(x + hw, r0, rh), P(x + hw, z0 + 2.4, o.h), P(x - hw, z0 + 2.4, o.h)], shade(C.yellow, 0.85));
        ctx.strokeStyle = '#3a2a00'; ctx.lineWidth = Math.max(2, 7 * f.s);
        ctx.beginPath();
        for (let k = 0.5; k < 2.4; k += 0.8) {
          const zz = z0 + k;
          if (zz < NEAR) continue;
          const hh = (o.h * k) / 2.4;
          ctx.moveTo(X(x - o.w * 0.3, zz), Y(zz, hh)); ctx.lineTo(X(x, zz + 0.3), Y(zz + 0.3, hh + 0.12)); ctx.lineTo(X(x + o.w * 0.3, zz), Y(zz, hh));
        }
        ctx.stroke();
      }
    }
    if (near) { frect(f, -hw + 0.03, 0.18, -hw + 0.18, 0.26, C.tail); frect(f, hw - 0.18, 0.18, hw - 0.03, 0.26, C.tail); blinker(f, o, 0.3); }
  }

  // ---------- other road things ----------
  function drawPowerIcon(kind, x, y, r, color) {
    ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = Math.max(2, r * 0.2);
    ctx.beginPath();
    if (kind === 'magnet') {
      ctx.arc(x, y, r * 0.45, 0, Math.PI); ctx.moveTo(x - r * 0.45, y); ctx.lineTo(x - r * 0.45, y - r * 0.5);
      ctx.moveTo(x + r * 0.45, y); ctx.lineTo(x + r * 0.45, y - r * 0.5); ctx.stroke();
    } else if (kind === 'shield') {
      poly([[x, y - r * 0.65], [x + r * 0.55, y - r * 0.4], [x + r * 0.45, y + r * 0.25], [x, y + r * 0.65], [x - r * 0.45, y + r * 0.25], [x - r * 0.55, y - r * 0.4]]);
    } else if (kind === 'nitro') {
      poly([[x + r * 0.15, y - r * 0.7], [x - r * 0.4, y + r * 0.1], [x, y + r * 0.1], [x - r * 0.15, y + r * 0.7], [x + r * 0.4, y - r * 0.1], [x, y - r * 0.1]]);
    } else if (kind === 'turbo') {
      for (const dy of [-0.25, 0.25]) { ctx.moveTo(x - r * 0.45, y + (dy + 0.2) * r); ctx.lineTo(x, y + (dy - 0.2) * r); ctx.lineTo(x + r * 0.45, y + (dy + 0.2) * r); }
      ctx.stroke();
    } else {
      ctx.font = `900 ${Math.round(r * 0.9)}px system-ui, Roboto, sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('2X', x, y + 1);
    }
  }

  function drawObj(o) {
    const a = clamp((SPAWN - o.z) / 12, 0, 1) * (o.exiting ? clamp(o.exiting / EXIT_T, 0, 1) : 1); // fade in from the horizon, fade out on exit
    if (a <= 0) return;
    ctx.globalAlpha = a;
    const zc = Math.max(o.z, NEAR), s = scaleAt(zc), u = UNIT_PX * s;
    if (o.kind === 'car') drawCar(o);
    else if (o.kind === 'truck' || o.kind === 'ramp') drawTruck(o);
    else if (o.kind === 'coin') {
      const cx = X(o.lane, o.z), cy = Y(o.z, o.h), r = 0.15 * u;
      ctx.fillStyle = C.yellow;
      ctx.beginPath(); ctx.ellipse(cx, cy, Math.max(r * 0.25, r * Math.abs(Math.cos(S.anim * 5 + o.z))), r, 0, 0, Math.PI * 2); ctx.fill();
    } else if (o.kind === 'power') {
      const pc = POWERS[o.power].color, cx = X(o.lane, o.z), cy = Y(o.z, o.h + 0.08 * Math.sin(S.anim * 4)), r = 0.26 * u * (1 + 0.08 * Math.sin(S.anim * 8));
      ctx.fillStyle = pc; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
      drawPowerIcon(o.power, cx, cy, r * 0.8, C.body);
    } else if (o.kind === 'kicker') {
      // Trick ramp: a hot-pink wedge with yellow launch chevrons.
      const x = o.lane, hw = o.w / 2, z0 = Math.max(o.z, NEAR), z1 = o.z + o.len, h0 = (o.h * (z0 - o.z)) / o.len;
      if (z1 > NEAR) {
        ctx.lineWidth = 1;
        const sx = x + (x < S.cam ? hw : -hw);
        if (Math.abs(x - S.cam) > hw) face([P(sx, z0, 0), P(sx, z1, 0), P(sx, z1, o.h), P(sx, z0, h0)], shade(C.pink, 0.45));
        face([P(x - hw, z0, h0), P(x + hw, z0, h0), P(x + hw, z1, o.h), P(x - hw, z1, o.h)], Math.sin(S.anim * 10) > 0 ? C.pink : shade(C.pink, 0.8));
        ctx.strokeStyle = C.yellow; ctx.lineWidth = Math.max(2, 8 * s);
        ctx.beginPath();
        for (const k of [0.35, 0.95]) {
          const zz = o.z + k * o.len, hh = o.h * k;
          if (zz < NEAR) continue;
          ctx.moveTo(X(x - 0.28, zz), Y(zz, hh)); ctx.lineTo(X(x, zz + 0.35), Y(zz + 0.35, hh + 0.12)); ctx.lineTo(X(x + 0.28, zz), Y(zz, hh));
        }
        ctx.stroke();
      }
    } else if (o.kind === 'cones') {
      ctx.fillStyle = C.orange;
      for (const dx of [-0.3, 0, 0.3]) {
        const bx = X(o.lane + dx, o.z), by = Y(o.z), ty = Y(o.z, o.h), hw = 0.12 * LANE_PX * s;
        ctx.beginPath(); ctx.moveTo(bx - hw, by); ctx.lineTo(bx + hw, by); ctx.lineTo(bx, ty); ctx.closePath(); ctx.fill();
      }
    } else if (o.kind === 'barrier') {
      // Lane-end arrow board pointing where to merge.
      const f = frame(o.lane, zc, 0);
      frect(f, -0.38, 0, -0.32, 0.45, '#4a4f60'); frect(f, 0.32, 0, 0.38, 0.45, '#4a4f60');
      frect(f, -0.46, 0.45, 0.46, 1.35, Math.sin(S.anim * 8) > -0.2 ? shade(C.orange, 0.85) : shade(C.yellow, 0.85));
      ctx.strokeStyle = '#1c0a02'; ctx.lineWidth = Math.max(3, 14 * s);
      const cx = f.cx, cy = fy(f, 0.9), sz = 0.28 * f.V;
      ctx.beginPath(); ctx.moveTo(cx - o.dir * sz * 0.5, cy - sz); ctx.lineTo(cx + o.dir * sz * 0.5, cy); ctx.lineTo(cx - o.dir * sz * 0.5, cy + sz); ctx.stroke();
    } else if (o.kind === 'sign') {
      if (o.z < NEAR) return;
      const w = S.dist + o.z, f = frame(edgeAt(o.side, w) + dirOf(o.side) * 0.9, zc, 0);
      frect(f, -0.03, 0, 0.03, 1.4, '#4a4f60');
      frect(f, -0.55, 1.35, 0.55, 2.0, shade(o.col, 0.85));
      if (s > 0.16) {
        ctx.font = `900 ${Math.round(0.2 * f.V)}px system-ui, Roboto, sans-serif`;
        ctx.fillStyle = '#140a00'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(o.text, f.cx, fy(f, 1.675));
      }
    }
    ctx.globalAlpha = 1;
  }

  // Your ride: a pink wedge with a glowing taillight bar and neon underglow.
  // It yaws toward the lane it's heading for, rolls into the turn, and buzzes with the road.
  function drawPlayer() {
    const steer = clamp(S.lane - S.px, -1, 1), x = S.px, y = S.y + S.bounce, z0 = -0.6, z1 = 1.0, xF = x + steer * 0.35;
    const g0 = frame(x, 0.2, S.ground);
    for (const [lw, al] of [[10, 0.18], [2.5, 0.8]]) {
      ctx.globalAlpha = al * (0.8 + 0.2 * Math.sin(S.anim * 6)); ctx.strokeStyle = C.cyan; ctx.lineWidth = lw;
      ctx.beginPath(); ctx.ellipse(g0.cx, g0.by, 0.52 * g0.U, 10, 0, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.globalAlpha = S.invuln > 0 && Math.floor(S.anim * 16) % 2 ? 0.35 : 1;
    const f = frame(x, z0, y);
    // Tricks: ← / → barrel-roll, ↑ kickflip (hop + flip), ↓ bop (spin with a squash).
    let rot = -steer * 0.07 + S.wobble, sx = 1, sy = 1, lift = 0;
    if (S.trick && !S.trick.landed) rot += Math.sin(S.ui * 4) * 0.06;
    const A = S.trickAnim;
    if (A) {
      const t = A.t / TRICK_T, e = t * t * (3 - 2 * t);
      if (A.dir === 'left') rot -= e * Math.PI * 2;
      else if (A.dir === 'right') rot += e * Math.PI * 2;
      else if (A.dir === 'up') { sy = Math.cos(e * Math.PI * 2); lift = Math.sin(e * Math.PI) * 45; }
      else { sx = Math.cos(e * Math.PI * 2); sy = 1 - 0.3 * Math.sin(e * Math.PI * 2); lift = -Math.sin(e * Math.PI) * 12; }
    }
    sy *= 1 - 0.2 * S.squash; sx *= 1 + 0.12 * S.squash;
    const pcx = X(x, 0.2), pcy = Y(0.2, y + 0.3);
    ctx.save();
    ctx.translate(pcx, pcy - lift); ctx.rotate(rot); ctx.scale(sx, sy); ctx.translate(-pcx, -pcy);
    frect(f, -0.43, 0, -0.28, 0.17, '#07060c'); frect(f, 0.28, 0, 0.43, 0.17, '#07060c');
    box(x, xF, 0.86, z0, z1, y + 0.1, y + 0.38, C.pink);
    box(x, xF, 0.56, z0 + 0.55, z0 + 1.2, y + 0.38, y + 0.57, C.pink);
    fpoly(frame(x, z0 + 0.55, y), [[-0.24, 0.4], [0.24, 0.4], [0.19, 0.55], [-0.19, 0.55]], C.glass);
    fpoly(f, [[-0.45, 0.36], [0.45, 0.36], [0.46, 0.42], [-0.46, 0.42]], shade(C.pink, 0.95)); // lip spoiler
    const braking = S.brakeT > 0, ga = ctx.globalAlpha;
    if (braking) { ctx.globalAlpha = ga * 0.4; frect(f, -0.44, 0.15, 0.44, 0.35, C.tail); ctx.globalAlpha = ga; }
    frect(f, -0.39, 0.2, 0.39, 0.3, braking ? '#ff6b95' : C.tail);
    if (S.boostT > 0 || S.pw.nitro > 0) {
      const fc = S.pw.nitro > 0 ? C.orange : C.cyan, k = 1 + S.hud.kick;
      // Afterimages of the taillight bar smear toward the camera.
      for (let i = 1; i <= 3; i++) { ctx.globalAlpha = ga * 0.3 / i; frect(f, -0.39, 0.2 - i * 0.1, 0.39, 0.3 - i * 0.1, C.tail); }
      ctx.globalAlpha = ga;
      for (const a of [-0.2, 0.2]) {
        const ex = fx(f, a), ey = fy(f, 0.08), len = rand(40, 75) * k, wd = 11 * k;
        ctx.globalAlpha = ga * 0.35; ctx.fillStyle = fc;
        ctx.beginPath(); ctx.arc(ex, ey, wd * 1.3, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = ga; ctx.fillStyle = fc;
        ctx.beginPath(); ctx.moveTo(ex - wd, ey); ctx.lineTo(ex + wd, ey); ctx.lineTo(ex, ey + len); ctx.closePath(); ctx.fill();
        ctx.fillStyle = C.text;
        ctx.beginPath(); ctx.moveTo(ex - wd * 0.4, ey); ctx.lineTo(ex + wd * 0.4, ey); ctx.lineTo(ex, ey + len * 0.55); ctx.closePath(); ctx.fill();
      }
    }
    ctx.restore();
    if (S.pw.shield > 0) {
      ctx.globalAlpha = 0.45 + 0.25 * Math.sin(S.anim * 6); ctx.strokeStyle = C.mint; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(X(x, 0), Y(0, y + 0.35), 0.62 * LANE_PX, 0.55 * UNIT_PX, 0, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function drawParts() {
    for (const p of S.parts) {
      if (p.z < NEAR) continue;
      const s = scaleAt(p.z), sz = Math.max(2, 6 * s);
      ctx.globalAlpha = clamp(p.life / p.max, 0, 1); ctx.fillStyle = p.color;
      ctx.fillRect(X(p.x, p.z) - sz / 2, Y(p.z, p.h) - sz / 2, sz, sz);
    }
    ctx.globalAlpha = 1;
  }

  function drawSpeedLines() {
    const boosting = S.boostT > 0 || S.pw.nitro > 0;
    if (S.mode !== 'play' || !(boosting || S.speed > 30)) return;
    const n = boosting ? 30 : 10, col = S.pw.nitro > 0 ? C.orange : C.cyan;
    ctx.lineWidth = boosting ? 3 : 2;
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const ang = rand(0, Math.PI * 2), r0 = rand(150, 250), r1 = r0 + rand(60, 160) * (1 + S.hud.kick);
      ctx.moveTo(CX + Math.cos(ang) * r0, 300 + Math.sin(ang) * r0); ctx.lineTo(CX + Math.cos(ang) * r1, 300 + Math.sin(ang) * r1);
    }
    ctx.strokeStyle = boosting && Math.random() < 0.5 ? col : C.text; ctx.globalAlpha = boosting ? 0.45 : 0.18;
    ctx.stroke();
    if (boosting) { // glowing screen edges
      ctx.strokeStyle = col;
      for (const [x, a] of [[3, 0.8], [10, 0.35], [18, 0.15]]) {
        ctx.globalAlpha = a * (0.7 + 0.3 * Math.sin(S.ui * 20)); ctx.lineWidth = 6;
        line(x, 60, x, H - 60); line(W - x, 60, W - x, H - 60);
      }
    }
    ctx.globalAlpha = 1;
  }

  // Expanding shockwave rings around the car (boost, power-ups, perfect combos).
  function drawRings() {
    const cx = X(S.px, 0.2), cy = Y(0.2, S.y + 0.3);
    for (const r of S.rings) {
      const k = r.t / 0.6, e = easeOut(k);
      ctx.globalAlpha = (1 - k) * 0.9; ctx.strokeStyle = r.color; ctx.lineWidth = 8 * (1 - k) + 2;
      ctx.beginPath(); ctx.ellipse(cx, cy, 40 + e * 320, 20 + e * 160, 0, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  // ---------- HUD ----------
  const FONT = (w, s, it = '') => `${it}${w} ${s}px system-ui, -apple-system, Roboto, sans-serif`;
  function text(txt, x, y, size, color, weight = 700, align = 'center', it = '') {
    ctx.font = FONT(weight, size, it); ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'middle';
    ctx.fillText(txt, x, y);
  }
  // Vaporwave RGB-split text; `off` animates the split.
  function chroma(txt, y, size, x = CX, off = 3, color = C.text) {
    const ga = ctx.globalAlpha;
    ctx.globalAlpha = ga * 0.85;
    text(txt, x - off, y, size, C.pink, 900, 'center', 'italic ');
    text(txt, x + off, y + 1, size, C.cyan, 900, 'center', 'italic ');
    ctx.globalAlpha = ga;
    text(txt, x, y, size, color, 900, 'center', 'italic ');
  }
  // Text drawn scaled about its anchor, for pops and bounces.
  function scaledText(txt, x, y, size, color, sc, align = 'center', it = 'italic ', weight = 900) {
    ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc); text(txt, 0, 0, size, color, weight, align, it); ctx.restore();
  }
  // The HUD's building block: a dark rounded chip with a neon outline and a top sheen.
  function chip(x, y, w, h, accent, r = 12) {
    const ga = ctx.globalAlpha;
    ctx.globalAlpha = ga * 0.85; ctx.fillStyle = C.panel; rrect(x, y, w, h, r); ctx.fill();
    ctx.globalAlpha = ga * 0.95; ctx.strokeStyle = accent; ctx.lineWidth = 2; ctx.stroke();
    ctx.globalAlpha = ga * 0.3; ctx.strokeStyle = C.text; ctx.lineWidth = 1.5; line(x + r, y + 4, x + w - r, y + 4);
    ctx.globalAlpha = ga;
  }
  function label(txt, x, y, color = C.dim, align = 'left') { text(txt, x, y, 11, color, 800, align); }
  function panel(y, h, accent = C.pink, sc = 1) {
    ctx.save(); ctx.translate(CX, y + h / 2); ctx.scale(sc, sc); ctx.translate(-CX, -(y + h / 2));
    chip(CX - 250, y, 500, h, accent, 24);
  }

  function drawSpeedo(slide) {
    const cx = 528, cy = 538 + slide, r = 48, a0 = Math.PI * 0.8, a1 = Math.PI * 2.2;
    const kmh = Math.round(S.speed * KMH), frac = clamp(kmh / 450, 0, 1), boosting = S.boostT > 0 || S.pw.nitro > 0;
    const col = boosting ? (S.pw.nitro > 0 ? C.orange : C.cyan) : kmh < 180 ? C.mint : kmh < 280 ? C.yellow : C.pink;
    ctx.globalAlpha = 0.85; ctx.fillStyle = C.panel; ctx.beginPath(); ctx.arc(cx, cy, r + 12, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
    ctx.lineWidth = 8; ctx.strokeStyle = '#2a1640';
    ctx.beginPath(); ctx.arc(cx, cy, r, a0, a1); ctx.stroke();
    if (boosting) { ctx.globalAlpha = 0.35; ctx.lineWidth = 16; ctx.strokeStyle = col; ctx.beginPath(); ctx.arc(cx, cy, r, a0, a0 + (a1 - a0) * frac); ctx.stroke(); ctx.globalAlpha = 1; }
    ctx.lineWidth = 8; ctx.strokeStyle = col;
    ctx.beginPath(); ctx.arc(cx, cy, r, a0, a0 + (a1 - a0) * frac); ctx.stroke();
    const tip = a0 + (a1 - a0) * frac;
    ctx.fillStyle = C.text; ctx.beginPath(); ctx.arc(cx + Math.cos(tip) * r, cy + Math.sin(tip) * r, 5, 0, Math.PI * 2); ctx.fill();
    scaledText(String(kmh), cx, cy - 4, 28, C.text, 1 + S.hud.kick * 0.3);
    label('KM/H', cx, cy + 20, col, 'center');
  }

  function drawBoostBar(slide) {
    const w = 236, x0 = CX - w / 2, y = H - 44 + slide, boosting = S.boostT > 0;
    chip(x0, y, w, 34, boosting ? C.text : C.cyan);
    label('BOOST', x0 + 12, y + 17, boosting ? C.cyan : C.dim);
    for (let i = 0; i < 3; i++) {
      const x = x0 + 62 + i * 52, fill = clamp(S.boost - i, 0, 1), full = fill >= 1;
      ctx.fillStyle = '#10223a'; rrect(x, y + 10, 46, 14, 5); ctx.fill();
      if (fill > 0) {
        if (full) { ctx.globalAlpha = 0.3 + 0.15 * Math.sin(S.ui * 6 + i); ctx.fillStyle = C.cyan; rrect(x - 3, y + 7, 52, 20, 7); ctx.fill(); ctx.globalAlpha = 1; }
        ctx.fillStyle = full ? C.cyan : '#1e7f93'; rrect(x, y + 10, Math.max(6, 46 * fill), 14, 5); ctx.fill();
      }
      if (full && i === Math.floor(S.boost) - 1 && S.hud.ready > 0) { ctx.globalAlpha = S.hud.ready; ctx.fillStyle = C.text; rrect(x, y + 10, 46, 14, 5); ctx.fill(); ctx.globalAlpha = 1; }
    }
    if (boosting) { // time left, draining across the whole meter
      ctx.fillStyle = C.text; ctx.fillRect(x0 + 62, y + 28, 150 * (S.boostT / BOOST_T), 3);
    } else if (S.boost >= 1) {
      const bob = Math.sin(S.ui * 6) * 3;
      ctx.globalAlpha = 0.6 + 0.4 * Math.sin(S.ui * 6);
      drawArrow('up', x0 + w + 16, y + 17 + bob, 9, C.cyan);
      ctx.globalAlpha = 1;
    }
  }

  function drawArrow(dir, cx, cy, r, color) {
    ctx.save(); ctx.translate(cx, cy); ctx.rotate({ right: 0, down: Math.PI / 2, left: Math.PI, up: -Math.PI / 2 }[dir]);
    ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = r * 0.45;
    ctx.beginPath(); ctx.moveTo(-r, 0); ctx.lineTo(r * 0.1, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(r, 0); ctx.lineTo(0, -r * 0.8); ctx.lineTo(0, r * 0.8); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // The combo: one icon per swipe, lit (with a bounce) as you land each trick, plus the air time you have left.
  function drawTrickHud() {
    const T = S.trick;
    if (!T) return;
    const n = T.seq.length, bs = 52, gap = 12, w = n * bs + (n - 1) * gap, x0 = CX - w / 2, y0 = 84;
    const age = S.ui - (T.born || (T.born = S.ui));
    ctx.globalAlpha = (T.landed ? clamp(T.hide / 0.4, 0, 1) : 1) * clamp(age / 0.15, 0, 1);
    const ga = ctx.globalAlpha;
    const [head, hc] = T.state === 'done' ? ['PERFECT COMBO!', C.mint] : T.state === 'fail' ? ['COMBO BROKEN', C.red] : T.landed ? ['TOO SLOW', C.orange] : ['TRICK TIME', C.pink];
    const shakeX = T.state === 'fail' ? Math.sin(S.ui * 60) * 6 * clamp(1 - (S.ui - T.failAt) / 0.4, 0, 1) : 0;
    if (T.state === 'done') chroma(head, y0 - 24, 24, CX, 2 + Math.sin(S.ui * 20) * 2, C.mint);
    else scaledText(head, CX + shakeX, y0 - 24, 22, hc, 0.9 + 0.1 * easeBack(age / 0.3));
    text(`${T.i}/${n}`, x0 + w + 14, y0 + bs / 2, 18, C.dim, 800, 'left');
    for (let i = 0; i < n; i++) {
      const x = x0 + i * (bs + gap), hit = i < T.i, miss = T.state === 'fail' && i === T.i;
      const next = T.state === 'active' && !T.landed && i === T.i;
      const enter = easeBack((age - i * 0.06) / 0.25);                    // icons drop in one by one
      const bounce = hit && T.hitAt && T.hitAt[i] !== undefined ? 1 + 0.35 * (1 - easeOut((S.ui - T.hitAt[i]) / 0.3)) : 1;
      const pulse = next ? 1 + 0.08 * Math.sin(S.ui * 12) : 1, sz = bs * pulse * bounce * enter;
      if (sz <= 1) continue;
      const cx = x + bs / 2, cy = y0 + bs / 2 + (1 - enter) * -20;
      ctx.globalAlpha = ga * (hit || miss || next ? 1 : 0.55);
      if (hit || next) { ctx.globalAlpha *= 0.35; ctx.fillStyle = hit ? C.mint : C.pink; rrect(cx - sz / 2 - 5, cy - sz / 2 - 5, sz + 10, sz + 10, 15); ctx.fill(); ctx.globalAlpha = ga; }
      ctx.fillStyle = hit ? C.mint : miss ? C.red : next ? '#3a1a5a' : C.panel;
      rrect(cx - sz / 2, cy - sz / 2, sz, sz, 12); ctx.fill();
      if (next) { ctx.strokeStyle = C.text; ctx.lineWidth = 3; ctx.stroke(); }
      drawArrow(T.seq[i], cx, cy, sz * 0.28, hit || miss ? C.body : next ? C.text : C.dim);
    }
    ctx.globalAlpha = ga;
    const frac = T.state === 'done' ? 1 : T.landed ? 0 : clamp(airLeft() / T.total, 0, 1);
    ctx.fillStyle = '#2a1640'; rrect(x0, y0 + bs + 12, w, 8, 4); ctx.fill();
    ctx.fillStyle = T.state === 'done' ? C.mint : frac < 0.3 ? C.red : C.pink; rrect(x0, y0 + bs + 12, Math.max(8, w * frac), 8, 4); ctx.fill();
    ctx.globalAlpha = 1;
  }

  function drawPlayHud() {
    const Hh = S.hud, slideT = (1 - easeOut(Hh.in)) * -90, slideB = (1 - easeOut(Hh.in)) * 90;

    // Score (rolls up, pops on big gains) and the multiplier badge.
    chip(14, 12 + slideT, 168, 54, C.pink);
    label('SCORE', 28, 27 + slideT);
    scaledText(String(Math.floor(Hh.score)), 28, 48 + slideT, 26, C.text, 1 + Hh.scorePop * 0.25, 'left', '', 900);
    if (mult() > 1) {
      const bc = S.chain ? C.mint : C.yellow, pop = 1 + 0.08 * Math.sin(S.ui * 8);
      ctx.save(); ctx.translate(214, 39 + slideT); ctx.scale(pop, pop);
      ctx.fillStyle = bc; rrect(-26, -15, 52, 30, 15); ctx.fill();
      text(`x${mult()}`, 0, 1, 18, C.body, 900, 'center', 'italic ');
      ctx.restore();
    }
    let y2 = 74 + slideT;
    if (S.chain) {
      label('STYLE', 16, y2 + 4, C.mint);
      ctx.fillStyle = '#123'; rrect(58, y2, 124, 7, 3); ctx.fill();
      ctx.fillStyle = C.mint; rrect(58, y2, Math.max(6, 124 * clamp(S.chainT / CHAIN_T, 0, 1)), 7, 3); ctx.fill();
      y2 += 16;
    }
    if (S.t - S.lastHitT < HIT_WINDOW && S.mode === 'play') {
      const left = HIT_WINDOW - (S.t - S.lastHitT), on = left > 5 || Math.sin(S.ui * 12) > 0;
      const sh = Math.sin(S.ui * 50) * 8 * Hh.dmgPop;
      ctx.save(); ctx.translate(sh, 0);
      chip(14, y2, 168, 32, C.red, 10);
      text('DAMAGED', 26, y2 + 14, 15, on ? C.red : C.orange, 900, 'left', 'italic ');
      text(String(Math.ceil(left)), 170, y2 + 14, 15, C.text, 800, 'right');
      ctx.fillStyle = C.red; ctx.fillRect(24, y2 + 25, 148 * clamp(left / HIT_WINDOW, 0, 1), 3);
      ctx.restore();
    }

    // Coins, with the flying coins landing in the counter.
    chip(418, 12 + slideT, 168, 54, C.yellow);
    label('COINS', 432, 27 + slideT);
    const cs = 1 + Hh.coinPop * 0.35;
    ctx.fillStyle = C.yellow; ctx.beginPath();
    ctx.ellipse(446, 48 + slideT, Math.max(2, 9 * Math.abs(Math.cos(S.ui * 3))) * cs, 10 * cs, 0, 0, Math.PI * 2); ctx.fill();
    scaledText(String(S.coins), 572, 48 + slideT, 26, C.yellow, cs, 'right', '', 900);
    for (const f of S.flyers) {
      const e = easeOut(f.t / 0.45), fxp = f.x + (446 - f.x) * e, fyp = f.y + (48 - f.y) * e - Math.sin(e * Math.PI) * 60;
      ctx.fillStyle = C.yellow; ctx.beginPath(); ctx.arc(fxp, fyp, 7 - e * 2, 0, Math.PI * 2); ctx.fill();
    }

    // Lane map: slots for the lanes here, a sliding dot for you, and a blink on a lane that's about to end.
    const L = laneAt('L', S.dist), R = laneAt('R', S.dist), n = R - L + 1, bw = 18, gap = 6, mw = n * bw + (n - 1) * gap, x0 = CX - mw / 2;
    chip(x0 - 10, 12 + slideT, mw + 20, 40, C.cyan);
    for (let i = 0; i < n; i++) {
      let ending = false;
      for (const side of ['L', 'R']) for (const c of S.road[side].ch) if (!isOpening(side, c) && c.from === L + i && c.w - S.dist > 0 && c.w - S.dist < 80) ending = true;
      ctx.fillStyle = ending && Math.sin(S.ui * 10) > 0 ? '#5a3a08' : '#2e1d4d';
      rrect(x0 + i * (bw + gap), 20 + slideT, bw, 24, 5); ctx.fill();
      ctx.strokeStyle = ending ? C.yellow : '#4f7fa0'; ctx.lineWidth = 1.5; ctx.stroke();
    }
    const dx = x0 + (Hh.dot - L) * (bw + gap) + bw / 2;
    ctx.globalAlpha = 0.35; ctx.fillStyle = C.pink; ctx.beginPath(); ctx.arc(dx, 32 + slideT, 11, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1; ctx.beginPath(); ctx.arc(dx, 32 + slideT, 6, 0, Math.PI * 2); ctx.fill();

    // Active power-ups, bottom left.
    let py = H - 64 + slideB;
    for (const k of Object.keys(POWERS)) {
      const left = S.pw[k] || 0;
      if (left <= 0) continue;
      chip(14, py - 18, 128, 36, POWERS[k].color, 10);
      drawPowerIcon(k, 34, py, 14, POWERS[k].color);
      ctx.fillStyle = POWERS[k].color; rrect(54, py - 3, 76 * Math.min(1, left / POWERS[k].dur), 6, 3); ctx.fill();
      py -= 44;
    }
    drawSpeedo(slideB);
    drawBoostBar(slideB);
    if (S.mode !== 'play') return;
    drawTrickHud();

    if (S.event && !S.trick) {
      const E = EVENTS[S.event.kind], age = E.dur - S.event.t, sc = easeBack(age / 0.35);
      ctx.save(); ctx.translate(CX, 133); ctx.scale(sc, sc);
      chip(-96, -16, 192, 32, E.col, 16);
      text(E.name, 0, -2, 16, E.col, 900, 'center', 'italic ');
      ctx.fillStyle = E.col; ctx.fillRect(-76, 10, 152 * clamp(S.event.t / E.dur, 0, 1), 3);
      ctx.restore();
    }
    if (S.zoneBanner) {
      const t = 2.4 - S.zoneBanner.t, inX = (1 - easeOut(t / 0.45)) * -420, outX = S.zoneBanner.t < 0.4 ? (1 - S.zoneBanner.t / 0.4) * 420 : 0;
      ctx.save(); ctx.translate(inX + outX, 0);
      text('ENTERING', CX, 200, 14, C.dim, 800);
      chroma(S.zoneBanner.name, 230, 36, CX, 3 + Math.sin(S.ui * 9) * 1.5, C.text);
      ctx.restore();
    }

    // Your lane is about to end: say which way to merge.
    if (!S.trick) {
      for (const side of ['L', 'R']) {
        for (const c of S.road[side].ch) {
          const ahead = c.w - S.dist;
          if (isOpening(side, c) || c.from !== S.lane || ahead < 0 || ahead > 55) continue;
          const sc = 1 + 0.04 * Math.sin(S.ui * 10);
          ctx.save(); ctx.translate(CX, 86); ctx.scale(sc, sc);
          ctx.fillStyle = '#2a1a02'; ctx.globalAlpha = 0.9; rrect(-170, -24, 340, 48, 14); ctx.fill();
          ctx.globalAlpha = 1; ctx.strokeStyle = C.yellow; ctx.lineWidth = 2; ctx.stroke();
          text('LANE ENDS · MERGE', -8 * dirOf(side), 0, 21, C.yellow, 900, 'center', 'italic ');
          ctx.strokeStyle = C.yellow; ctx.lineWidth = 4;
          chevronRow(dirOf(side) * -140 + Math.sin(S.ui * 8) * 4 * -dirOf(side), 0, -dirOf(side), 2, 9, 12);
          ctx.restore();
        }
      }
    }

    // Toasts pop in with a little overshoot, then drift up and fade.
    if (S.toast) {
      const age = 1.4 - S.toast.t, sc = easeBack(age / 0.22), y = (S.trick ? 200 : 176) - age * 14;
      ctx.globalAlpha = clamp(S.toast.t / 0.4, 0, 1);
      ctx.save(); ctx.translate(CX, y); ctx.scale(sc, sc);
      chroma(S.toast.text, 0, 30, 0, 2.5, S.toast.color);
      ctx.restore();
      ctx.globalAlpha = 1;
    }
  }

  function keyChip(k, x, y) {
    ctx.font = FONT(800, 16); const w = ctx.measureText(k).width + 20;
    chip(x - w, y - 14, w, 28, C.cyan, 8);
    text(k, x - w / 2, y + 1, 16, C.cyan, 800);
  }

  function drawTitle() {
    const t = S.ui, inS = easeBack(t / 0.5);
    panel(104, 432, C.pink, inS);
    const bob = Math.sin(t * 2) * 3;
    chroma('LANE RUNNER', 152 + bob, 52, CX, 3 + Math.sin(t * 3) * 2);
    text('V A P O R   F R E E W A Y', CX, 196, 17, C.pink, 700);
    const rows = [['← →', 'change lanes'], ['↑', 'boost · smashes cones & boards'], ['↓', 'brake'], ['pinch', 'horn: traffic moves over']];
    rows.forEach(([k, v], i) => {
      const a = clamp((t - 0.25 - i * 0.08) / 0.3, 0, 1);
      ctx.globalAlpha = a;
      keyChip(k, CX - 58 + (1 - a) * -20, 238 + i * 36);
      text(v, CX - 44, 239 + i * 36, 16, C.dim, 600, 'left');
    });
    ctx.globalAlpha = clamp((t - 0.6) / 0.3, 0, 1);
    text('Hit pink TRICK ramps, then swipe the combo!', CX, 392, 15, C.pink, 800);
    text('One hit slows you. Two in a minute: wrecked.', CX, 414, 15, C.yellow, 700);
    const pulse = 1 + 0.05 * Math.sin(t * 5);
    ctx.save(); ctx.translate(CX, 462); ctx.scale(pulse, pulse);
    ctx.globalAlpha *= 0.3; ctx.fillStyle = C.pink; rrect(-128, -26, 256, 52, 26); ctx.fill();
    ctx.globalAlpha = clamp((t - 0.6) / 0.3, 0, 1); ctx.fillStyle = C.pink; rrect(-118, -21, 236, 42, 21); ctx.fill();
    text('PINCH TO START', 0, 1, 20, C.body, 900, 'center', 'italic ');
    ctx.restore();
    if (S.best) text(`BEST ${S.best}`, CX, 506, 15, C.yellow, 800);
    text(BUILD, CX + 236, 524, 11, C.dim, 600, 'right');
    ctx.restore(); ctx.globalAlpha = 1;
  }

  function statChip(x, y, big, small, color, a) {
    ctx.globalAlpha = a;
    chip(x, y, 200, 50, color, 12);
    text(big, x + 14, y + 22, 20, C.text, 900, 'left', 'italic ');
    label(small, x + 14, y + 40, color);
  }

  function drawOver() {
    const t = S.hud.overT, sc = easeBack(t / 0.45);
    panel(112, 376, C.red, sc);
    const jolt = t < 0.4 ? Math.sin(t * 80) * 6 * (1 - t / 0.4) : 0;
    chroma('WRECKED', 158, 48, CX + jolt, 3 + Math.sin(S.ui * 7) * 2);
    const shown = Math.floor(S.score * easeOut((t - 0.3) / 1.0));
    label('SCORE', CX, 196, C.dim, 'center');
    scaledText(String(shown), CX, 226, 40, C.text, 1, 'center', 'italic ');
    if (S.newBest && t > 1.3) {
      const p = 1 + 0.08 * Math.sin(S.ui * 8);
      ctx.save(); ctx.translate(CX, 262); ctx.scale(p, p);
      ctx.fillStyle = C.yellow; rrect(-62, -13, 124, 26, 13); ctx.fill();
      text('NEW BEST!', 0, 1, 15, C.body, 900, 'center', 'italic ');
      ctx.restore();
    } else text(`BEST ${S.best}`, CX, 262, 15, C.yellow, 800);
    const stats = [
      [`${(S.dist / 1000).toFixed(1)} km`, 'DISTANCE', C.cyan], [`${Math.round(S.base * KMH)} km/h`, 'TOP SPEED', C.pink],
      [`${S.coins}`, 'COINS', C.yellow], [`${S.perfects}`, 'PERFECT COMBOS', C.mint],
    ];
    stats.forEach(([big, small, col], i) => statChip(CX - 206 + (i % 2) * 212, 284 + Math.floor(i / 2) * 58, big, small, col, clamp((t - 0.5 - i * 0.1) / 0.3, 0, 1)));
    ctx.globalAlpha = 1;
    const ready = performance.now() - S.overAt > RESTART_LOCK_MS;
    const pulse = ready ? 1 + 0.05 * Math.sin(S.ui * 5) : 1;
    ctx.save(); ctx.translate(CX, 452); ctx.scale(pulse, pulse);
    ctx.globalAlpha = ready ? 1 : 0.3; ctx.fillStyle = C.pink; rrect(-128, -21, 256, 42, 21); ctx.fill();
    text('PINCH TO DRIVE AGAIN', 0, 1, 18, C.body, 900, 'center', 'italic ');
    ctx.restore(); ctx.restore(); ctx.globalAlpha = 1;
  }

  function drawHud() {
    ctx.globalAlpha = 1;
    if (S.hud.flash > 0) { ctx.globalAlpha = S.hud.flash * 0.3; ctx.fillStyle = C.cyan; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
    if (S.mode !== 'title') drawPlayHud();
    if (S.mode === 'title') drawTitle();
    else if (S.mode === 'paused') {
      panel(230, 130, C.cyan);
      chroma('PAUSED', 272, 34);
      ctx.globalAlpha = 0.55 + 0.45 * Math.sin(S.ui * 5); text('Pinch to resume', CX, 322, 20, C.dim, 700);
      ctx.restore(); ctx.globalAlpha = 1;
    } else if (S.mode === 'over') drawOver();
  }

  function render() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (S.shake > 0) { const m = S.shake * 18; ctx.translate((Math.random() - 0.5) * m, (Math.random() - 0.5) * m); }
    drawSky();
    drawGrid();
    drawRoad();
    drawMergeArrows();
    drawRoadside();
    const live = S.objs.filter((o) => !o.dead).sort((a, b) => b.z - a.z);
    const under = (o) => o.z > 0 || o === S.onObj;
    for (const o of live) if (under(o)) drawObj(o);
    if (S.slow < 0.98) { ctx.globalAlpha = (1 - S.slow) * 0.55; ctx.fillStyle = '#000'; ctx.fillRect(-20, -20, W + 40, H + 40); ctx.globalAlpha = 1; }
    if (S.mode !== 'title') drawPlayer();
    for (const o of live) if (!under(o)) drawObj(o);
    drawParts();
    drawRings();
    drawSpeedLines();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    if (S.flash > 0) { ctx.globalAlpha = S.flash * 0.8; ctx.fillStyle = '#ff2840'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
    drawHud();
  }

  // Desktop testing hook (not used by the game itself).
  window.__laneRunner = S;
  window.__laneRunnerDebug = { reset, update, render, addCar, addTruck, add, addKicker, startEvent, zoneAt, fairness, scheduleLaneChange, laneAt, edgeAt, baseSpeed };

  // ---------- loop: capped at ~30 fps to match the 30 Hz panel ----------
  let raf = 0, last = 0;
  function tick(t) {
    raf = requestAnimationFrame(tick);
    if (!last) { last = t; return; }
    const elapsed = t - last;
    if (elapsed < 30) return;
    last = t;
    update(Math.min(elapsed / 1000, 0.05));
    render();
  }
  function startLoop() { if (!raf) { last = 0; raf = requestAnimationFrame(tick); } }
  function stopLoop() { if (raf) { cancelAnimationFrame(raf); raf = 0; } }

  // Nothing may run while hidden.
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      if (S.mode === 'play') S.mode = 'paused';
      engine(false);
      stopLoop();
      if (actx && actx.state === 'running') actx.suspend();
    } else {
      startLoop();
    }
  });

  if (new URLSearchParams(location.search).has('go')) reset();
  render();
  startLoop();
})();
</script>
</body>
</html>
