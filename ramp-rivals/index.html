    const lag = -steer * 0.12 + Math.sin(S.anim * 9) * 0.02 * (r.v / 26);
    ctx.strokeStyle = '#22314a'; ctx.lineWidth = Math.max(1, 0.03 * u);
    ctx.beginPath(); ctx.moveTo(0.05 * u, -0.62 * u); ctx.quadraticCurveTo(0.07 * u, -0.78 * u, (0.1 + lag) * u, -0.9 * u); ctx.stroke();
    ctx.globalAlpha = ga * (0.35 + 0.2 * Math.sin(S.ui * 6)); ctx.fillStyle = C.cyan; circ((0.1 + lag) * u, -0.9 * u, 0.1 * u); ctx.fill();
    ctx.globalAlpha = ga; ctx.fillStyle = C.text; circ((0.1 + lag) * u, -0.9 * u, 0.045 * u); ctx.fill();
    ctx.restore();
    // Slipstream: wind streaks around you while you're tucked in behind someone.
    if (r.drafting || r.draftT > 0) {
      ctx.strokeStyle = r.draftT > 0 ? C.cyan : C.text; ctx.lineWidth = 2;
      ctx.globalAlpha = ga * (r.draftT > 0 ? 0.8 : 0.35 + 0.4 * r.draftC);
      ctx.beginPath();
      for (let i = 0; i < 8; i++) {
        const an = (i / 8) * TAU + 0.3, ph = (S.anim * 3 + i * 0.37) % 1, rr = (0.55 + ph * 0.35) * u;
        const px = x + Math.cos(an) * rr, py = y - 0.6 * u + Math.sin(an) * rr * 0.75;
        ctx.moveTo(px, py); ctx.lineTo(px, py + (0.25 + ph * 0.3) * u);
      }
      ctx.stroke();
      ctx.globalAlpha = ga;
    }
    if (r.spinT > 0) {
      ctx.fillStyle = C.yellow;
      for (let i = 0; i < 3; i++) { const an = S.anim * 8 + (i * TAU) / 3; circ(x + Math.cos(an) * 0.4 * u, y - 1.7 * u + Math.sin(an) * 0.1 * u, 0.06 * u); ctx.fill(); }
    }
  }

  function drawParts() {
    for (const p of S.parts) {
      const q = proj(p.s, p.d, p.h);
      if (!q) continue;
      const sz = Math.max(2, p.sz * q.k);
      ctx.globalAlpha = clamp(p.life / p.max, 0, 1); ctx.fillStyle = p.col;
      ctx.fillRect(q.x - sz / 2, q.y - sz / 2, sz, sz);
    }
    ctx.globalAlpha = 1;
  }

  function drawRings() {
    const p = proj(S.P.s, S.P.d, S.P.y + 0.5);
    if (!p) return;
    for (const r of S.rings) {
      const k = r.t / 0.6, e = easeOut(k);
      ctx.globalAlpha = (1 - k) * 0.9; ctx.strokeStyle = r.color; ctx.lineWidth = 8 * (1 - k) + 2;
      ell(p.x, p.y, 40 + e * 320, 20 + e * 160); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  // Momentum you can see: speed lines once you're really moving, heavier when boosting or in a slipstream.
  function drawSpeedLines() {
    const P = S.P, boosting = P.boostT > 0 || P.landT > 0 || P.padT > 0 || P.draftT > 0;
    if (S.demo || !(boosting || P.v > 30)) return;
    const n = boosting ? 28 : 10 + Math.floor((P.v - 30) * 1.5), col = P.draftT > 0 ? C.text : P.landT > 0 ? C.mint : C.cyan;
    ctx.lineWidth = boosting ? 3 : 2;
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const ang = rand(0, TAU), r0 = rand(160, 260), r1 = r0 + rand(60, 160) * (1 + S.hud.kick);
      ctx.moveTo(CX + Math.cos(ang) * r0, 300 + Math.sin(ang) * r0); ctx.lineTo(CX + Math.cos(ang) * r1, 300 + Math.sin(ang) * r1);
    }
    ctx.strokeStyle = boosting && Math.random() < 0.5 ? col : C.text; ctx.globalAlpha = boosting ? 0.45 : 0.16;
    ctx.stroke();
    if (P.boostT > 0) {
      ctx.strokeStyle = C.cyan;
      for (const [x, a] of [[3, 0.8], [10, 0.35], [18, 0.15]]) {
        ctx.globalAlpha = a * (0.7 + 0.3 * Math.sin(S.ui * 20)); ctx.lineWidth = 6;
        line(x, 60, x, H - 60); line(W - x, 60, W - x, H - 60);
      }
    }
    ctx.globalAlpha = 1;
  }

  // ---------- HUD ----------
  const FONT = (w, s, it = '') => `${it}${w} ${Math.round(s)}px system-ui, -apple-system, Roboto, sans-serif`;
  function text(txt, x, y, size, color, weight = 700, align = 'center', it = '') {
    ctx.font = FONT(weight, size, it); ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'middle';
    ctx.fillText(txt, x, y);
  }
  function chroma(txt, y, size, x = CX, off = 3, color = C.text) {
    const ga = ctx.globalAlpha;
    ctx.globalAlpha = ga * 0.85;
    text(txt, x - off, y, size, C.pink, 900, 'center', 'italic ');
    text(txt, x + off, y + 1, size, C.cyan, 900, 'center', 'italic ');
    ctx.globalAlpha = ga;
    text(txt, x, y, size, color, 900, 'center', 'italic ');
  }
  function scaledText(txt, x, y, size, color, sc, align = 'center', it = 'italic ', weight = 900) {
    ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc); text(txt, 0, 0, size, color, weight, align, it); ctx.restore();
  }
  function chip(x, y, w, h, accent, r = 12) {
    const ga = ctx.globalAlpha;
    ctx.globalAlpha = ga * 0.85; ctx.fillStyle = C.panel; rrect(x, y, w, h, r); ctx.fill();
    ctx.globalAlpha = ga * 0.95; ctx.strokeStyle = accent; ctx.lineWidth = 2; ctx.stroke();
    ctx.globalAlpha = ga * 0.3; ctx.strokeStyle = C.text; ctx.lineWidth = 1.5; line(x + r, y + 4, x + w - r, y + 4);
    ctx.globalAlpha = ga;
  }
  function label(txt, x, y, color = C.dim, align = 'left') { text(txt, x, y, 11, color, 800, align); }
  function panel(y, h, accent, sc = 1) {
    ctx.save(); ctx.translate(CX, y + h / 2); ctx.scale(sc, sc); ctx.translate(-CX, -(y + h / 2));
    chip(CX - 250, y, 500, h, accent, 24);
  }
  function drawArrow(dir, cx, cy, r, color) {
    ctx.save(); ctx.translate(cx, cy); ctx.rotate({ right: 0, down: Math.PI / 2, left: Math.PI, up: -Math.PI / 2 }[dir]);
    ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = r * 0.45;
    ctx.beginPath(); ctx.moveTo(-r, 0); ctx.lineTo(r * 0.1, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(r, 0); ctx.lineTo(0, -r * 0.8); ctx.lineTo(0, r * 0.8); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  function keyChip(k, x, y, col = C.cyan) {
    ctx.font = FONT(800, 15); const w = ctx.measureText(k).width + 18;
    chip(x - w, y - 13, w, 26, col, 8);
    text(k, x - w / 2, y + 1, 15, col, 800);
  }
  const pinchWord = () => (S.input === 'tap' ? 'TAP' : S.input === 'pinch' ? 'PINCH' : 'PINCH / TAP');

  function drawSpeedo(slide) {
    const P = S.P, cx = 528, cy = 538 + slide, r = 46, a0 = Math.PI * 0.8, a1 = Math.PI * 2.2;
    const kmh = Math.round(P.v * KMH), frac = clamp(kmh / 460, 0, 1), boosting = P.boostT > 0;
    const col = boosting ? C.cyan : P.brakeT > 0 ? C.red : kmh < 200 ? C.mint : kmh < 300 ? C.yellow : C.pink;
    ctx.globalAlpha = 0.85; ctx.fillStyle = C.panel; circ(cx, cy, r + 12); ctx.fill(); ctx.globalAlpha = 1;
    ctx.lineWidth = 8; ctx.strokeStyle = '#1c2440';
    ctx.beginPath(); ctx.arc(cx, cy, r, a0, a1); ctx.stroke();
    // Your cruising top speed (coins raise it) as a tick on the dial.
    const topF = clamp((topSpeed(P) * KMH) / 460, 0, 1), ta = a0 + (a1 - a0) * topF;
    ctx.strokeStyle = C.yellow; ctx.lineWidth = 3; line(cx + Math.cos(ta) * (r - 8), cy + Math.sin(ta) * (r - 8), cx + Math.cos(ta) * (r + 8), cy + Math.sin(ta) * (r + 8));
    if (boosting) { ctx.globalAlpha = 0.35; ctx.lineWidth = 16; ctx.strokeStyle = col; ctx.beginPath(); ctx.arc(cx, cy, r, a0, a0 + (a1 - a0) * frac); ctx.stroke(); ctx.globalAlpha = 1; }
    ctx.lineWidth = 8; ctx.strokeStyle = col;
    ctx.beginPath(); ctx.arc(cx, cy, r, a0, a0 + (a1 - a0) * frac); ctx.stroke();
    const tip = a0 + (a1 - a0) * frac;
    ctx.fillStyle = C.text; circ(cx + Math.cos(tip) * r, cy + Math.sin(tip) * r, 5); ctx.fill();
    scaledText(String(kmh), cx, cy - 4, 27, C.text, 1 + S.hud.kick * 0.3);
    label(P.brakeT > 0 ? 'SLOWING' : 'KM/H', cx, cy + 20, col, 'center');
  }

  function drawBoostBar(slide) {
    const P = S.P, x0 = 14, y = H - 50 + slide, w = 206, boosting = P.boostT > 0;
    chip(x0, y, w, 38, boosting ? C.text : C.cyan);
    label('BOOST', x0 + 12, y + 19, boosting ? C.cyan : C.dim);
    for (let i = 0; i < BOOST_MAX; i++) {
      const x = x0 + 62 + i * 44, full = i < P.boosts;
      ctx.fillStyle = full ? C.cyan : '#10223a';
      if (full) { ctx.globalAlpha = 0.3 + 0.15 * Math.sin(S.ui * 6 + i); rrect(x - 3, y + 7, 42, 24, 8); ctx.fill(); ctx.globalAlpha = 1; }
      rrect(x, y + 10, 36, 18, 6); ctx.fill();
      if (full && i === P.boosts - 1 && S.hud.ready > 0) { ctx.globalAlpha = S.hud.ready; ctx.fillStyle = C.text; rrect(x, y + 10, 36, 18, 6); ctx.fill(); ctx.globalAlpha = 1; }
      ctx.fillStyle = full ? C.body : '#2a4a6a';
      const bx = x + 18, by = y + 19;
      ctx.beginPath(); ctx.moveTo(bx + 2, by - 7); ctx.lineTo(bx - 4, by + 1); ctx.lineTo(bx, by + 1); ctx.lineTo(bx - 2, by + 7); ctx.lineTo(bx + 4, by - 1); ctx.lineTo(bx, by - 1); ctx.closePath(); ctx.fill();
    }
    if (boosting) { ctx.fillStyle = C.text; ctx.fillRect(x0 + 62, y + 32, 124 * (P.boostT / BOOST_T), 3); }
    else if (P.boosts >= 1 && !S.trick) {
      const bob = Math.sin(S.ui * 6) * 3;
      ctx.globalAlpha = 0.6 + 0.4 * Math.sin(S.ui * 6); drawArrow('up', x0 + w + 14, y + 19 + bob, 9, C.cyan); ctx.globalAlpha = 1;
    }
  }

  // Racers coming up behind you: a chevron under their lane, bigger as they close, flashing red if they're about to hit you.
  function drawRearWarnings() {
    const P = S.P;
    for (const r of S.racers) {
      if (r === P || r.finished) continue;
      const g = P.s - r.s;
      if (g < 0.8 || g > 28) continue;
      const p = proj(P.s, r.d, 0);
      if (!p) continue;
      const threat = (r.boostT > 0 && Math.abs(r.d - P.d) < 0.6) || (r.attack && r.attack.who === P) || (r.charge && r.charge.who === P) || (Math.abs(r.d - P.d) < 0.6 && r.v > P.v + 3 && g < 10);
      const close = 1 - g / 28, x = clamp(p.x, 26, W - 26), y = 522 - close * 12, sz = (7 + close * 11) * (threat ? 1.5 : 1);
      if (threat) { ctx.globalAlpha = 0.35 + 0.25 * Math.sin(S.ui * 24); ctx.fillStyle = C.red; circ(x, y, sz * 1.3); ctx.fill(); }
      const col = threat ? (Math.sin(S.ui * 24) > -0.2 ? C.red : C.text) : r.col;
      ctx.globalAlpha = 0.35 + 0.65 * close;
      ctx.strokeStyle = '#000'; ctx.lineWidth = 7 + close * 3;
      ctx.beginPath(); ctx.moveTo(x - sz, y + sz * 0.6); ctx.lineTo(x, y - sz * 0.4); ctx.lineTo(x + sz, y + sz * 0.6); ctx.stroke();
      ctx.strokeStyle = col; ctx.lineWidth = 3 + close * 3;
      ctx.beginPath(); ctx.moveTo(x - sz, y + sz * 0.6); ctx.lineTo(x, y - sz * 0.4); ctx.lineTo(x + sz, y + sz * 0.6); ctx.stroke();
      if (threat) text('!', x, y - sz - 8, 18, C.red, 900);
    }
    ctx.globalAlpha = 1;
  }

  // The trick combo, exactly as in Lane Runner: one icon per swipe, lit as you land each one, plus the air time left.
  function drawTrickHud() {
    const Tk = S.trick;
    if (!Tk) return;
    const n = Tk.seq.length, bs = 52, gap = 12, w = n * bs + (n - 1) * gap, x0 = CX - w / 2, y0 = 96;
    const age = S.ui - Tk.born;
    ctx.globalAlpha = (Tk.landed ? clamp(Tk.hide / 0.4, 0, 1) : 1) * clamp(age / 0.15, 0, 1);
    const ga = ctx.globalAlpha;
    const [head, hc] = Tk.state === 'done' ? ['PERFECT COMBO!', C.mint] : Tk.state === 'fail' ? ['COMBO BROKEN', C.red] : Tk.landed ? ['TOO SLOW', C.orange] : ['TRICK TIME', C.pink];
    const shakeX = Tk.state === 'fail' ? Math.sin(S.ui * 60) * 6 * clamp(1 - (S.ui - Tk.failAt) / 0.4, 0, 1) : 0;
    if (Tk.state === 'done') chroma(head, y0 - 22, 24, CX, 2 + Math.sin(S.ui * 20) * 2, C.mint);
    else scaledText(head, CX + shakeX, y0 - 22, 22, hc, 0.9 + 0.1 * easeBack(age / 0.3));
    text(`${Tk.i}/${n}`, x0 + w + 14, y0 + bs / 2, 18, C.dim, 800, 'left');
    for (let i = 0; i < n; i++) {
      const x = x0 + i * (bs + gap), hit = i < Tk.i, miss = Tk.state === 'fail' && i === Tk.i;
      const next = Tk.state === 'active' && !Tk.landed && i === Tk.i;
      const enter = easeBack((age - i * 0.06) / 0.25);
      const bounce = hit && Tk.hitAt && Tk.hitAt[i] !== undefined ? 1 + 0.35 * (1 - easeOut((S.ui - Tk.hitAt[i]) / 0.3)) : 1;
      const pulse = next ? 1 + 0.08 * Math.sin(S.ui * 12) : 1, sz = bs * pulse * bounce * enter;
      if (sz <= 1) continue;
      const cx = x + bs / 2, cy = y0 + bs / 2 + (1 - enter) * -20;
      ctx.globalAlpha = ga * (hit || miss || next ? 1 : 0.55);
      if (hit || next) { ctx.globalAlpha *= 0.35; ctx.fillStyle = hit ? C.mint : C.pink; rrect(cx - sz / 2 - 5, cy - sz / 2 - 5, sz + 10, sz + 10, 15); ctx.fill(); ctx.globalAlpha = ga; }
      ctx.fillStyle = hit ? C.mint : miss ? C.red : next ? '#3a1a5a' : C.panel;
      rrect(cx - sz / 2, cy - sz / 2, sz, sz, 12); ctx.fill();
      if (next) { ctx.strokeStyle = C.text; ctx.lineWidth = 3; ctx.stroke(); }
      drawArrow(Tk.seq[i], cx, cy, sz * 0.28, hit || miss ? C.body : next ? C.text : C.dim);
    }
    ctx.globalAlpha = ga;
    const frac = Tk.state === 'done' ? 1 : Tk.landed ? 0 : clamp(airLeft(S.P) / Tk.total, 0, 1);
    ctx.fillStyle = '#2a1640'; rrect(x0, y0 + bs + 12, w, 8, 4); ctx.fill();
    ctx.fillStyle = Tk.state === 'done' ? C.mint : frac < 0.3 ? C.red : C.pink; rrect(x0, y0 + bs + 12, Math.max(8, w * frac), 8, 4); ctx.fill();
    ctx.globalAlpha = 1;
  }

  function drawRaceHud() {
    const P = S.P, Hh = S.hud, slideT = (1 - easeOut(Hh.in)) * -90, slideB = (1 - easeOut(Hh.in)) * 90;
    // Position.
    const pc = PLACE_COL(P.pos), pop = 1 + Hh.posPop * 0.3;
    chip(14, 12 + slideT, 150, 60, pc);
    scaledText(String(P.pos), 48, 43 + slideT, 42, pc, pop, 'center');
    text(ORD(P.pos).slice(-2), 72, 31 + slideT, 17, pc, 900, 'left', 'italic ');
    text(`of ${LANES}`, 73, 53 + slideT, 13, C.dim, 800, 'left');
    text(fmtTime(S.raceT), 152, 53 + slideT, 13, C.dim, 700, 'right');
    if (S.chain) {
      const y2 = 80 + slideT;
      label(`STYLE x${S.chain}`, 16, y2 + 4, C.mint);
      ctx.fillStyle = '#123'; rrect(84, y2, 80, 7, 3); ctx.fill();
      ctx.fillStyle = C.mint; rrect(84, y2, Math.max(6, 80 * clamp(S.chainT / CHAIN_T, 0, 1)), 7, 3); ctx.fill();
    }

    // Coins: each one raises your top speed, up to 10.
    chip(436, 12 + slideT, 150, 60, C.yellow);
    const cs = 1 + Hh.coinPop * 0.35;
    ctx.fillStyle = C.yellow; ell(456, 36 + slideT, Math.max(2, 9 * Math.abs(Math.cos(S.ui * 3))) * cs, 10 * cs); ctx.fill();
    scaledText(String(P.coins), 520, 36 + slideT, 26, C.yellow, cs, 'right', '', 900);
    text('/10', 524, 40 + slideT, 13, C.dim, 800, 'left');
    for (let i = 0; i < COIN_MAX; i++) { ctx.fillStyle = i < P.coins ? C.yellow : '#2a2a12'; rrect(448 + i * 13, 56 + slideT, 10, 7, 2); ctx.fill(); }
    label(`+${Math.round(P.coins * COIN_BONUS * 100)}%`, 574, 26 + slideT, C.dim, 'right');
    for (const f of S.flyers) {
      const e = easeOut(f.t / 0.45), fxp = f.x + (456 - f.x) * e, fyp = f.y + (36 - f.y) * e - Math.sin(e * Math.PI) * 60;
      ctx.fillStyle = C.yellow; circ(fxp, fyp, 7 - e * 2); ctx.fill();
    }

    // Race progress: every racer's place on the way to the flag.
    chip(174, 12 + slideT, 252, 38, T.map.edge);
    const bx0 = 190, bx1 = 396, by = 31 + slideT;
    ctx.strokeStyle = '#2c3a60'; ctx.lineWidth = 4; line(bx0, by, bx1, by);
    ctx.fillStyle = C.text;
    for (let i = 0; i < 4; i++) for (let j = 0; j < 2; j++) if ((i + j) % 2 === 0) ctx.fillRect(bx1 + 4 + i * 4, by - 8 + j * 8, 4, 8);
    const px = (r) => bx0 + (bx1 - bx0) * clamp(r.s / T.finish, 0, 1);
    for (const r of S.racers) { if (r === P) continue; ctx.fillStyle = r.col; circ(px(r), by, 4); ctx.fill(); }
    ctx.fillStyle = C.cyan; circ(px(P), by, 7.5); ctx.fill(); ctx.strokeStyle = C.text; ctx.lineWidth = 2; ctx.stroke();

    drawBoostBar(slideB);
    drawSpeedo(slideB);
    if (S.mode === 'race' && !P.finished) drawRearWarnings();
    if (S.input === 'tap') { // a pause button for phones
      ctx.globalAlpha = 0.6; ctx.fillStyle = C.dim; ctx.fillRect(292, 56 + slideT, 5, 14); ctx.fillRect(303, 56 + slideT, 5, 14); ctx.globalAlpha = 1;
    }
    drawTrickHud();

    // Slipstream charge, over your head.
    if (P.drafting && P.draftC > 0.05 && !S.trick) {
      const p = proj(P.s, P.d, 1.9);
      if (p) {
        label('SLIPSTREAM', p.x, p.y - 12, C.text, 'center');
        ctx.fillStyle = '#233'; rrect(p.x - 40, p.y - 2, 80, 6, 3); ctx.fill();
        ctx.fillStyle = C.text; rrect(p.x - 40, p.y - 2, Math.max(6, 80 * P.draftC), 6, 3); ctx.fill();
      }
    }

    if (S.mode === 'count') {
      const n = 3 - Math.floor(S.cdT), f = S.cdT % 1, sc = 1.5 - 0.5 * easeOut(f / 0.25);
      ctx.globalAlpha = 0.85; ctx.fillStyle = C.panel; circ(CX, 262, 62 * sc); ctx.fill();
      ctx.globalAlpha = 1; ctx.strokeStyle = n === 1 ? C.yellow : T.map.edge; ctx.lineWidth = 4; circ(CX, 262, 62 * sc); ctx.stroke();
      scaledText(String(n), CX, 266, 88, n === 1 ? C.yellow : C.text, sc);
      if (S.cdT < 2.2) {
        ctx.globalAlpha = clamp(2.2 - S.cdT, 0, 1);
        chip(CX - 150, 80, 300, 34, T.map.edge, 12);
        text(`${S.sel.m + 1}-${S.sel.l + 1}  ${T.map.name} · ${T.L.name}`, CX, 97, 16, T.map.edge, 900, 'center', 'italic ');
        ctx.globalAlpha = 1;
      }
      chip(CX - 170, 500, 340, 30, C.mint, 12);
      text('Swipe ↑ right on GO for a rocket start', CX, 516, 14, C.mint, 800);
    } else if (S.hud.go && S.ui - S.hud.go < 0.9) {
      const t = S.ui - S.hud.go;
      ctx.globalAlpha = clamp((0.9 - t) / 0.3, 0, 1);
      ctx.save(); ctx.translate(CX, 262); ctx.scale(easeBack(t / 0.25) * 1.2, easeBack(t / 0.25) * 1.2); chroma('GO!', 0, 80, 0, 4, C.mint); ctx.restore();
      ctx.globalAlpha = 1;
    }
    if (S.mode === 'race' && !P.finished && T.finish - P.s < 260 && T.finish - P.s > 200) {
      ctx.globalAlpha = 0.6 + 0.4 * Math.sin(S.ui * 8); text('FINAL STRETCH', CX, 150, 20, C.yellow, 900, 'center', 'italic '); ctx.globalAlpha = 1;
    }
    if (S.toast) {
      const age = 1.4 - S.toast.t, sc = easeBack(age / 0.22), y = (S.trick ? 206 : 186) - age * 14;
      ctx.globalAlpha = clamp(S.toast.t / 0.4, 0, 1);
      ctx.save(); ctx.translate(CX, y); ctx.scale(sc, sc);
      chroma(S.toast.text, 0, S.toast.text.length > 16 ? 24 : 30, 0, 2.5, S.toast.color);
      ctx.restore(); ctx.globalAlpha = 1;
    }
  }

  function drawTitle() {
    const t = S.ui, inS = easeBack(t / 0.5), bob = Math.sin(t * 2) * 3;
    panel(84, 448, C.cyan, inS);
    chroma('RAMP RIVALS', 132 + bob, 52, CX, 3 + Math.sin(t * 3) * 2);
    text('N E O N   G R I D   R A C I N G', CX, 174, 15, C.cyan, 700);
    const rows = [['← →', 'change lanes · bump rivals'], ['↑', 'boost (grab boost cells)'], ['↓', 'slow down'], [pinchWord(), 'go · pause']];
    rows.forEach(([k, v], i) => {
      const a = clamp((t - 0.25 - i * 0.08) / 0.3, 0, 1);
      ctx.globalAlpha = a;
      keyChip(k, CX - 78 + (1 - a) * -20, 216 + i * 36);
      text(v, CX - 64, 217 + i * 36, 16, C.dim, 600, 'left');
    });
    ctx.globalAlpha = clamp((t - 0.6) / 0.3, 0, 1);
    text('Hit pink ramps, then swipe the trick combo!', CX, 368, 15, C.pink, 800);
    text('Tuck in behind a rival to catch their slipstream.', CX, 390, 15, C.text, 700);
    text('Coins raise your top speed · boost into rivals to smash them.', CX, 412, 14, C.yellow, 700);
    const pulse = 1 + 0.05 * Math.sin(t * 5);
    ctx.save(); ctx.translate(CX, 462); ctx.scale(pulse, pulse);
    ctx.globalAlpha *= 0.3; ctx.fillStyle = C.cyan; rrect(-138, -26, 276, 52, 26); ctx.fill();
    ctx.globalAlpha = clamp((t - 0.6) / 0.3, 0, 1); ctx.fillStyle = C.cyan; rrect(-128, -21, 256, 42, 21); ctx.fill();
    text(`${pinchWord()} TO START`, 0, 1, 20, C.body, 900, 'center', 'italic ');
    ctx.restore();
    ctx.globalAlpha = 1;
    text(BUILD + (S.lite ? ' · lite' : ''), CX + 236, 520, 11, C.dim, 600, 'right');
    ctx.restore(); ctx.globalAlpha = 1;
  }

  const previews = new Map();
  function drawTrackPreview(m, l, x, y, w, h, col) {
    const key = m + '-' + l;
    if (!previews.has(key)) {
      const g = geometry(m, l), pts = [];
      let x0 = Infinity, x1 = -Infinity, z0 = Infinity, z1 = -Infinity;
      for (let s = 0; s <= g.finish; s += 6) { const i = s + PRE; pts.push([g.X[i], g.Z[i]]); x0 = Math.min(x0, g.X[i]); x1 = Math.max(x1, g.X[i]); z0 = Math.min(z0, g.Z[i]); z1 = Math.max(z1, g.Z[i]); }
      previews.set(key, { pts, x0, x1, z0, z1 });
    }
    const pv = previews.get(key), sc = Math.min(w / Math.max(1, pv.x1 - pv.x0), h / Math.max(1, pv.z1 - pv.z0));
    const ox = x + (w - (pv.x1 - pv.x0) * sc) / 2, oy = y + h - (h - (pv.z1 - pv.z0) * sc) / 2;
    const P = (q) => [ox + (q[0] - pv.x0) * sc, oy - (q[1] - pv.z0) * sc];
    ctx.lineJoin = 'round';
    for (const [lw, a] of [[9, 0.25], [3, 1]]) {
      ctx.globalAlpha = a; ctx.strokeStyle = col; ctx.lineWidth = lw;
      ctx.beginPath(); for (const q of pv.pts) { const [px, py] = P(q); ctx.lineTo(px, py); } ctx.stroke();
    }
    ctx.globalAlpha = 1;
    const [sx, sy] = P(pv.pts[0]), [fx, fy] = P(pv.pts[pv.pts.length - 1]);
    ctx.fillStyle = C.mint; circ(sx, sy, 5); ctx.fill();
    ctx.fillStyle = C.text; ctx.fillRect(fx - 5, fy - 5, 5, 5); ctx.fillRect(fx, fy, 5, 5);
    ctx.strokeStyle = C.text; ctx.lineWidth = 1.5; ctx.strokeRect(fx - 5, fy - 5, 10, 10);
  }

  function drawMenu() {
    const t = S.ui - S.menuAt, inS = easeBack(t / 0.4), M = MAPS[S.sel.m];
    panel(64, 476, M.edge, inS);
    text('SELECT RACE', CX, 90, 13, C.dim, 800);
    const pop = S.menuPop ? 1 + 0.12 * (1 - easeOut((S.ui - S.menuPop) / 0.25)) : 1;
    scaledText(M.name, CX, 124, 36, C.text, pop);
    const nudge = Math.sin(S.ui * 5) * 3;
    drawArrow('left', CX - 212 - nudge, 124, 11, M.edge); drawArrow('right', CX + 212 + nudge, 124, 11, M.edge);
    text(`${M.tier}  ·  MAP ${S.sel.m + 1} OF ${MAPS.length}`, CX, 156, 13, M.edge, 800);
    for (let i = 0; i < 3; i++) {
      const y = 180 + i * 62, on = i === S.sel.l, L = M.levels[i], b = S.best[S.sel.m + '-' + i];
      ctx.globalAlpha = on ? 1 : 0.7;
      chip(CX - 226, y, 262, 52, on ? C.text : M.edge, 12);
      if (on) { ctx.globalAlpha = 0.18 + 0.1 * Math.sin(S.ui * 5); ctx.fillStyle = M.edge; rrect(CX - 226, y, 262, 52, 12); ctx.fill(); ctx.globalAlpha = 1; }
      text(`${S.sel.m + 1}-${i + 1}`, CX - 208, y + 26, 18, on ? M.edge : C.dim, 900, 'left', 'italic ');
      text(L.name, CX - 160, y + 18, 17, C.text, 800, 'left');
      text(b ? `BEST ${ORD(b.place)} · ${fmtTime(b.time)}` : 'NOT RACED YET', CX - 160, y + 37, 12, b ? PLACE_COL(b.place) : C.dim, 700, 'left');
      if (b && b.place <= 3) { ctx.fillStyle = PLACE_COL(b.place); circ(CX + 16, y + 26, 9); ctx.fill(); text(String(b.place), CX + 16, y + 27, 12, C.body, 900); }
    }
    ctx.globalAlpha = 1;
    drawTrackPreview(S.sel.m, S.sel.l, CX + 56, 186, 170, 166, M.edge);
    const L = M.levels[S.sel.l], len = geometry(S.sel.m, S.sel.l).finish;
    text(`${((len * KMH) / 3600).toFixed(1)} km · ${L.barriers ? L.barriers + ' firewalls' : 'no firewalls'}`, CX + 141, 368, 12, C.dim, 700);
    keyChip('← →', CX - 130, 404, M.edge); text('map', CX - 122, 405, 14, C.dim, 700, 'left');
    keyChip('↑ ↓', CX + 40, 404, M.edge); text('track', CX + 48, 405, 14, C.dim, 700, 'left');
    const pulse = 1 + 0.05 * Math.sin(S.ui * 5);
    ctx.save(); ctx.translate(CX, 472); ctx.scale(pulse, pulse);
    ctx.globalAlpha = 0.3; ctx.fillStyle = M.edge; rrect(-138, -26, 276, 52, 26); ctx.fill();
    ctx.globalAlpha = 1; ctx.fillStyle = M.edge; rrect(-128, -21, 256, 42, 21); ctx.fill();
    text(`${pinchWord()} TO RACE`, 0, 1, 20, C.body, 900, 'center', 'italic ');
    ctx.restore();
    ctx.restore(); ctx.globalAlpha = 1;
  }

  function standings() {
    return rank().map((r) => ({ r, time: r.finished ? r.finishT : S.raceT + (T.finish - r.s) / Math.max(8, r.v || 8), done: r.finished }));
  }

  function drawResults() {
    const t = S.ui - S.resultsAt, sc = easeBack(t / 0.45), P = S.P, place = P.place || P.pos, pc = PLACE_COL(place);
    panel(40, 520, pc, sc);
    const jolt = t < 0.4 ? Math.sin(t * 80) * 5 * (1 - t / 0.4) : 0;
    chroma(place === 1 ? 'YOU WIN!' : `${ORD(place)} PLACE`, 84, 42, CX + jolt, 3 + Math.sin(S.ui * 7) * 2, pc);
    text(`${T.map.name} · ${T.L.name}`, CX, 118, 13, C.dim, 800);
    if (S.newBest && t > 0.8) {
      const p = 1 + 0.08 * Math.sin(S.ui * 8);
      ctx.save(); ctx.translate(CX + 176, 84); ctx.scale(p, p); ctx.rotate(0.15);
      ctx.fillStyle = C.yellow; rrect(-44, -12, 88, 24, 12); ctx.fill(); text('NEW BEST', 0, 1, 12, C.body, 900, 'center', 'italic ');
      ctx.restore();
    }
    standings().forEach((e, i) => {
      const y = 146 + i * 27, a = clamp((t - 0.2 - i * 0.07) / 0.25, 0, 1), me = e.r.isPlayer;
      ctx.globalAlpha = a;
      if (me) { ctx.globalAlpha = a * 0.25; ctx.fillStyle = C.cyan; rrect(CX - 200, y - 12, 400, 24, 8); ctx.fill(); ctx.globalAlpha = a; }
      text(ORD(i + 1), CX - 160, y, 15, PLACE_COL(i + 1), 900, 'right', 'italic ');
      ctx.fillStyle = e.r.col; circ(CX - 138, y, 6); ctx.fill();
      text(e.r.name, CX - 122, y, 15, me ? C.cyan : C.text, 800, 'left');
      text(e.done ? fmtTime(e.time) : '…', CX + 180, y, 14, e.done ? C.dim : '#56607a', 700, 'right');
    });
    ctx.globalAlpha = clamp((t - 0.9) / 0.3, 0, 1);
    const st = [[fmtTime(P.finishT || S.raceT), 'TIME'], [String(S.stats.perfects), 'PERFECT COMBOS'], [String(S.stats.bumps + S.stats.smashes), 'RIVALS BUMPED'], [Math.round(S.stats.top * KMH) + ' km/h', 'TOP SPEED']];
    st.forEach(([big, small], i) => {
      const x = CX - 206 + i * 104;
      chip(x, 368, 98, 50, [C.cyan, C.mint, C.orange, C.pink][i], 10);
      text(big, x + 49, 387, 16, C.text, 900, 'center', 'italic ');
      text(small, x + 49, 405, 8.5, C.dim, 800, 'center');
    });
    ctx.globalAlpha = 1;
    const ready = t > 0.8, pulse = ready ? 1 + 0.05 * Math.sin(S.ui * 5) : 1, last = S.sel.m === MAPS.length - 1 && S.sel.l === 2;
    ctx.save(); ctx.translate(CX, 460); ctx.scale(pulse, pulse);
    ctx.globalAlpha = ready ? 1 : 0.3; ctx.fillStyle = pc; rrect(-140, -21, 280, 42, 21); ctx.fill();
    text(`${pinchWord()}: ${last ? 'BACK TO MAP 1' : 'NEXT RACE'}`, 0, 1, 18, C.body, 900, 'center', 'italic ');
    ctx.restore();
    ctx.globalAlpha = ready ? 1 : 0.3;
    keyChip('↓', CX - 90, 512, C.cyan); text('retry', CX - 82, 513, 14, C.dim, 700, 'left');
    keyChip('←', CX + 50, 512, C.cyan); text('menu', CX + 58, 513, 14, C.dim, 700, 'left');
    ctx.restore(); ctx.globalAlpha = 1;
  }

  function drawPaused() {
    panel(206, 188, C.cyan);
    chroma('PAUSED', 250, 36);
    ctx.globalAlpha = 0.55 + 0.45 * Math.sin(S.ui * 5); text(`${pinchWord()} to resume`, CX, 298, 20, C.text, 700); ctx.globalAlpha = 1;
    keyChip('↓', CX - 90, 350, C.cyan); text('restart', CX - 82, 351, 14, C.dim, 700, 'left');
    keyChip('←', CX + 50, 350, C.cyan); text('menu', CX + 58, 351, 14, C.dim, 700, 'left');
    ctx.restore(); ctx.globalAlpha = 1;
  }

  function drawHud() {
    ctx.globalAlpha = 1;
    if (S.hud.flash > 0) { ctx.globalAlpha = S.hud.flash * 0.25; ctx.fillStyle = C.cyan; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
    if (S.redFlash > 0) {
      ctx.strokeStyle = C.red;
      for (const [x, a] of [[4, 0.8], [12, 0.35]]) { ctx.globalAlpha = a * S.redFlash; ctx.lineWidth = 8; ctx.strokeRect(x, x, W - 2 * x, H - 2 * x); }
      ctx.globalAlpha = 1;
    }
    if (S.mode === 'title') drawTitle();
    else if (S.mode === 'menu') drawMenu();
    else {
      drawRaceHud();
      if (S.mode === 'results') drawResults();
      else if (S.mode === 'paused') drawPaused();
    }
  }

  const PROF = { skip: null };
  const prof = (name, fn) => { if (PROF.skip && PROF.skip.has(name)) return; fn(); };
  function render() {
    poolN = 0;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (S.shake > 0) { const m = S.shake * 18; ctx.translate((Math.random() - 0.5) * m, (Math.random() - 0.5) * m); }
    ctx.translate(CX, 330); ctx.rotate(Cam.bank); ctx.translate(-CX, -330);
    prof('sky', drawSky);
    prof('grid', drawGrid);
    prof('road', drawRoad);
    if (!S.lite) prof('fog', () => ctx.drawImage(FOG, -40, HOR - 1));
    prof('trails', () => { for (const r of S.racers) drawTrail(r); });
    drawAttackArrows();
    prof('world', drawWorld);
    prof('parts', drawParts);
    if (!S.demo) drawRings();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    drawSpeedLines();
    prof('hud', drawHud);
  }

  // Desktop testing hooks (not used by the game itself).
  window.__rampRivals = S;
  window.__rampRivalsDebug = {
    frame: () => frameEMA, startRace, update, render, simulate, tryLane, useBoost, brake, spinOut, knock, onDir, onSelect, proj, rank, standings, threats,
    geometry, buildTrack, topSpeed, MAPS, PROF, track: () => T, cam: () => Cam, consts: { LANES, VIEW, FADE, RL, RW, V_BASE, COIN_MAX, BOOST_MAX, RAMP_LEN },
  };

  // ---------- loop: capped at ~30 fps to match the 30 Hz panel ----------
  let raf = 0, last = 0, frameEMA = 33, slowFor = 0;
  function tick(t) {
    raf = requestAnimationFrame(tick);
    if (!last) { last = t; return; }
    const elapsed = t - last;
    if (elapsed < 30) return;
    last = t;
    const t0 = performance.now();
    update(Math.min(elapsed / 1000, 0.05));
    render();
    // If the device can't hold ~24 fps in a race, switch to lighter drawing for the rest of the session.
    const work = performance.now() - t0;
    frameEMA = frameEMA * 0.93 + Math.max(elapsed, work) * 0.07;
    if (!S.lite && S.mode === 'race' && frameEMA > 42) { if ((slowFor += elapsed) > 1500) S.lite = true; } else slowFor = 0;
  }
  function startLoop() { if (!raf) { last = 0; raf = requestAnimationFrame(tick); } }
  function stopLoop() { if (raf) { cancelAnimationFrame(raf); raf = 0; } }

  // Nothing may run while hidden.
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      if (S.mode === 'race' || S.mode === 'count') { S.pausedFrom = S.mode; S.mode = 'paused'; }
      engine(false);
      stopLoop();
      if (actx && actx.state === 'running') actx.suspend();
    } else startLoop();
  });

  // ?race=m-l drops straight into a race, ?menu=m-l opens the menu there (used after reloading for a fresh build).
  const pick2 = (v) => { const [m, l] = String(v).split('-').map(Number); return [clamp(m | 0, 0, MAPS.length - 1), clamp(l | 0, 0, 2)]; };
  if (QS.has('race')) { const [m, l] = pick2(QS.get('race')); startRace(m, l); }
  else if (QS.has('menu')) { const [m, l] = pick2(QS.get('menu')); S.mode = 'menu'; startRace(m, l, true); }
  else startRace(Math.floor(Math.random() * 3), 0, true);
  render();
  startLoop();
})();
</script>
</body>
