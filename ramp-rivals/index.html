<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- The glasses browser caches QR-opened pages hard; force a fresh fetch. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<!-- Games use a fixed 600x600 stage (apps are responsive; games are not). -->
<meta name="viewport" content="width=600, height=600, initial-scale=1.0">
<script>
  // Phones: show the same 600x600 stage, scaled to fit the screen width (the glasses keep it 1:1).
  (function () {
    var m = Math.min(screen.width || 600, screen.height || 600);
    if (m < 560) document.querySelector('meta[name=viewport]').setAttribute('content', 'width=600, user-scalable=no');
  })();
</script>
<meta name="description" content="Ramp Rivals: a TRON-style cartoon lane racer for Meta Ray-Ban Display and phones. Race seven rival bots over eight lanes: bump, draft, boost and trick off ramps.">
<!-- Without this the device routes no Neural Band / touchpad input to the page. -->
<meta name="mrbd-web-app-capable" content="yes">
<meta name="application-name" content="Ramp Rivals">
<meta name="theme-color" content="#000000">
<title>Ramp Rivals</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23000'/%3E%3Cpath d='M6 52h40V34z' fill='none' stroke='%23ff4fd8' stroke-width='4' stroke-linejoin='round'/%3E%3Ccircle cx='38' cy='20' r='11' fill='%2335e0ff'/%3E%3C/svg%3E">
<style>
  /* Additive display: black is see-through, so the page is pure black. */
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body {
    display: grid; place-items: center; touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  canvas {
    display: block; touch-action: none;
    width: 600px; height: 600px;
    width: min(600px, 100vw, 100vh); height: min(600px, 100vw, 100vh);
  }
</style>
</head>
<body>
<canvas id="c" width="600" height="600" aria-label="Ramp Rivals"></canvas>
<script>
'use strict';
(() => {
  const W = 600, H = 600, BUILD = 'v2';
  const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  const QS = new URLSearchParams(location.search);
  const TAU = Math.PI * 2;

  // ---------- tuning ----------
  const LANES = 8, EDGE = 4;                  // eight lanes (one per racer), 1 unit wide; the road is ±EDGE
  const V_BASE = 26;                          // cruising top speed with no coins, units / s
  const KMH = 9.5;                            // units / s → km/h on the speedo
  const COIN_MAX = 10, COIN_BONUS = 0.025;    // Mario Kart style: each coin (up to 10) adds 2.5% top speed
  const BOOST_MAX = 3, BOOST_T = 2.2, BOOST_MULT = 1.5, BOOST_JOLT = 1.2;
  const PAD_T = 1.0, PAD_MULT = 1.4;
  const DRAFT_MIN = 1.2, DRAFT_MAX = 9, DRAFT_CHARGE = 1.0, DRAFT_T = 1.6, DRAFT_MULT = 1.3;
  const BRAKE_T = 0.6, BRAKE_MULT = 0.55;
  const SPIN_T = 1.0, SPIN_MULT = 0.3, SPIN_COINS = 3, INVULN_T = 1.4;
  const KNOCK_MULT = 0.8, ATTACK_T = 0.55;
  const LANE_SPEED = 6.5;                     // lanes / s
  const RL = 1.0, RW = 0.72;                  // racer footprint: length along the track, width
  const RAMP_LEN = 2.4, RAMP_H = 0.7, LAUNCH_V = 8.5, GRAV = 16;
  const SLOW = 0.3, TRICK_T = 0.42, CHAIN_T = 25;
  const TRICKS = { left: 'BARREL ROLL', right: 'CORKSCREW', up: 'KICKFLIP', down: 'BOP 360' };
  const DIR_LIST = Object.keys(TRICKS);
  const RESPAWN_T = 8, RESULTS_DELAY = 2.2;

  // ---------- camera ----------
  // A chase camera behind your racer, yawed to follow the track, so wide turns sweep across the screen.
  const CX = 300, HOR = 168, F0 = 460;        // screen centre, horizon line, focal length (px)
  const CAM_H = 3.5, CAM_BACK = 5.2;          // camera height and distance behind you (units)
  const NEAR_Z = 0.4, VIEW = 210, FADE = 55;  // draw distance; everything fades in over the last FADE units (no pop-in)
  const PRE = 80, RUNOUT = 320;               // track before the start line and after the finish
  const WALL_H = 0.38;

  const C = {
    pink: '#ff4fd8', cyan: '#35e0ff', purple: '#9b5cff', yellow: '#ffd23f', orange: '#ff8a3d', mint: '#3dffb5',
    red: '#ff3355', text: '#ffffff', dim: '#b4c2e3', lime: '#9dff3d', blue: '#2f6bff', panel: '#0a0e1c', body: '#070a14',
    gold: '#ffd23f', silver: '#d7e0ee', bronze: '#ff9a52', tail: '#ff2a6d', glass: '#061a26',
  };

  // Three maps, three races each. Pieces: ['S', length] straight, ['R'|'L', degrees, radius] a wide freeway turn.
  const MAPS = [
    {
      name: 'GRID CITY', tier: 'ROOKIE', grid: '#1747c9', edge: C.cyan, line: '#8ff3ff', props: 'city',
      levels: [
        { name: 'ON RAMP', seed: 11, skill: [0.93, 1.01], aggro: 0.25, catchup: 0.08, combo: [3, 3], barriers: 0,
          pieces: [['S', 200], ['R', 70, 240], ['S', 140], ['L', 80, 220], ['S', 160], ['R', 45, 280], ['S', 220]] },
        { name: 'NEON LOOP', seed: 23, skill: [0.94, 1.03], aggro: 0.3, catchup: 0.08, combo: [3, 4], barriers: 2,
          pieces: [['S', 180], ['R', 180, 190], ['S', 150], ['L', 90, 230], ['S', 140], ['L', 60, 260], ['S', 200]] },
        { name: 'DOWNTOWN S', seed: 37, skill: [0.95, 1.04], aggro: 0.35, catchup: 0.09, combo: [3, 4], barriers: 3,
          pieces: [['S', 160], ['L', 60, 200], ['R', 120, 200], ['L', 120, 200], ['R', 60, 220], ['S', 160], ['R', 90, 260], ['S', 180]] },
      ],
    },
    {
      name: 'SOLAR CANYON', tier: 'PRO', grid: '#b4501a', edge: C.orange, line: '#ffd23f', props: 'canyon',
      levels: [
        { name: 'DUNE RUN', seed: 41, skill: [0.98, 1.07], aggro: 0.4, catchup: 0.09, combo: [3, 4], barriers: 4,
          pieces: [['S', 200], ['L', 90, 220], ['S', 120], ['R', 140, 200], ['S', 160], ['L', 50, 260], ['S', 220]] },
        { name: 'SUNSPIRE', seed: 53, skill: [0.99, 1.08], aggro: 0.45, catchup: 0.1, combo: [3, 4], barriers: 5,
          pieces: [['S', 150], ['R', 60, 180], ['L', 180, 200], ['R', 110, 220], ['S', 180], ['L', 40, 300], ['S', 200]] },
        { name: 'CANYON COIL', seed: 67, skill: [1.0, 1.09], aggro: 0.5, catchup: 0.1, combo: [4, 4], barriers: 6,
          pieces: [['S', 140], ['L', 120, 180], ['S', 100], ['R', 200, 190], ['S', 120], ['L', 80, 210], ['S', 200]] },
      ],
    },
    {
      name: 'VOID RINGS', tier: 'ELITE', grid: '#5a2bd6', edge: C.pink, line: '#d6b8ff', props: 'void',
      levels: [
        { name: 'EVENT HORIZON', seed: 79, skill: [1.0, 1.09], aggro: 0.55, catchup: 0.11, combo: [4, 5], barriers: 6,
          pieces: [['S', 180], ['R', 120, 200], ['L', 120, 200], ['S', 140], ['R', 180, 180], ['S', 200]] },
        { name: 'GRAVITY WELL', seed: 83, skill: [1.01, 1.1], aggro: 0.6, catchup: 0.11, combo: [4, 5], barriers: 7,
          pieces: [['S', 150], ['L', 200, 190], ['S', 120], ['R', 90, 200], ['L', 60, 200], ['S', 150], ['R', 110, 220], ['S', 180]] },
        { name: 'SINGULARITY', seed: 97, skill: [1.02, 1.11], aggro: 0.65, catchup: 0.12, combo: [5, 5], barriers: 8,
          pieces: [['S', 150], ['R', 90, 170], ['L', 180, 180], ['R', 180, 180], ['L', 90, 190], ['S', 120], ['R', 60, 240], ['S', 220]] },
      ],
    },
  ];
  // Seven rival bots: round one-wheeled beetle bots with two little claws.
  const ROSTER = [
    { name: 'ZAPP', col: C.yellow }, { name: 'NIBBS', col: C.orange }, { name: 'KRUNCH', col: C.red }, { name: 'PIXIE', col: C.pink },
    { name: 'VOLTA', col: C.purple }, { name: 'GLITCH', col: C.lime }, { name: 'BOLTZ', col: '#e6eeff' },
  ];

  // ---------- helpers ----------
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const approach = (v, t, m) => (Math.abs(t - v) <= m ? t : v + Math.sign(t - v) * m);
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  const easeOut = (t) => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
  const easeBack = (t) => { t = clamp(t, 0, 1); const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
  const laneD = (l) => l - (LANES - 1) / 2;
  const ORD = (n) => n + (n % 10 === 1 && n !== 11 ? 'ST' : n % 10 === 2 && n !== 12 ? 'ND' : n % 10 === 3 && n !== 13 ? 'RD' : 'TH');
  const PLACE_COL = (n) => (n === 1 ? C.gold : n === 2 ? C.silver : n === 3 ? C.bronze : C.text);
  const fmtTime = (t) => { const m = Math.floor(t / 60), s = t - m * 60; return `${m}:${s < 10 ? '0' : ''}${s.toFixed(1)}`; };
  function rng(seed) {
    let a = seed >>> 0;
    return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  function shuffle(a, r = Math.random) {
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  const shadeCache = new Map();
  function shade(hex, k) {
    const key = hex + k;
    let c = shadeCache.get(key);
    if (!c) {
      const n = parseInt(hex.slice(1), 16), f = (v) => Math.round(Math.min(255, v * k));
      c = `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
      shadeCache.set(key, c);
    }
    return c;
  }
  function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }

  // ---------- the track ----------
  // A centreline sampled every unit of arc length: position X/Z, heading P (radians, + = turning right).
  // s is distance along the track from the start line; d is sideways offset (lanes), + = right.
  const geoCache = new Map();
  function geometry(mi, li) {
    const key = mi + '-' + li;
    if (geoCache.has(key)) return geoCache.get(key);
    const k = [];
    for (let i = 0; i < PRE; i++) k.push(0);
    for (const p of MAPS[mi].levels[li].pieces) {
      if (p[0] === 'S') { for (let i = 0; i < p[1]; i++) k.push(0); continue; }
      const ang = (p[1] * Math.PI) / 180, n = Math.max(1, Math.round(ang * p[2])), dir = p[0] === 'R' ? 1 : -1;
      for (let i = 0; i < n; i++) k.push((dir * ang) / n);
    }
    const finish = k.length - PRE;
    for (let i = 0; i < RUNOUT; i++) k.push(0);
    const K = blur(blur(k, 22), 22); // ease every turn in and out: same total heading change, no sudden yaw
    const n = K.length + 1, X = new Float64Array(n), Z = new Float64Array(n), P = new Float64Array(n);
    for (let i = 0; i < n - 1; i++) {
      const mid = P[i] + K[i] / 2;
      P[i + 1] = P[i] + K[i]; X[i + 1] = X[i] + Math.sin(mid); Z[i + 1] = Z[i] + Math.cos(mid);
    }
    const g = { n, X, Z, P, K, finish, end: n - 1 - PRE };
    geoCache.set(key, g);
    return g;
  }
  function blur(a, r) {
    const n = a.length, pre = new Float64Array(n + 1), out = new Array(n);
    for (let i = 0; i < n; i++) pre[i + 1] = pre[i] + a[i];
    for (let i = 0; i < n; i++) out[i] = (pre[Math.min(n, i + r + 1)] - pre[Math.max(0, i - r)]) / (2 * r + 1);
    return out;
  }

  function buildTrack(mi, li) {
    const g = geometry(mi, li), L = MAPS[mi].levels[li];
    const T = Object.assign({ mi, li, L, map: MAPS[mi], items: [], ramps: [], props: [] }, g);
    populate(T);
    return T;
  }

  // Coins, boost cells, boost pads, trick ramps and (on later tracks) a few firewall barriers. Seeded, so every
  // race on a track has the same layout to learn.
  function populate(T) {
    const L = T.L, R = rng(L.seed * 7919 + 13), items = [], ramps = [];
    const all = [0, 1, 2, 3, 4, 5, 6, 7];
    const item = (kind, s, l, h = 0) => items.push({ kind, s, d: laneD(l), h, dead: false, back: 0, born: -9, taken: 0 });
    const coin = (s, l, h = 0.35) => item('coin', s, l, h);
    const landing = []; // [s0, s1, lane]: approach and landing zones, kept free of barriers
    let s = 80, nextRamp = 150 + R() * 50, nextCell = 105 + R() * 25, nextBarrier = 240, barriersLeft = L.barriers;
    const stop = T.finish - 50;
    while (s < stop) {
      if (s >= nextRamp && s < stop - 70) {
        const ls = shuffle(all.slice(), R).slice(0, 2 + (R() < 0.3 ? 1 : 0));
        for (const l of ls) {
          ramps.push({ kind: 'ramp', s, d: laneD(l), lane: l });
          for (let i = 0; i < 3; i++) coin(s - 7 + i * 1.8, l);
          for (let j = 0; j < 4; j++) { // a coin arc along the flight path
            const dd = 4 + j * 4.5, t = dd / 27, hh = RAMP_H + LAUNCH_V * t - 0.5 * GRAV * t * t + 0.3;
            if (hh > 0.6) coin(s + RAMP_LEN + dd, l, hh);
          }
          landing.push([s - 14, s + 55, l]);
        }
        nextRamp = s + 250 + R() * 100;
        s += 60 + R() * 20;
        continue;
      }
      if (s >= nextCell) {
        const off = R() < 0.5 ? 0 : 1;
        for (const l of [0, 2, 4, 6]) item('cell', s, l + off, 0.5);
        nextCell = s + 200 + R() * 80;
        s += 42 + R() * 22;
        continue;
      }
      if (barriersLeft > 0 && s >= nextBarrier) {
        const free = all.filter((l) => !landing.some((z) => z[2] === l && s > z[0] && s < z[1]));
        const ls = shuffle(free, R).slice(0, 1 + (R() < 0.35 ? 1 : 0));
        for (const l of ls) item('barrier', s, l, 0.95);
        barriersLeft--;
        nextBarrier = s + Math.max(110, (stop - s) / (barriersLeft + 1)) * (0.8 + R() * 0.4);
        s += 40 + R() * 20;
        continue;
      }
      const r = R();
      if (r < 0.5) { for (const l of shuffle(all.slice(), R).slice(0, R() < 0.7 ? 1 : 2)) for (let i = 0; i < 5; i++) coin(s + i * 1.8, l); }
      else if (r < 0.62) item('pad', s, Math.floor(R() * LANES));
      s += 45 + R() * 35;
    }
    items.sort((a, b) => a.s - b.s);
    ramps.sort((a, b) => a.s - b.s);
    T.items = items; T.ramps = ramps;

    // Scenery, kept clear of the road even where the track passes near itself.
    const PR = rng(L.seed * 31 + 7), props = [], cell = 12, hash = new Map();
    for (let i = 0; i < T.n; i += 3) {
      const key = Math.floor(T.X[i] / cell) + ',' + Math.floor(T.Z[i] / cell);
      if (!hash.has(key)) hash.set(key, []);
      hash.get(key).push(i - PRE);
    }
    const tmp = [0, 0, 0];
    const clearOfRoad = (s, d, r) => {
      worldAt(s, d, tmp, T);
      const x = tmp[0], z = tmp[1], cx = Math.floor(x / cell), cz = Math.floor(z / cell);
      for (let a = -2; a <= 2; a++) {
        for (let b = -2; b <= 2; b++) {
          const l = hash.get(cx + a + ',' + (cz + b));
          if (!l) continue;
          for (const si of l) {
            if (Math.abs(si - s) < 30) continue;
            const q = si + PRE;
            if (Math.hypot(T.X[q] - x, T.Z[q] - z) < EDGE + r + 2) return false;
          }
        }
      }
      return true;
    };
    for (let s = -PRE + 6; s < T.end - 10; s += 32) for (const side of [-1, 1]) if (clearOfRoad(s, side * (EDGE + 0.9), 0.5)) props.push({ kind: 'pylon', s, d: side * (EDGE + 0.9) });
    const kind = T.map.props;
    if (kind === 'city' || kind === 'canyon') {
      for (let s = -60; s < T.end - 10; s += (kind === 'city' ? 13 : 17) + PR() * 12) {
        const side = PR() < 0.5 ? -1 : 1, w = (kind === 'city' ? 1.6 : 1.4) + PR() * 2.4, dep = 2 + PR() * 3;
        const h = kind === 'city' ? 2.5 + PR() * 8 : 1.5 + PR() * 6, d = side * (EDGE + 2.2 + w / 2 + PR() * (kind === 'city' ? 8 : 12));
        if (clearOfRoad(s, d, Math.max(w, dep))) props.push({ kind: kind === 'city' ? 'tower' : 'rock', s, d, w, dep, h, c: PR() });
      }
      if (kind === 'canyon') for (let s = 60; s < T.end - 20; s += 130 + PR() * 60) props.push({ kind: 'arch', s });
    } else {
      for (let s = 30; s < T.end - 20; s += 68) props.push({ kind: 'ring', s });
      for (let s = -60; s < T.end - 10; s += 26 + PR() * 20) {
        const side = PR() < 0.5 ? -1 : 1, w = 0.8 + PR() * 1.4, d = side * (EDGE + 3 + PR() * 12);
        if (clearOfRoad(s, d, w)) props.push({ kind: 'shard', s, d, w, dep: w, h: 2 + PR() * 5, fl: 0.8 + PR() * 2.5, c: PR() });
      }
    }
    props.push({ kind: 'gate', s: 0, label: 'START' }, { kind: 'gate', s: T.finish, label: 'FINISH' });
    props.sort((a, b) => a.s - b.s);
    T.props = props;
  }

  // Track lookups. s may run from -PRE (behind the start) to T.end.
  let T = null;
  function worldAt(s, d, out, tr = T) {
    const q = clamp(s + PRE, 0, tr.n - 1.0001), i = q | 0, f = q - i;
    const psi = tr.P[i] + (tr.P[i + 1] - tr.P[i]) * f;
    out[0] = tr.X[i] + (tr.X[i + 1] - tr.X[i]) * f + Math.cos(psi) * d;
    out[1] = tr.Z[i] + (tr.Z[i + 1] - tr.Z[i]) * f - Math.sin(psi) * d;
    out[2] = psi;
    return out;
  }
  function psiAt(s) { const q = clamp(s + PRE, 0, T.n - 1.0001), i = q | 0; return T.P[i] + (T.P[i + 1] - T.P[i]) * (q - i); }

  // ---------- state ----------
  const S = {
    mode: 'title', // title | menu | count | race | results | paused
    ui: 0, anim: 0, slow: 1, go: false, demo: true, sel: { m: 0, l: 0 }, racers: [], P: null,
    cdT: 0, raceT: 0, finishAt: 0, resultsAt: 0, menuAt: 0, finishers: [],
    trick: null, trickAnim: null, chain: 0, chainT: 0, autoT: 0, autoSkill: 0.92, camLift: 0,
    parts: [], flyers: [], respawn: [], toast: null, shake: 0, flash: 0, redFlash: 0, hud: freshHud(),
    best: loadBest(), input: 'any', stats: freshStats(), pausedFrom: 'race', lastBump: 0, warned: 0,
    lite: QS.has('lite'), // lighter drawing, switched on by itself if the device can't keep up
  };
  function freshHud() { return { kick: 0, flash: 0, in: 0, posPop: 0, lastPos: 0, coinPop: 0, ready: 0, lastBoosts: 0, go: 0 }; }
  function freshStats() { return { bumps: 0, smashes: 0, spins: 0, perfects: 0, drafts: 0, top: 0, hitBy: 0, attacks: 0 }; }
  function loadBest() { try { return JSON.parse(localStorage.getItem('rampRivals.best') || '{}') || {}; } catch { return {}; } }
  function saveBest() { try { localStorage.setItem('rampRivals.best', JSON.stringify(S.best)); } catch { /* storage unavailable */ } }

  function newRacer(name, col, lane, skill) {
    return {
      name, col, isPlayer: false, auto: false, s: -1.5, d: laneD(lane), lane, prevLane: lane, v: 0, skill, rb: 1,
      coins: 0, boosts: 1, boostT: 0, padT: 0, draftT: 0, draftC: 0, drafting: false, landT: 0, landMul: 1, brakeT: 0,
      spinT: 0, spinA: 0, invuln: 0, stallT: 0, y: 0, vy: 0, air: false, trickSpin: 0, botTrick: false, squash: 0,
      nv: 0, wob: 0, wheelA: 0, finished: false, finishT: 0, place: 0, pos: 1, trail: [], tAcc: 0, ii: 0,
      thinkT: Math.random() * 0.3, attack: null, charge: null, attackCD: 4, blockCD: 3, ramming: false, capV: -1, aggro: 0, rampLove: 1, greed: 1,
    };
  }

  function startRace(m, l, demo = false) {
    S.sel = { m, l };
    T = buildTrack(m, l);
    ensurePano(m);
    const L = T.L, R = rng(L.seed * 101 + 3);
    const skills = shuffle(Array.from({ length: 7 }, (_, i) => lerp(L.skill[0], L.skill[1], i / 6)), R);
    const playerLane = 3 + (l % 2), lanes = shuffle([0, 1, 2, 3, 4, 5, 6, 7].filter((x) => x !== playerLane), R);
    const P = newRacer('YOU', C.cyan, playerLane, 1);
    P.isPlayer = true; P.idx = 0; P.auto = demo; P.rampLove = 1.2; P.greed = 1.3;
    S.racers = [P];
    ROSTER.forEach((b, i) => {
      const r = newRacer(b.name, b.col, lanes[i], skills[i]);
      r.idx = i + 1;
      r.aggro = L.aggro * rand(0.7, 1.3); r.rampLove = rand(0.6, 1.4); r.greed = rand(0.3, 0.9);
      S.racers.push(r);
    });
    Object.assign(S, {
      P, demo, go: demo, cdT: 0, raceT: 0, finishAt: 0, resultsAt: 0, finishers: [], trick: null, trickAnim: null,
      chain: 0, chainT: 0, parts: [], flyers: [], respawn: [], toast: null, shake: 0, flash: 0, redFlash: 0,
      slow: 1, camLift: 0, hud: freshHud(), stats: freshStats(), warned: 0,
    });
    if (!demo) { S.mode = 'count'; engine(false); }
    snapCamera();
  }

  // ---------- audio (tiny synth blips + an engine drone; unlocked by the first input) ----------
  let actx = null, eng = null;
  function unlockAudio() {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
    } catch { actx = null; }
  }
  function tone(f1, f2, dur, type, vol, delay = 0) {
    if (!actx || actx.state !== 'running') return;
    const t0 = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f1, t0);
    o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(actx.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  function engine(on) {
    if (on && !eng && actx && actx.state === 'running') {
      const o = actx.createOscillator(), f = actx.createBiquadFilter(), g = actx.createGain();
      o.type = 'sawtooth'; f.type = 'lowpass'; f.frequency.value = 420; g.gain.value = 0.014;
      o.connect(f).connect(g).connect(actx.destination); o.start();
      eng = { o };
    } else if (!on && eng) { eng.o.stop(); eng = null; }
  }
  const sfx = {
    swish: () => tone(900, 600, 0.06, 'triangle', 0.05),
    wall: () => tone(170, 90, 0.1, 'square', 0.045),
    bump: () => tone(150, 75, 0.13, 'square', 0.06),
    knock: () => { tone(280, 90, 0.2, 'square', 0.06); tone(1100, 400, 0.12, 'triangle', 0.03); },
    spin: () => { tone(700, 110, 0.55, 'sawtooth', 0.06); tone(300, 60, 0.4, 'square', 0.04, 0.05); },
    smash: () => { tone(320, 60, 0.3, 'sawtooth', 0.07); tone(1400, 500, 0.2, 'triangle', 0.04); },
    boost: () => { tone(90, 38, 0.6, 'sine', 0.14); tone(180, 900, 0.35, 'sawtooth', 0.06); tone(360, 1800, 0.45, 'triangle', 0.035); },
    deny: () => tone(150, 110, 0.18, 'square', 0.05),
    brake: () => tone(700, 300, 0.2, 'triangle', 0.03),
    coin: (n) => { const f = 1100 * (1 + n * 0.04); tone(f, f * 1.35, 0.08, 'square', 0.03); },
    cell: () => [660, 990, 1320].forEach((f, i) => tone(f, f * 1.02, 0.08, 'square', 0.035, i * 0.05)),
    pad: () => tone(300, 1300, 0.25, 'sawtooth', 0.04),
    draft: () => { tone(200, 900, 0.45, 'triangle', 0.05); tone(400, 1600, 0.3, 'sine', 0.03, 0.08); },
    launch: () => { tone(200, 1200, 0.4, 'sawtooth', 0.05); tone(900, 180, 0.6, 'triangle', 0.04, 0.15); },
    trick: (i) => tone(600 + i * 160, 900 + i * 220, 0.12, 'square', 0.04),
    perfect: () => [659, 784, 988, 1319, 1568].forEach((f, i) => tone(f, f * 1.01, 0.12, 'square', 0.04, i * 0.07)),
    land: () => tone(160, 90, 0.08, 'triangle', 0.05),
    beep: (hi) => tone(hi ? 880 : 440, hi ? 880 : 440, hi ? 0.45 : 0.16, 'square', 0.05),
    warn: () => { tone(1250, 1250, 0.05, 'square', 0.03); tone(1250, 1250, 0.05, 'square', 0.03, 0.09); },
    up: () => tone(700, 1200, 0.1, 'triangle', 0.035),
    select: () => tone(700, 950, 0.07, 'triangle', 0.045),
    finish: () => [523, 659, 784, 1046, 1319].forEach((f, i) => tone(f, f, 0.16, 'square', 0.045, i * 0.09)),
  };

  // ---------- input ----------
  // Glasses: Neural Band / temple touchpad swipes arrive as Arrow keys, a pinch as Enter (match on `key`; device
  // events have an empty `code`; Escape is the system Back, left alone). Phones: swipe and tap the screen.
  const KEYS = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down', a: 'left', d: 'right', w: 'up', s: 'down', A: 'left', D: 'right', W: 'up', S: 'down' };
  window.addEventListener('keydown', (e) => {
    const k = e.key || e.code;
    if (k === 'Enter' || k === ' ') {
      e.preventDefault();
      if (!e.repeat) { S.input = 'pinch'; onSelect(); }
      return;
    }
    const d = KEYS[k];
    if (d) {
      e.preventDefault();
      if (!e.repeat) onDir(d);
    }
  });

  let ptr = null;
  window.addEventListener('pointerdown', (e) => {
    if (!e.isPrimary) return;
    unlockAudio();
    if (e.pointerType === 'touch') S.input = 'tap';
    const r = canvas.getBoundingClientRect();
    ptr = { id: e.pointerId, x: e.clientX, y: e.clientY, t: performance.now(), fired: false, last: null, sy: ((e.clientY - r.top) / r.height) * H };
  });
  window.addEventListener('pointermove', (e) => {
    if (!ptr || e.pointerId !== ptr.id) return;
    const dx = e.clientX - ptr.x, dy = e.clientY - ptr.y, th = Math.max(14, 30 * (canvas.getBoundingClientRect().width / W));
    if (Math.hypot(dx, dy) < th) return;
    const dir = Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 'left' : 'right') : dy < 0 ? 'up' : 'down';
    if (!ptr.fired || dir !== ptr.last) onDir(dir); // one swipe per stroke; a change of direction counts again
    ptr.fired = true; ptr.last = dir; ptr.x = e.clientX; ptr.y = e.clientY;
  });
  window.addEventListener('pointerup', (e) => {
    unlockAudio();
    if (!ptr || e.pointerId !== ptr.id) return;
    if (!ptr.fired && performance.now() - ptr.t < 450) onTap(ptr.sy);
    ptr = null;
  });
  window.addEventListener('pointercancel', () => { ptr = null; });
  document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
  document.addEventListener('gesturestart', (e) => e.preventDefault());

  // A tap is a pinch, except mid-race, where only a tap on the top HUD pauses (stray taps while swiping do nothing).
  function onTap(y) {
    if ((S.mode === 'race' || S.mode === 'count') && y > 96) return;
    onSelect();
  }

  function onSelect() {
    unlockAudio();
    const m = S.mode;
    if (m === 'title') { S.mode = 'menu'; S.menuAt = S.ui; sfx.select(); startRace(0, 0, true); }
    else if (m === 'menu') { sfx.select(); startRace(S.sel.m, S.sel.l, false); }
    else if (m === 'count' || m === 'race') { S.pausedFrom = m; S.mode = 'paused'; engine(false); }
    else if (m === 'paused') S.mode = S.pausedFrom;
    else if (m === 'results' && S.ui - S.resultsAt > 0.8) nextRace();
  }

  function onDir(d) {
    unlockAudio();
    const m = S.mode;
    if (m === 'title') { onSelect(); return; }
    if (m === 'menu') { menuDir(d); return; }
    if (m === 'paused') { if (d === 'down') { sfx.select(); startRace(S.sel.m, S.sel.l); } else if (d === 'left') toMenu(); return; }
    if (m === 'results') {
      if (S.ui - S.resultsAt < 0.8) return;
      if (d === 'down') { sfx.select(); startRace(S.sel.m, S.sel.l); } else if (d === 'left') toMenu(); else nextRace();
      return;
    }
    if (m === 'count') { if (d === 'up') rocketTry(); return; }
    if (m !== 'race') return;
    const P = S.P;
    if (S.trick && S.trick.state === 'active' && !S.trick.landed) { trickInput(d); return; }
    if (P.finished || P.auto) return;
    if (d === 'up' && S.raceT < 0.25 && P.rocket === undefined) { rocketTry(); return; }
    if (d === 'left') tryLane(P, -1);
    else if (d === 'right') tryLane(P, 1);
    else if (d === 'up') useBoost(P);
    else brake(P);
  }

  function menuDir(d) {
    let { m, l } = S.sel;
    if (d === 'left') m = (m + MAPS.length - 1) % MAPS.length;
    else if (d === 'right') m = (m + 1) % MAPS.length;
    else if (d === 'up') l = (l + 2) % 3;
    else l = (l + 1) % 3;
    if (d === 'left' || d === 'right') l = 0;
    sfx.swish();
    S.menuPop = S.ui;
    startRace(m, l, true);
  }

  function nextRace() {
    sfx.select();
    let { m, l } = S.sel;
    if (++l > 2) { l = 0; m = (m + 1) % MAPS.length; }
    startRace(m, l);
  }

  // Back to the menu reloads from the server under a fresh URL so the glasses pick up any new build.
  function toMenu() {
    const { m, l } = S.sel;
    if (/^https?:$/.test(location.protocol) && navigator.onLine !== false && !QS.has('noreload')) {
      engine(false);
      location.replace(`${location.pathname}?v=${Date.now()}&menu=${m}-${l}`);
      return;
    }
    S.mode = 'menu'; S.menuAt = S.ui; startRace(m, l, true);
  }

  // Swipe up right as the lights hit GO for a rocket start; too early and you stall.
  function rocketTry() {
    const P = S.P;
    if (P.rocket !== undefined) return;
    const t = S.mode === 'count' ? S.cdT : 3 + S.raceT;
    if (t < 2.7) { P.rocket = false; toast('TOO EARLY!', C.orange); sfx.deny(); return; }
    P.rocket = true;
    if (S.mode === 'race') fireRocket(P);
  }
  function fireRocket(r) {
    r.v = V_BASE * r.skill * 0.95; r.boostT = Math.max(r.boostT, 1.1);
    if (r.isPlayer) { toast('ROCKET START!', C.mint); sfx.boost(); S.hud.kick = 1; }
  }

  // ---------- racing actions ----------
  const topSpeed = (r) => V_BASE * r.skill * (1 + COIN_BONUS * r.coins) * r.rb;

  // A lane is taken if another racer is alongside in it (or passing through it).
  function occupant(r, l, reach = RL) {
    const ld = laneD(l);
    for (const o of S.racers) {
      if (o === r || o.air || o.spinT > 0) continue;
      if (Math.abs(o.s - r.s) < reach && (o.lane === l || Math.abs(o.d - ld) < 0.62)) return o;
    }
    return null;
  }

  // Swipe left/right. Moving into a lane where someone is alongside doesn't happen: you bump them instead.
  function tryLane(r, dir) {
    if (r.spinT > 0 || r.air) return false;
    const to = r.lane + dir;
    if (to < 0 || to >= LANES) {
      r.nv = dir * 0.22; r.wob = 0.3;
      if (r.isPlayer) { sfx.wall(); S.shake = Math.max(S.shake, 0.08); burst(r.s + 0.3, r.d + dir * 0.45, 0.2, 6, T.map.edge, 3, 0.3); }
      return false;
    }
    const o = occupant(r, to);
    if (o) { bumpHit(r, o, dir); return false; }
    r.prevLane = r.lane; r.lane = to;
    if (r.isPlayer) sfx.swish();
    return true;
  }

  // m tried to move sideways into o. Only a faster racer knocks the other one (a boosting one spins them out).
  function bumpHit(m, o, dir) {
    m.nv = dir * 0.3; // lunges at them, then springs back into its lane
    const faster = m.v > o.v + 0.3;
    burst(m.s + 0.2, m.d + dir * 0.4, 0.5, 6, C.text, 3, 0.3);
    if (faster && o.spinT <= 0) {
      if (m.boostT > 0) spinOut(o, m, 'boost');
      else knock(o, dir, m);
    } else {
      m.wob = 0.35;
      if (m.isPlayer || o.isPlayer) sfx.bump();
    }
  }

  function knock(o, dir, by) {
    if (o.invuln > 0) { o.wob = 0.3; return; }
    o.v *= KNOCK_MULT; o.nv = dir * 0.42; o.wob = 0.55;
    burst(o.s, o.d - dir * 0.3, 0.5, 8, C.text, 3, 0.35);
    if (o.isPlayer) { S.shake = Math.max(S.shake, 0.22); S.redFlash = 0.35; S.stats.hitBy++; sfx.knock(); }
    else if (by.isPlayer) { sfx.knock(); S.stats.bumps++; }
  }

  // The big one: spun out, slowed right down, coins knocked loose. A boost hit also shoves them aside.
  function spinOut(o, by, why) {
    if (o.spinT > 0 || o.invuln > 0 || o.air) return false;
    o.spinT = SPIN_T; o.spinA = 0; o.invuln = SPIN_T + INVULN_T; o.v *= 0.55;
    o.boostT = 0; o.draftT = 0; o.landT = 0; o.attack = null; o.charge = null; o.ramming = false;
    const lost = Math.min(o.coins, SPIN_COINS);
    o.coins -= lost;
    for (let i = 0; i < lost; i++) S.parts.push({ s: o.s, d: o.d, h: 0.8, vs: rand(-2, 6), vd: rand(-3, 3), vh: rand(3, 6), life: 0.9, max: 0.9, col: C.yellow, sz: 0.14 });
    burst(o.s, o.d, 0.6, 16, o.col, 5, 0.7);
    if (by && (why === 'ram' || why === 'boost')) {
      const away = by.d < o.d ? 1 : by.d > o.d ? -1 : pick([-1, 1]);
      for (const dd of [away, -away]) {
        const l = o.lane + dd;
        if (l >= 0 && l < LANES && !occupant(o, l, RL + 0.4)) { o.prevLane = o.lane; o.lane = l; break; }
      }
    }
    if (o.isPlayer) {
      S.shake = 0.4; S.redFlash = 0.5; S.stats.spins++; if (by) S.stats.hitBy++; sfx.spin();
      const who = !by ? 'FIREWALL!' : why === 'stomp' ? `${by.name} LANDED ON YOU!` : `${by.name} ${why === 'ram' ? 'RAMMED' : 'SMASHED'} YOU!`;
      toast(lost ? `${who} -${lost}` : who, C.red);
    } else if (by && by.isPlayer) {
      S.stats.smashes++; sfx.smash();
      toast(`${why === 'stomp' ? 'STOMPED' : 'SMASHED'} ${o.name}!`, C.mint);
    }
    return true;
  }

  function useBoost(r) {
    if (r.spinT > 0 || r.air || r.stallT > 0) return false;
    if (r.boosts < 1) { if (r.isPlayer) sfx.deny(); return false; }
    r.boosts--; r.boostT = BOOST_T; r.brakeT = 0;
    const top = topSpeed(r);
    r.v = Math.min(Math.max(r.v * BOOST_JOLT, top * BOOST_JOLT), top * BOOST_MULT * 1.08);
    burst(r.s - 0.4, r.d, 0.25, 12, r.isPlayer ? C.cyan : r.col, 5, 0.45);
    if (r.isPlayer) { sfx.boost(); S.hud.kick = 1; S.shake = Math.max(S.shake, 0.2); }
    return true;
  }

  function brake(r) {
    if (r.spinT > 0 || r.air) return;
    r.brakeT = BRAKE_T; r.boostT = 0;
    if (r.isPlayer) sfx.brake();
  }

  // ---------- tricks (the Lane Runner combo: drive over a ramp, time slows, swipe the arrows shown) ----------
  const airLeft = (r) => (r.vy + Math.sqrt(Math.max(0, r.vy * r.vy + 2 * GRAV * r.y))) / GRAV;

  function launch(r) {
    r.air = true; r.y = RAMP_H; r.vy = LAUNCH_V + (r.boostT > 0 ? 1.2 : 0);
    burst(r.s, r.d, 0.4, 12, r.isPlayer ? C.pink : r.col, 4, 0.5);
    if (r.isPlayer) {
      const [lo, hi] = T.L.combo, n = clamp(lo + Math.floor(S.chain / 2), lo, hi);
      S.trick = { seq: Array.from({ length: n }, () => pick(DIR_LIST)), i: 0, state: 'active', total: airLeft(r), landed: false, hide: 0, born: S.ui };
      S.autoT = 0.35;
      S.shake = Math.max(S.shake, 0.15); sfx.launch();
    } else {
      r.trickSpin = 0; r.botTrick = Math.random() < 0.55 + r.rampLove * 0.25;
    }
  }

  function trickInput(d) {
    const Tk = S.trick;
    if (d !== Tk.seq[Tk.i]) {
      Tk.state = 'fail'; Tk.failAt = S.ui; S.chain = 0; sfx.deny();
      return;
    }
    Tk.i++;
    S.trickAnim = { dir: d, t: 0 };
    (Tk.hitAt = Tk.hitAt || [])[Tk.i - 1] = S.ui;
    burst(S.P.s, S.P.d, S.P.y + 0.4, 10, pick([C.pink, C.cyan, C.yellow]), 4, 0.5);
    sfx.trick(Tk.i);
    if (Tk.i === Tk.seq.length) {
      Tk.state = 'done';
      S.chain = Math.min(4, S.chain + 1); S.chainT = CHAIN_T; S.stats.perfects++;
      S.P.boosts = Math.min(BOOST_MAX, S.P.boosts + 1);
      sfx.perfect();
    }
  }

  function land(r) {
    r.air = false; r.y = 0; r.vy = 0; r.squash = 1;
    // Coming down on someone stomps them.
    for (const o of S.racers) {
      if (o !== r && !o.air && o.spinT <= 0 && Math.abs(o.s - r.s) < RL && Math.abs(o.d - r.d) < RW) spinOut(o, r, 'stomp');
    }
    burst(r.s, r.d, 0.1, 14, r.isPlayer ? C.cyan : r.col, 4, 0.5);
    if (!r.isPlayer) { if (r.botTrick) { r.landT = 1.3; r.landMul = 1.33; } r.trickSpin = 0; return; }
    const Tk = S.trick;
    sfx.land();
    S.shake = Math.max(S.shake, 0.18);
    if (!Tk) return;
    Tk.landed = true; Tk.hide = 1.3; S.trickAnim = null;
    // Landing boost: a perfect combo gives a big one (bigger with a style chain), a partial one a little.
    if (Tk.state === 'done') { r.landT = 1.5; r.landMul = 1.36 + 0.03 * S.chain; }
    else if (Tk.state === 'active' && Tk.i > 0) { r.landT = 0.35 + 0.2 * Tk.i; r.landMul = 1.2; }
  }

  // ---------- rival AI ----------
  function think(r, dt) {
    if ((r.thinkT -= dt) > 0) return;
    r.thinkT = rand(0.16, 0.34);
    const P = S.P;
    // Catch-up: rivals behind you push hard; ones ahead only ease off a touch, so the pack stays on you.
    const gB = P.s - r.s;
    r.rb = r.isPlayer ? 1 : gB > 0 ? 1 + Math.min(1, gB / 80) * T.L.catchup : 1 - Math.min(1, -gB / 150) * 0.04;
    if (r.air || r.spinT > 0 || r.attack || r.charge || !S.go || (r.ramming && r.boostT > 0)) return;
    const look = 7 + r.v * 0.8, cruise = topSpeed(r), gP = P.s - r.s;
    // Aggressive rivals near you line up for a hit: the lane beside you, or yours if they have a boost to ram with.
    const hunt = !r.isPlayer && S.mode === 'race' && !P.finished && !P.air && r.attackCD <= 0 && gP > -3 && gP < 14 ? r.aggro : 0;
    const saving = hunt > 0 && gP > 0; // a hunter just behind you keeps its boost for you
    // The autopilot (demo, tests) gets out of the way of anything about to hit it.
    const dodge = r.isPlayer ? S.racers.find((o) => o !== r && ((o.attack && o.attack.who === r) || (o.charge && o.charge.who === r) || (o.ramming && o.boostT > 0 && Math.abs(o.d - r.d) < 0.6 && r.s - o.s > 0 && r.s - o.s < 12))) : null;
    let best = r.lane, bestSc = -1e9;
    for (let l = r.lane - 1; l <= r.lane + 1; l++) {
      if (l < 0 || l >= LANES) continue;
      if (l !== r.lane && occupant(r, l, RL + 0.7)) continue;
      const ld = laneD(l);
      let sc = l === r.lane ? 0.4 : 0;
      for (const o of S.racers) {
        if (o === r || o.air) continue;
        if (Math.abs(o.d - ld) > 0.6 && o.lane !== l) continue;
        const g = o.s - r.s;
        if (g <= 0.2 || g > look) continue;
        const closing = cruise - o.v;
        if (o.spinT > 0) sc -= 2;
        else if (closing > 0.8 && g < closing * 1.8 + 3) sc -= 1 + 2.2 * (1 - g / (look + 1));
        else if (g > DRAFT_MIN && g < DRAFT_MAX) sc += 0.5;
      }
      const it = T.items;
      for (let j = r.ii; j < it.length && it[j].s < r.s + look + 12; j++) {
        const o = it[j];
        if ((o.dead && r.isPlayer) || o.gone || o.s < r.s + 0.5 || Math.abs(o.d - ld) > 0.5) continue;
        if (o.kind === 'barrier') { if (o.s < r.s + look + 6 && r.boostT < 0.5) sc -= 9; }
        else if (o.kind === 'coin') { if (r.coins < COIN_MAX) sc += 0.16 * r.greed; }
        else if (o.kind === 'cell') { if (r.boosts < BOOST_MAX) sc += 0.9 * r.greed; }
        else if (o.kind === 'pad') sc += 0.6;
      }
      for (const rp of T.ramps) { if (rp.s > r.s + 34) break; if (rp.s > r.s + 2 && Math.abs(rp.d - ld) < 0.5) sc += r.rampLove; }
      if (hunt) { if (Math.abs(l - P.lane) === 1) sc += hunt * 2.2; else if (l === P.lane && r.boosts > 0 && gP > 2) sc += hunt * 2; }
      if (dodge) sc += Math.abs(ld - dodge.d) * 0.8 + (l === r.lane ? -1.5 : 0);
      sc -= Math.abs(ld) * 0.02 + Math.random() * 0.15;
      if (sc > bestSc) { bestSc = sc; best = l; }
    }
    if (best !== r.lane) tryLane(r, Math.sign(best - r.lane));
    // Block: when you come up fast behind them in the next lane, they cut across in front of you.
    else if (!r.isPlayer && S.mode === 'race' && r.blockCD <= 0 && !P.finished && !P.air) {
      const g = r.s - P.s, ld = P.lane - r.lane;
      if (Math.abs(ld) === 1 && g > 5 && g < 12 && P.v > r.v + 0.5 && Math.random() < r.aggro * 0.35 && tryLane(r, ld)) r.blockCD = rand(4, 8);
    }

    // Boosts: ram you if you're just ahead in their lane, catch up if far behind, or just use them on a clear road.
    if (r.boosts > 0 && r.boostT <= 0 && r.stallT <= 0) {
      const g = P.s - r.s, same = Math.abs(P.d - r.d) < 0.5;
      if (!r.isPlayer && S.mode === 'race' && same && g > 1.5 && g < 9 && !P.air && P.spinT <= 0 && !P.finished && Math.random() < r.aggro * 0.6) { useBoost(r); r.ramming = true; S.stats.attacks++; }
      else if (!r.isPlayer && g > 12 && Math.random() < 0.35 && clearAhead(r, 18)) useBoost(r);
      else if (!saving && Math.random() < (r.isPlayer ? 0.12 : 0.14) && clearAhead(r, 24)) useBoost(r);
    }
    // Side attacks: when alongside someone and faster, telegraph (claws out, red arrows), then swerve into them.
    if (!r.isPlayer && S.mode === 'race' && r.attackCD <= 0 && S.raceT > 4) {
      for (const o of S.racers) {
        if (o === r || o.air || o.spinT > 0 || o.finished) continue;
        const ld = o.lane - r.lane;
        if (Math.abs(ld) !== 1 || Math.abs(o.d - laneD(o.lane)) > 0.15) continue;
        const want = Math.min(0.7, o.isPlayer ? r.aggro * 1.6 : r.aggro * 0.3), dv = r.v - o.v, g = o.s - r.s;
        if (dv > 0.6 && dv < 6 && g > -0.3 && g < 0.9 && Math.random() < want) { r.attack = { t: ATTACK_T, dir: ld, who: o }; r.attackCD = rand(4, 9); if (o.isPlayer) S.stats.attacks++; break; }
        if (o.isPlayer && r.boosts > 0 && r.boostT <= 0 && g > 1.5 && g < 7 && Math.random() < r.aggro * 0.8) {
          useBoost(r); r.charge = { who: o, dir: ld, t: 1.4 }; r.attackCD = rand(5, 10); S.stats.attacks++; break;
        }
      }
    }
  }

  function clearAhead(r, dist) {
    for (const o of S.racers) if (o !== r && Math.abs(o.d - r.d) < 0.7 && o.s > r.s && o.s - r.s < dist) return false;
    for (const b of T.items) if (b.kind === 'barrier' && !b.gone && b.s > r.s && b.s - r.s < dist + 20 && Math.abs(b.d - r.d) < 0.6) return false;
    return true;
  }

  // Rivals (and the autopilot) follow a slower racer rather than rear-ending it, unless they're ramming.
  function capSpeed(r) {
    r.capV = -1;
    if (r.attack) { r.capV = r.attack.who.v + 1.2; return; } // pull alongside while winding up
    if ((r.ramming || r.charge) && r.boostT > 0) return;
    for (const o of S.racers) {
      if (o === r || o.air || o.spinT > 0) continue;
      const g = o.s - r.s;
      if (g <= 0 || g > 8 || Math.abs(o.d - r.d) > 0.65) continue;
      if (r.v > o.v - 0.2 && g < (r.v - o.v) * 0.9 + 1.7) r.capV = Math.max(0, o.v - 0.3);
    }
  }

  function attackTick(r, dt) {
    if (r.charge) { // boosting up the next lane: swerve in once alongside
      const c = r.charge;
      if (r.spinT > 0 || r.air || (c.t -= dt) <= 0) r.charge = null;
      else if (c.who.lane === r.lane + c.dir && Math.abs(c.who.s - r.s) < 0.8) { r.charge = null; tryLane(r, c.dir); }
      else if (c.who.lane !== r.lane + c.dir && c.who.lane !== r.lane) r.charge = null; // they got away
    }
    if (!r.attack) return;
    if (r.spinT > 0 || r.air) { r.attack = null; return; }
    if ((r.attack.t -= dt) > 0) return;
    const { dir, who } = r.attack;
    r.attack = null;
    if (who.lane === r.lane + dir && Math.abs(who.s - r.s) < RL + 0.3) tryLane(r, dir);
  }

  // ---------- simulation ----------
  function updateRacer(r, dt) {
    r.boostT = Math.max(0, r.boostT - dt); r.padT = Math.max(0, r.padT - dt); r.draftT = Math.max(0, r.draftT - dt);
    r.landT = Math.max(0, r.landT - dt); r.brakeT = Math.max(0, r.brakeT - dt); r.invuln = Math.max(0, r.invuln - dt);
    r.stallT = Math.max(0, r.stallT - dt); r.attackCD -= dt; r.blockCD -= dt; r.wob = Math.max(0, r.wob - dt); r.squash = Math.max(0, r.squash - dt * 4);
    r.nv = approach(r.nv, 0, dt * 2.2);
    if (r.spinT > 0) { r.spinT -= dt; r.spinA += dt * 13; if (r.spinT <= 0) { r.spinT = 0; r.spinA = 0; } }

    const top = topSpeed(r);
    let mult = 1;
    if (r.boostT > 0) mult = BOOST_MULT;
    if (r.padT > 0) mult = Math.max(mult, PAD_MULT);
    if (r.draftT > 0) mult = Math.max(mult, DRAFT_MULT);
    if (r.landT > 0) mult = Math.max(mult, r.landMul);
    let tgt = top * mult;
    if (r.brakeT > 0) tgt *= BRAKE_MULT;
    if (r.capV >= 0) tgt = Math.min(tgt, r.capV);
    if (r.spinT > 0) tgt = top * SPIN_MULT;
    if (r.finished) tgt *= clamp((T.end - 40 - r.s) / 160, 0, 0.8); // coast to a stop in the run-out
    if (!S.go || r.stallT > 0) tgt = 0;
    if (r.v < tgt) r.v = Math.min(tgt, r.v + (2.5 + (tgt - r.v) * 0.85) * dt);
    else r.v = Math.max(tgt, r.v - (1.5 + (r.v - tgt) * 2.2) * dt);

    const prevS = r.s;
    r.s += r.v * dt;
    r.wheelA += (r.v * dt) / 0.24;
    const td = laneD(r.lane), diff = td - r.d, mv = LANE_SPEED * dt;
    r.d += Math.abs(diff) <= mv ? diff : Math.sign(diff) * mv;

    // Ramps: drive up the wedge, launch off the lip.
    if (r.air) {
      r.vy -= GRAV * dt; r.y += r.vy * dt;
      if (!r.isPlayer) r.trickSpin = Math.min(1, r.trickSpin + dt * 1.3);
      if (r.y <= 0) land(r);
    } else {
      let on = null, lip = false;
      for (const rp of T.ramps) {
        if (rp.s > r.s + 1) break;
        if (Math.abs(r.d - rp.d) >= 0.5) continue;
        const end = rp.s + RAMP_LEN;
        if (r.s >= rp.s && r.s < end) { on = rp; break; }
        if (prevS < end && r.s >= end && prevS >= rp.s - 0.6) { lip = true; break; }
      }
      if (lip) launch(r);
      else r.y = on ? (RAMP_H * (r.s - on.s)) / RAMP_LEN : 0;
    }

    // Pick-ups and hazards.
    const it = T.items;
    while (r.ii < it.length && it[r.ii].s < prevS - 3) r.ii++;
    for (let j = r.ii; j < it.length && it[j].s < r.s + 1; j++) {
      const o = it[j];
      if ((o.dead && r.isPlayer) || o.gone || Math.abs(o.d - r.d) > 0.6) continue;
      if (o.kind === 'coin' || o.kind === 'cell') {
        if (o.s < prevS - 0.5 || o.s > r.s + 0.5 || Math.abs(o.h - (r.y + 0.45)) > 0.75) continue;
        // Pick-ups are yours: a rival grabs its own copy (once) and yours stays put.
        const bit = 1 << r.idx;
        if (o.taken & bit) continue;
        o.taken |= bit;
        if (r.isPlayer) { o.dead = true; o.back = RESPAWN_T; S.respawn.push(o); }
        if (o.kind === 'coin') takeCoin(r, o); else takeCell(r, o);
      } else if (o.kind === 'pad') {
        if (!r.air && r.s >= o.s && prevS <= o.s + 3) {
          if (r.isPlayer && r.padT <= 0) { sfx.pad(); S.hud.kick = Math.max(S.hud.kick, 0.6); }
          r.padT = PAD_T;
        }
      } else if (o.kind === 'barrier') {
        if (r.y > 0.9) continue;
        if (r.s + RL / 2 > o.s && r.s - RL / 2 < o.s + 0.6) hitBarrier(r, o);
      }
    }

    // Slipstream: tuck in behind someone in your lane to charge it, then it fires.
    r.drafting = false;
    if (!r.air && r.spinT <= 0 && r.v > 12 && !r.finished) {
      for (const o of S.racers) {
        if (o === r || o.air) continue;
        const g = o.s - r.s;
        if (g > DRAFT_MIN && g < DRAFT_MAX && Math.abs(o.d - r.d) < 0.45) { r.drafting = true; break; }
      }
    }
    if (r.drafting) {
      if ((r.draftC += dt / DRAFT_CHARGE) >= 1) {
        r.draftC = 0; r.draftT = DRAFT_T;
        if (r.isPlayer) { toast('SLIPSTREAM!', C.text); sfx.draft(); S.hud.kick = Math.max(S.hud.kick, 0.7); S.stats.drafts++; }
      }
    } else r.draftC = Math.max(0, r.draftC - dt * 1.5);

    if (!r.finished && r.s >= T.finish) {
      r.finished = true;
      r.finishT = S.raceT - (r.s - T.finish) / Math.max(1, r.v);
      S.finishers.push(r); r.place = S.finishers.length;
      if (r.isPlayer) playerFinished();
    }

    r.tAcc += r.v * dt;
    if (r.tAcc >= 0.6) {
      r.tAcc = 0;
      r.trail.push({ s: r.s, d: r.d + r.nv, h: r.y });
      if (r.trail.length > (r.isPlayer ? 22 : 7)) r.trail.shift();
    }
  }

  function takeCoin(r, o) {
    if (r.coins < COIN_MAX) r.coins++;
    burst(o.s, o.d, o.h, 4, C.yellow, 2, 0.35);
    if (r.isPlayer) { sfx.coin(r.coins); flyCoin(o); }
  }
  function takeCell(r, o) {
    r.boosts = Math.min(BOOST_MAX, r.boosts + 1);
    burst(o.s, o.d, o.h, 10, C.cyan, 3, 0.45);
    if (r.isPlayer) sfx.cell();
  }
  function hitBarrier(r, o) {
    o.gone = true; o.exitT = 0.7; o.exitDir = o.d < 0 ? -1 : 1;
    if (r.boostT > 0 || r.padT > 0) {
      burst(o.s, o.d, 0.5, 18, C.red, 6, 0.7);
      if (r.isPlayer) { sfx.smash(); S.shake = Math.max(S.shake, 0.2); }
    } else spinOut(r, null, 'wall');
  }

  function playerFinished() {
    const P = S.P;
    S.finishAt = S.ui; P.auto = true; S.trick = null; S.slow = 1;
    toast(`${ORD(P.place)} PLACE!`, PLACE_COL(P.place));
    sfx.finish();
    const key = S.sel.m + '-' + S.sel.l, b = S.best[key];
    S.newBest = !b || P.place < b.place || (P.place === b.place && P.finishT < b.time);
    if (S.newBest) { S.best[key] = { place: P.place, time: P.finishT }; saveBest(); }
  }

  function contacts() {
    const R = S.racers;
    for (let a = 0; a < R.length; a++) {
      const A = R[a];
      if (A.air || A.spinT > 0) continue;
      for (let b = a + 1; b < R.length; b++) {
        const B = R[b];
        if (B.air || B.spinT > 0) continue;
        const ds = B.s - A.s, dd = B.d - A.d;
        if (Math.abs(ds) >= RL || Math.abs(dd) >= RW) continue;
        const sd = Math.sign(dd), mA = sd !== 0 && movingToward(A, sd), mB = sd !== 0 && movingToward(B, -sd);
        if (mA || mB) {
          // Someone moved over into a racer alongside: they bounce back to their lane.
          const m = mA && mB ? (A.v >= B.v ? A : B) : mA ? A : B, o = m === A ? B : A, dir = m === A ? sd : -sd;
          m.lane = m.prevLane;
          bumpHit(m, o, dir);
        } else if (Math.abs(dd) < 0.45) {
          if (ds >= 0) rearBump(A, B); else rearBump(B, A);
        }
      }
    }
  }
  const movingToward = (r, dir) => { const g = laneD(r.lane) - r.d; return Math.abs(g) > 0.02 && Math.sign(g) === dir; };

  // Running into the back of someone: boosting knocks them flying, otherwise you just lose your speed.
  function rearBump(rear, front) {
    if (rear.boostT > 0 && front.invuln <= 0) { spinOut(front, rear, 'ram'); rear.v *= 0.93; }
    else {
      if (rear.v > front.v) rear.v = front.v * 0.9;
      rear.wob = Math.max(rear.wob, 0.3); front.wob = Math.max(front.wob, 0.2);
      if ((rear.isPlayer || front.isPlayer) && S.ui - S.lastBump > 0.3) { S.lastBump = S.ui; sfx.bump(); if (rear.isPlayer) S.shake = Math.max(S.shake, 0.12); }
    }
    rear.s = Math.min(rear.s, front.s - RL);
  }

  function rank() {
    const arr = S.racers.slice().sort((a, b) => (a.finished && b.finished ? a.finishT - b.finishT : a.finished ? -1 : b.finished ? 1 : b.s - a.s));
    arr.forEach((r, i) => { r.pos = i + 1; });
    return arr;
  }

  function simulate(dt) {
    let vmax = 1;
    for (const r of S.racers) vmax = Math.max(vmax, r.v);
    const steps = Math.max(1, Math.ceil((vmax * dt) / 0.35)), h = dt / steps;
    for (let k = 0; k < steps; k++) {
      for (const r of S.racers) {
        if (!r.isPlayer || r.auto) { think(r, h); attackTick(r, h); capSpeed(r); }
        else r.capV = -1;
      }
      for (const r of S.racers) updateRacer(r, h);
      contacts();
    }
    for (let i = S.respawn.length - 1; i >= 0; i--) {
      const o = S.respawn[i];
      if ((o.back -= dt) <= 0) { o.dead = false; o.taken &= ~1; o.born = S.anim; S.respawn.splice(i, 1); }
    }
    for (const o of T.items) if (o.exitT > 0) o.exitT -= dt;
    rank();
  }

  function updateParts(dt) {
    for (const p of S.parts) {
      p.life -= dt; p.s += p.vs * dt; p.d += p.vd * dt;
      p.vh -= 9 * dt; p.h = Math.max(0, p.h + p.vh * dt);
    }
    S.parts = S.parts.filter((p) => p.life > 0);
  }
  function burst(s, d, h, n, col, spd = 3, life = 0.6) {
    n = Math.ceil(n / 2);
    for (let i = 0; i < n; i++) S.parts.push({ s, d, h, vs: rand(-0.5, 1) * spd, vd: rand(-0.5, 0.5) * spd * 0.5, vh: rand(0.2, 1) * spd, life, max: life, col, sz: 0.07 });
    if (S.parts.length > 260) S.parts.splice(0, S.parts.length - 260);
  }
  function toast(text, color) { S.toast = { text, color, t: 1.4 }; }

  function flyCoin(o) {
    const p = proj(o.s, o.d, o.h);
    if (p && S.flyers.length < 12) { S.flyers.push({ x: p.x, y: p.y, t: 0 }); }
  }

  function update(dt) {
    // Real-time UI first; the world then runs in (possibly slowed) world time.
    S.ui += dt;
    if (S.toast && (S.toast.t -= dt) <= 0) S.toast = null;
    if (S.trickAnim && (S.trickAnim.t += dt) >= TRICK_T) S.trickAnim = null;
    if (S.trick && S.trick.landed && (S.trick.hide -= dt) <= 0) S.trick = null;
    const Hh = S.hud, P = S.P;
    Hh.kick = Math.max(0, Hh.kick - dt * 1.6); Hh.flash = Math.max(0, Hh.flash - dt * 4);
    Hh.posPop = Math.max(0, Hh.posPop - dt * 3); Hh.coinPop = Math.max(0, Hh.coinPop - dt * 4); Hh.ready = Math.max(0, Hh.ready - dt * 2);
    Hh.in = S.demo ? 0 : Math.min(1, Hh.in + dt * 2.5);
    for (const f of S.flyers) if ((f.t += dt) >= 0.45) Hh.coinPop = 1;
    S.flyers = S.flyers.filter((f) => f.t < 0.45);
    S.redFlash = Math.max(0, S.redFlash - dt * 1.5);
    if (S.mode === 'paused') return;

    // Autopilot (demo, after the finish line, and the tests) swipes the trick combo too.
    if (P.auto && S.trick && S.trick.state === 'active' && !S.trick.landed && (S.autoT -= dt) <= 0) {
      S.autoT = 0.28;
      const Tk = S.trick;
      trickInput(Math.random() < S.autoSkill ? Tk.seq[Tk.i] : pick(DIR_LIST.filter((x) => x !== Tk.seq[Tk.i])));
    }
    const slowTarget = S.trick && S.trick.state === 'active' && !S.trick.landed ? SLOW : 1;
    S.slow = approach(S.slow, slowTarget, dt * 3);
    const wdt = dt * S.slow;
    S.anim += wdt;
    S.shake = Math.max(0, S.shake - dt); S.flash = Math.max(0, S.flash - dt);

    if (S.mode === 'count') {
      const before = S.cdT;
      S.cdT += dt;
      for (const k of [0, 1, 2]) if (before <= k && S.cdT > k) sfx.beep(false);
      if (S.cdT >= 3) {
        S.mode = 'race'; S.go = true; S.raceT = 0; S.hud.go = S.ui; sfx.beep(true);
        for (const r of S.racers) {
          if (r.isPlayer) { if (r.rocket) fireRocket(r); else if (r.rocket === false) { r.stallT = 0.7; toast('STALLED!', C.orange); } }
          else if (Math.random() < 0.35 + (r.skill - 0.95) * 2) fireRocket(r);
        }
      }
    }
    if (S.mode === 'race' || S.mode === 'results') S.raceT += wdt;
    simulate(wdt);
    updateParts(wdt);
    if (S.chain && !S.trick && (S.chainT -= wdt) <= 0) S.chain = 0;

    if (!S.demo) {
      if (P.pos !== Hh.lastPos) { if (Hh.lastPos && P.pos < Hh.lastPos && S.mode === 'race') sfx.up(); Hh.lastPos = P.pos; Hh.posPop = 1; }
      if (P.boosts > Hh.lastBoosts) Hh.ready = 1;
      Hh.lastBoosts = P.boosts;
      S.stats.top = Math.max(S.stats.top, P.v);
      if (S.mode === 'race' && S.finishAt && S.ui - S.finishAt > RESULTS_DELAY) { S.mode = 'results'; S.resultsAt = S.ui; }
      if (S.mode === 'race' && !P.finished) {
        const th = threats();
        if (th > S.warned && S.ui - (S.warnAt || 0) > 0.8) { sfx.warn(); S.warnAt = S.ui; }
        S.warned = th;
      }
      if (S.mode === 'race' || S.mode === 'count') {
        engine(true);
        if (eng) eng.o.frequency.setTargetAtTime((40 + P.v * 2.4) * (0.4 + 0.6 * S.slow), actx.currentTime, 0.1);
      } else engine(false);
    } else if (P.finished && S.ui - (S.demoEnd || (S.demoEnd = S.ui)) > 4) {
      S.demoEnd = 0;
      const m = S.mode === 'title' ? Math.floor(Math.random() * 3) : S.sel.m, l = S.mode === 'title' ? Math.floor(Math.random() * 3) : S.sel.l;
      startRace(m, l, true);
    }
    updateCamera(dt);
    if (P.boostT > 0) burst(P.s - 0.5, P.d + rand(-0.25, 0.25), P.y + 0.1, 1, pick([C.cyan, C.text]), 1.5, 0.25);
  }

  // Rivals behind you that are about to hit you: boosting in your lane, or winding up a side swipe.
  function threats() {
    let n = 0;
    const P = S.P;
    for (const r of S.racers) {
      if (r === P) continue;
      const g = P.s - r.s;
      if ((r.boostT > 0 && g > 0 && g < 14 && Math.abs(r.d - P.d) < 0.6) || (r.attack && r.attack.who === P) || (r.charge && r.charge.who === P)) n++;
    }
    return n;
  }

  // ---------- camera ----------
  const Cam = { s: 0, d: 0, x: 0, z: 0, yaw: 0, c: 1, n: 0, h: CAM_H, F: F0, bank: 0 };
  const TMP = [0, 0, 0];
  function updateCamera(dt, snap = false) {
    const P = S.P;
    let back = CAM_BACK + clamp((P.v - 26) * 0.03, -0.4, 0.8), lift = 0;
    if (S.mode === 'count') { const e = easeOut(S.cdT / 3); back += (1 - e) * 16; lift += (1 - e) * 5; }
    const trickLift = S.trick && !S.trick.landed ? Math.max(0, P.y - 0.3) * 0.8 : 0;
    const k = snap ? 1 : Math.min(1, dt * 5);
    S.camLift += (trickLift - S.camLift) * k;
    Cam.s = P.s - back;
    Cam.d += (P.d * 0.8 - Cam.d) * k;
    const yawT = psiAt(Cam.s + 3);
    Cam.yaw += (yawT - Cam.yaw) * (snap ? 1 : Math.min(1, dt * 6));
    const bankT = clamp((psiAt(Cam.s + 16) - psiAt(Cam.s)) * -1.1, -0.06, 0.06);
    Cam.bank += (bankT - Cam.bank) * (snap ? 1 : Math.min(1, dt * 3));
    Cam.h = CAM_H + lift + S.camLift;
    Cam.F = F0 * (1 - 0.08 * S.hud.kick);
    worldAt(Cam.s, Cam.d, TMP);
    Cam.x = TMP[0]; Cam.z = TMP[1]; Cam.c = Math.cos(Cam.yaw); Cam.n = Math.sin(Cam.yaw);
    setLight();
  }
  function snapCamera() { Cam.d = S.P.d * 0.8; updateCamera(0, true); }

  // Project track coordinates (s along, d across, h up) to the screen: x, y, k = pixels per unit there.
  // Results come from a pool that's recycled every frame, so a projection only lives until the next frame.
  const POOL = [];
  let poolN = 0;
  function pooled() { let o = POOL[poolN]; if (!o) o = POOL[poolN] = { x: 0, y: 0, k: 0, fw: 0 }; poolN++; return o; }
  function proj(s, d, h, o = pooled()) {
    worldAt(s, d, TMP);
    const dx = TMP[0] - Cam.x, dz = TMP[1] - Cam.z, fw = dx * Cam.n + dz * Cam.c;
    if (fw < NEAR_Z) return null;
    const k = Cam.F / fw;
    o.x = CX + (dx * Cam.c - dz * Cam.n) * k; o.y = HOR + (Cam.h - h) * k; o.k = k; o.fw = fw;
    return o;
  }

  // ---------- pre-rendered sky (a 360° panorama per map that turns with the camera) ----------
  const PANO = [], PW = Math.round(TAU * F0), PH = 96, STARS = [];
  function ensurePano(mi) {
    if (PANO[mi]) return;
    const c = document.createElement('canvas'); c.width = PW; c.height = PH;
    const g = c.getContext('2d'), R = rng(99 + mi * 17), M = MAPS[mi];
    STARS[mi] = Array.from({ length: 150 }, () => ({ x: R() * PW, y: 4 + R() * (HOR - 50), a: 0.2 + R() * 0.6, sz: R() < 0.1 ? 2 : 1 }));
    const grd = g.createLinearGradient(0, PH - 70, 0, PH);

        if (N3[0] * (Cam.x - fx * inv) + N3[1] * (Cam.h - fy * inv) + N3[2] * (Cam.z - fz * inv) <= 0) continue;
        const [hex, glow] = pal[f.slot];
        const col = glow ? hex : hexShade(hex, Math.round((0.46 + 0.72 * Math.max(0, N3[0] * LIGHT[0] + N3[1] * LIGHT[1] + N3[2] * LIGHT[2])) * 20) / 20);
        ctx.fillStyle = col;
        ctx.beginPath(); ctx.moveTo(MV.sx[v[0]], MV.sy[v[0]]);
        for (let j = 1; j < v.length; j++) ctx.lineTo(MV.sx[v[j]], MV.sy[v[j]]);
        ctx.closePath(); ctx.fill(); DBG.faces++;
        if (!lod) { ctx.strokeStyle = col; ctx.stroke(); } // hide the hairline seams between faces
      }
    }
    return true;
  }

  const DARK = '#1c2438', WHITE = '#eaf4ff';
  function palette(r) {
    const hot = !!(r.attack || r.charge), brake = r.brakeT > 0;
    if (r.isPlayer) {
      const glow = brake ? C.tail : C.cyan;
      return [[C.cyan, false], [DARK, false], [WHITE, false], [glow, true], [C.tail, true], [WHITE, false], ['#3a5a90', false]];
    }
    return [[r.col, false], [DARK, false], [WHITE, false], [r.col, true], [brake ? '#ff8fb0' : C.tail, true], hot ? [C.red, true] : [WHITE, false], hot ? [C.red, true] : [hexShade(r.col, 0.55), false]];
  }

  // Where a racer is and how it's turned: leaning into lane changes, pitched on ramps, spinning when hit, and your tricks.
  function pose(r) {
    worldAt(r.s, r.d + r.nv, TMP);
    const steer = clamp(laneD(r.lane) - r.d, -1, 1);
    let yaw = TMP[2] + steer * 0.35, pitch = 0, roll = -steer * 0.3 + (r.wob > 0 ? Math.sin(S.anim * 45) * 0.15 * r.wob : 0), lift = 0, squash = r.squash;
    if (r.air) pitch = clamp(-r.vy * 0.035, -0.4, 0.4);
    else if (r.y > 0.01) pitch = -0.28;
    if (r.spinT > 0) yaw += r.spinA;
    if (!r.isPlayer && r.air) yaw += r.trickSpin * TAU * (r.botTrick ? 1 : 0.15);
    if (r.isPlayer && S.trickAnim) {
      const t = S.trickAnim.t / TRICK_T, e = t * t * (3 - 2 * t), d = S.trickAnim.dir;
      if (d === 'left') roll += e * TAU;                                         // BARREL ROLL
      else if (d === 'right') { roll -= e * TAU; yaw += e * TAU; }              // CORKSCREW
      else if (d === 'up') { pitch -= e * TAU; lift = Math.sin(e * Math.PI) * 0.5; } // KICKFLIP
      else { yaw += e * TAU; squash = Math.max(squash, Math.sin(e * Math.PI) * 0.8); } // BOP 360
    }
    return { x: TMP[0], z: TMP[1], yaw, pitch, roll, lift, squash };
  }

  function drawRacer(r, p, a) {
    const k = p.k;
    if (k < 2) return;
    const g = r.y > 0.02 ? proj(r.s, r.d + r.nv, 0) : p;
    if (g) { ctx.globalAlpha = a * 0.55; ctx.fillStyle = '#000'; ell(g.x, g.y, 0.44 * g.k, 0.14 * g.k); ctx.fill(); }
    if (r.isPlayer && g) { ctx.globalAlpha = a * 0.5; ctx.strokeStyle = r.brakeT > 0 ? C.tail : C.cyan; ctx.lineWidth = Math.max(1.5, 0.04 * g.k); ell(g.x, g.y, 0.55 * g.k, 0.17 * g.k); ctx.stroke(); }
    ctx.globalAlpha = a * (r.invuln > 0 && r.spinT <= 0 && Math.floor(S.anim * 14) % 2 ? 0.45 : 1);
    if (k < 7) { // a speck far away
      const s = Math.max(2, 0.4 * k), y = p.y - 0.6 * k;
      ctx.fillStyle = r.isPlayer ? C.cyan : r.col;
      ctx.beginPath(); ctx.moveTo(p.x, y - s); ctx.lineTo(p.x + s, y); ctx.lineTo(p.x, y + s); ctx.lineTo(p.x - s, y); ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 1;
      return;
    }
    const q = pose(r);
    drawModel(r.isPlayer ? HERO : BUG, q.x, r.y + q.lift, q.z, q.yaw, q.pitch, q.roll, q.squash, palette(r), k < 20, r.wheelA);
    // Exhaust flames while boosting (and your board's thrusters on any speed-up).
    const hot = r.boostT > 0 || (r.isPlayer && (r.landT > 0 || r.padT > 0 || r.draftT > 0));
    if (hot && k > 9) {
      const col = r.isPlayer ? (r.boostT > 0 ? C.cyan : C.mint) : r.col, len = rand(0.5, 0.9) * (1 + S.hud.kick * 0.5);
      for (const dd of r.isPlayer ? [-0.2, 0.2] : [0]) flame(r.s - (r.isPlayer ? 0.6 : 0.45), r.d + r.nv + dd, r.y + (r.isPlayer ? 0.14 : 0.3), col, len);
    }
    // Slipstream: a few wind streaks while you're tucked in behind someone.
    if (r.isPlayer && (r.drafting || r.draftT > 0)) {
      ctx.strokeStyle = r.draftT > 0 ? C.cyan : C.text; ctx.lineWidth = 2;
      ctx.globalAlpha = a * (r.draftT > 0 ? 0.7 : 0.25 + 0.35 * r.draftC);
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const an = (i / 6) * TAU + 0.5, ph = (S.anim * 3 + i * 0.37) % 1, rr = (0.6 + ph * 0.3) * k;
        const px = p.x + Math.cos(an) * rr, py = p.y - 0.6 * k + Math.sin(an) * rr * 0.7;
        ctx.moveTo(px, py); ctx.lineTo(px, py + (0.2 + ph * 0.25) * k);
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function flame(s, d, h, col, len) {
    const b = proj(s, d, h), t = b && proj(s - len, d, h - 0.05);
    if (!t) return;
    const w = 0.08 * b.k;
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.moveTo(b.x - w, b.y); ctx.lineTo(b.x + w, b.y); ctx.lineTo(t.x, t.y + w); ctx.closePath(); ctx.fill();
    ctx.fillStyle = C.text;
    ctx.beginPath(); ctx.moveTo(b.x - w * 0.4, b.y); ctx.lineTo(b.x + w * 0.4, b.y); ctx.lineTo((b.x + t.x) / 2, (b.y + t.y) / 2 + w); ctx.closePath(); ctx.fill();
  }

  function drawParts() {
    for (const p of S.parts) {
      const q = proj(p.s, p.d, p.h);
      if (!q) continue;
      const sz = Math.max(2, p.sz * q.k);
      ctx.globalAlpha = clamp(p.life / p.max, 0, 1); ctx.fillStyle = p.col;
      ctx.fillRect(q.x - sz / 2, q.y - sz / 2, sz, sz);
    }
    ctx.globalAlpha = 1;
  }

  // Momentum you can see: speed lines once you're really moving, heavier when boosting or in a slipstream.
  function drawSpeedLines() {
    const P = S.P, boosting = P.boostT > 0 || P.landT > 0 || P.padT > 0 || P.draftT > 0;
    if (S.demo || !boosting) return;
    ctx.lineWidth = 2; ctx.strokeStyle = P.draftT > 0 ? C.text : P.landT > 0 ? C.mint : C.cyan; ctx.globalAlpha = 0.35;
    ctx.beginPath();
    for (let i = 0; i < 16; i++) {
      const ang = rand(0, TAU), r0 = rand(180, 270), r1 = r0 + rand(50, 130) * (1 + S.hud.kick);
      ctx.moveTo(CX + Math.cos(ang) * r0, 300 + Math.sin(ang) * r0); ctx.lineTo(CX + Math.cos(ang) * r1, 300 + Math.sin(ang) * r1);
    }
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // ---------- HUD ----------
  const FONT = (w, s, it = '') => `${it}${w} ${Math.round(s)}px system-ui, -apple-system, Roboto, sans-serif`;
  function text(txt, x, y, size, color, weight = 700, align = 'center', it = '') {
    ctx.font = FONT(weight, size, it); ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'middle';
    ctx.fillText(txt, x, y);
  }
  function chroma(txt, y, size, x = CX, off = 3, color = C.text) {
    const ga = ctx.globalAlpha;
    ctx.globalAlpha = ga * 0.85;
    text(txt, x - off, y, size, C.pink, 900, 'center', 'italic ');
    text(txt, x + off, y + 1, size, C.cyan, 900, 'center', 'italic ');
    ctx.globalAlpha = ga;
    text(txt, x, y, size, color, 900, 'center', 'italic ');
  }
  function scaledText(txt, x, y, size, color, sc, align = 'center', it = 'italic ', weight = 900) {
    ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc); text(txt, 0, 0, size, color, weight, align, it); ctx.restore();
  }
  function drawArrow(dir, cx, cy, r, color) {
    ctx.save(); ctx.translate(cx, cy); ctx.rotate({ right: 0, down: Math.PI / 2, left: Math.PI, up: -Math.PI / 2 }[dir]);
    ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = r * 0.45;
    ctx.beginPath(); ctx.moveTo(-r, 0); ctx.lineTo(r * 0.1, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(r, 0); ctx.lineTo(0, -r * 0.8); ctx.lineTo(0, r * 0.8); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  const pinchWord = () => (S.input === 'tap' ? 'TAP' : S.input === 'pinch' ? 'PINCH' : 'PINCH / TAP');

  // A rounded pill button with dark text.
  function pill(txt, y, col, on = true) {
    const ga = ctx.globalAlpha, pulse = on ? 1 + 0.04 * Math.sin(S.ui * 5) : 1;
    ctx.save(); ctx.translate(CX, y); ctx.scale(pulse, pulse);
    ctx.globalAlpha = ga * (on ? 1 : 0.35);
    ctx.font = FONT(900, 19, 'italic ');
    const w = ctx.measureText(txt).width + 48;
    ctx.fillStyle = col; rrect(-w / 2, -21, w, 42, 21); ctx.fill();
    text(txt, 0, 1, 19, C.body, 900, 'center', 'italic ');
    ctx.restore(); ctx.globalAlpha = ga;
  }

  // Boost charges: three small bolt tiles, bottom left.
  function drawBoostPips(x0, y) {
    const P = S.P;
    for (let i = 0; i < BOOST_MAX; i++) {
      const full = i < P.boosts, pop = full && i === P.boosts - 1 ? 1 + 0.35 * S.hud.ready : 1;
      ctx.save(); ctx.translate(x0 + i * 30, y); ctx.scale(pop, pop);
      ctx.fillStyle = full ? C.cyan : '#1a2742'; rrect(-11, -11, 22, 22, 6); ctx.fill();
      ctx.fillStyle = full ? C.body : '#33476b';
      ctx.beginPath(); ctx.moveTo(2, -7); ctx.lineTo(-4, 1); ctx.lineTo(0, 1); ctx.lineTo(-2, 7); ctx.lineTo(4, -1); ctx.lineTo(0, -1); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    if (P.boostT > 0) { ctx.fillStyle = C.cyan; ctx.fillRect(x0 - 11, y + 16, 82 * (P.boostT / BOOST_T), 3); }
  }

  // Racers coming up behind you: a chevron under their lane, bigger as they close, flashing red if they're about to hit you.
  function drawRearWarnings() {
    const P = S.P;
    for (const r of S.racers) {
      if (r === P || r.finished) continue;
      const g = P.s - r.s;
      if (g < 0.8 || g > 28) continue;
      const p = proj(P.s, r.d, 0);
      if (!p) continue;
      const threat = (r.boostT > 0 && Math.abs(r.d - P.d) < 0.6) || (r.attack && r.attack.who === P) || (r.charge && r.charge.who === P) || (Math.abs(r.d - P.d) < 0.6 && r.v > P.v + 3 && g < 10);
      const close = 1 - g / 28, x = clamp(p.x, 26, W - 26), y = 522 - close * 12, sz = (7 + close * 11) * (threat ? 1.5 : 1);
      if (threat) { ctx.globalAlpha = 0.35 + 0.25 * Math.sin(S.ui * 24); ctx.fillStyle = C.red; circ(x, y, sz * 1.3); ctx.fill(); }
      const col = threat ? (Math.sin(S.ui * 24) > -0.2 ? C.red : C.text) : r.col;
      ctx.globalAlpha = 0.35 + 0.65 * close;
      for (const [c, lw] of [['#000', 7 + close * 3], [col, 3 + close * 3]]) {
        ctx.strokeStyle = c; ctx.lineWidth = lw;
        ctx.beginPath(); ctx.moveTo(x - sz, y + sz * 0.6); ctx.lineTo(x, y - sz * 0.4); ctx.lineTo(x + sz, y + sz * 0.6); ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
  }

  // The trick combo, exactly as in Lane Runner: one icon per swipe, lit as you land each one, plus the air time left.
  function drawTrickHud() {
    const Tk = S.trick;
    if (!Tk) return;
    const n = Tk.seq.length, bs = 50, gap = 12, w = n * bs + (n - 1) * gap, x0 = CX - w / 2, y0 = 92;
    const age = S.ui - Tk.born;
    ctx.globalAlpha = (Tk.landed ? clamp(Tk.hide / 0.4, 0, 1) : 1) * clamp(age / 0.15, 0, 1);
    const ga = ctx.globalAlpha;
    const [head, hc] = Tk.state === 'done' ? [S.chain > 1 ? `PERFECT x${S.chain}` : 'PERFECT!', C.mint] : Tk.state === 'fail' ? ['COMBO BROKEN', C.red] : Tk.landed ? ['TOO SLOW', C.orange] : ['TRICK TIME', C.pink];
    const shakeX = Tk.state === 'fail' ? Math.sin(S.ui * 60) * 6 * clamp(1 - (S.ui - Tk.failAt) / 0.4, 0, 1) : 0;
    if (Tk.state === 'done') chroma(head, y0 - 22, 24, CX, 2 + Math.sin(S.ui * 20) * 2, C.mint);
    else scaledText(head, CX + shakeX, y0 - 22, 22, hc, 0.9 + 0.1 * easeBack(age / 0.3));
    for (let i = 0; i < n; i++) {
      const x = x0 + i * (bs + gap), hit = i < Tk.i, miss = Tk.state === 'fail' && i === Tk.i;
      const next = Tk.state === 'active' && !Tk.landed && i === Tk.i;
      const enter = easeBack((age - i * 0.06) / 0.25);
      const bounce = hit && Tk.hitAt && Tk.hitAt[i] !== undefined ? 1 + 0.35 * (1 - easeOut((S.ui - Tk.hitAt[i]) / 0.3)) : 1;
      const pulse = next ? 1 + 0.08 * Math.sin(S.ui * 12) : 1, sz = bs * pulse * bounce * enter;
      if (sz <= 1) continue;
      const cx = x + bs / 2, cy = y0 + bs / 2 + (1 - enter) * -20;
      ctx.globalAlpha = ga * (hit || miss || next ? 1 : 0.55);
      ctx.fillStyle = hit ? C.mint : miss ? C.red : next ? '#3a1a5a' : C.panel;
      rrect(cx - sz / 2, cy - sz / 2, sz, sz, 12); ctx.fill();
      if (next) { ctx.strokeStyle = C.text; ctx.lineWidth = 3; ctx.stroke(); }
      drawArrow(Tk.seq[i], cx, cy, sz * 0.28, hit || miss ? C.body : next ? C.text : C.dim);
    }
    ctx.globalAlpha = ga;
    const frac = Tk.state === 'done' ? 1 : Tk.landed ? 0 : clamp(airLeft(S.P) / Tk.total, 0, 1);
    ctx.fillStyle = '#2a1640'; rrect(x0, y0 + bs + 10, w, 6, 3); ctx.fill();
    ctx.fillStyle = Tk.state === 'done' ? C.mint : frac < 0.3 ? C.red : C.pink; rrect(x0, y0 + bs + 10, Math.max(6, w * frac), 6, 3); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // In a race: position, coins, a thin progress line, boosts and speed. Nothing else unless it matters right now.
  function drawRaceHud() {
    const P = S.P, Hh = S.hud, slideT = (1 - easeOut(Hh.in)) * -80, slideB = (1 - easeOut(Hh.in)) * 80;
    const pc = PLACE_COL(P.pos);
    scaledText(String(P.pos), 40, 38 + slideT, 46, pc, 1 + Hh.posPop * 0.3, 'center');
    text(ORD(P.pos).slice(-2), 62, 27 + slideT, 18, pc, 900, 'left', 'italic ');

    const cs = 1 + Hh.coinPop * 0.35;
    ctx.fillStyle = C.yellow; ell(W - 64, 36 + slideT, Math.max(2, 9 * Math.abs(Math.cos(S.ui * 3))) * cs, 10 * cs); ctx.fill();
    scaledText(String(P.coins), W - 46, 37 + slideT, 26, P.coins >= COIN_MAX ? C.yellow : C.text, cs, 'left', '', 900);
    for (const f of S.flyers) {
      const e = easeOut(f.t / 0.45), fxp = f.x + (W - 64 - f.x) * e, fyp = f.y + (36 - f.y) * e - Math.sin(e * Math.PI) * 60;
      ctx.fillStyle = C.yellow; circ(fxp, fyp, 6 - e * 2); ctx.fill();
    }

    const bx0 = 200, bx1 = 400, by = 24 + slideT, px = (r) => bx0 + (bx1 - bx0) * clamp(r.s / T.finish, 0, 1);
    ctx.strokeStyle = '#2c3a60'; ctx.lineWidth = 3; line(bx0, by, bx1, by);
    ctx.fillStyle = C.text; ctx.fillRect(bx1 + 3, by - 6, 4, 4); ctx.fillRect(bx1 + 7, by - 2, 4, 4); ctx.fillRect(bx1 + 3, by + 2, 4, 4);
    for (const r of S.racers) { if (r === P) continue; ctx.fillStyle = r.col; circ(px(r), by, 3.5); ctx.fill(); }
    ctx.fillStyle = C.cyan; circ(px(P), by, 6); ctx.fill(); ctx.strokeStyle = C.text; ctx.lineWidth = 2; ctx.stroke();

    drawBoostPips(32, H - 32 + slideB);
    const kmh = Math.round(P.v * KMH), vc = P.boostT > 0 ? C.cyan : P.brakeT > 0 ? C.red : C.text;
    scaledText(String(kmh), W - 24, H - 40 + slideB, 32, vc, 1 + Hh.kick * 0.25, 'right');
    text('KM/H', W - 24, H - 16 + slideB, 11, C.dim, 800, 'right');

    if (S.mode === 'race' && !P.finished) drawRearWarnings();
    drawTrickHud();

    if (S.mode === 'count') {
      const n = 3 - Math.floor(S.cdT), f = S.cdT % 1;
      scaledText(String(n), CX, 250, 110, n === 1 ? C.yellow : C.text, 1.5 - 0.5 * easeOut(f / 0.25));
    } else if (S.hud.go && S.ui - S.hud.go < 0.8) {
      const t = S.ui - S.hud.go;
      ctx.globalAlpha = clamp((0.8 - t) / 0.3, 0, 1);
      ctx.save(); ctx.translate(CX, 250); ctx.scale(easeBack(t / 0.25) * 1.2, easeBack(t / 0.25) * 1.2); chroma('GO!', 0, 80, 0, 4, C.mint); ctx.restore();
      ctx.globalAlpha = 1;
    }
    if (S.toast) {
      const age = 1.4 - S.toast.t, sc = easeBack(age / 0.22), y = (S.trick ? 204 : 150) - age * 12;
      ctx.globalAlpha = clamp(S.toast.t / 0.4, 0, 1);
      ctx.save(); ctx.translate(CX, y); ctx.scale(sc, sc);
      chroma(S.toast.text, 0, 24, 0, 2, S.toast.color);
      ctx.restore(); ctx.globalAlpha = 1;
    }
  }

  function dim(y0, h, a) { ctx.globalAlpha = a; ctx.fillStyle = '#000'; ctx.fillRect(0, y0, W, h); ctx.globalAlpha = 1; }

  function drawTitle() {
    const t = S.ui, a = clamp(t / 0.4, 0, 1);
    dim(160, 280, 0.7 * a);
    ctx.globalAlpha = a;
    chroma('RAMP RIVALS', 238 + Math.sin(t * 2) * 3, 60, CX, 3 + Math.sin(t * 3) * 2);
    text('←  →  lanes        ↑  boost        ↓  slow', CX, 296, 17, C.dim, 700);
    pill(`${pinchWord()} TO START`, 370, C.cyan);
    ctx.globalAlpha = 1;
    text(BUILD + (S.lite ? ' · lite' : ''), W - 12, H - 12, 11, C.dim, 600, 'right');
  }

  const previews = new Map();
  function drawTrackPreview(m, l, x, y, w, h, col) {
    const key = m + '-' + l;
    if (!previews.has(key)) {
      const g = geometry(m, l), pts = [];
      let x0 = Infinity, x1 = -Infinity, z0 = Infinity, z1 = -Infinity;
      for (let s = 0; s <= g.finish; s += 6) { const i = s + PRE; pts.push([g.X[i], g.Z[i]]); x0 = Math.min(x0, g.X[i]); x1 = Math.max(x1, g.X[i]); z0 = Math.min(z0, g.Z[i]); z1 = Math.max(z1, g.Z[i]); }
      previews.set(key, { pts, x0, x1, z0, z1 });
    }
    const pv = previews.get(key), sc = Math.min(w / Math.max(1, pv.x1 - pv.x0), h / Math.max(1, pv.z1 - pv.z0));
    const ox = x + (w - (pv.x1 - pv.x0) * sc) / 2, oy = y + h - (h - (pv.z1 - pv.z0) * sc) / 2;
    const P = (q) => [ox + (q[0] - pv.x0) * sc, oy - (q[1] - pv.z0) * sc];
    ctx.strokeStyle = col; ctx.lineWidth = 3;
    ctx.beginPath(); for (const q of pv.pts) { const [px, py] = P(q); ctx.lineTo(px, py); } ctx.stroke();
    const [sx, sy] = P(pv.pts[0]), [fx, fy] = P(pv.pts[pv.pts.length - 1]);
    ctx.fillStyle = C.mint; circ(sx, sy, 5); ctx.fill();
    ctx.fillStyle = C.text; ctx.fillRect(fx - 5, fy - 5, 5, 5); ctx.fillRect(fx, fy, 5, 5);
  }

  function drawMenu() {
    const t = S.ui - S.menuAt, a = clamp(t / 0.3, 0, 1), M = MAPS[S.sel.m];
    dim(70, 420, 0.75 * a);
    ctx.globalAlpha = a;
    const pop = S.menuPop ? 1 + 0.12 * (1 - easeOut((S.ui - S.menuPop) / 0.25)) : 1, nudge = Math.sin(S.ui * 5) * 3;
    scaledText(M.name, CX, 114, 38, C.text, pop);
    drawArrow('left', 50 - nudge, 114, 12, M.edge); drawArrow('right', W - 50 + nudge, 114, 12, M.edge);
    text(M.tier, CX, 148, 13, M.edge, 800);
    for (let i = 0; i < 3; i++) {
      const y = 196 + i * 58, on = i === S.sel.l, b = S.best[S.sel.m + '-' + i];
      if (on) { ctx.globalAlpha = a * 0.2; ctx.fillStyle = M.edge; rrect(36, y - 23, 300, 46, 12); ctx.fill(); ctx.globalAlpha = a; ctx.strokeStyle = M.edge; ctx.lineWidth = 2; ctx.stroke(); }
      text(`${S.sel.m + 1}-${i + 1}`, 54, y, 17, on ? M.edge : C.dim, 900, 'left', 'italic ');
      text(M.levels[i].name, 100, y, 18, on ? C.text : C.dim, 800, 'left');
      if (b) { ctx.fillStyle = PLACE_COL(b.place); circ(314, y, 11); ctx.fill(); text(String(b.place), 314, y + 1, 13, C.body, 900); }
    }
    drawTrackPreview(S.sel.m, S.sel.l, 366, 172, 190, 164, M.edge);
    pill(`${pinchWord()} TO RACE`, 436, M.edge);
    ctx.globalAlpha = 1;
  }

  function standings() {
    return rank().map((r) => ({ r, time: r.finished ? r.finishT : S.raceT + (T.finish - r.s) / Math.max(8, r.v || 8), done: r.finished }));
  }

  function drawResults() {
    const t = S.ui - S.resultsAt, a = clamp(t / 0.3, 0, 1), P = S.P, place = P.place || P.pos, pc = PLACE_COL(place);
    dim(40, 520, 0.8 * a);
    ctx.globalAlpha = a;
    chroma(place === 1 ? 'YOU WIN!' : `${ORD(place)} PLACE`, 92, 46, CX, 3, pc);
    if (S.newBest && t > 0.6) text('NEW BEST', CX, 128, 13, C.yellow, 900, 'center', 'italic ');
    standings().forEach((e, i) => {
      const y = 164 + i * 29, me = e.r.isPlayer;
      ctx.globalAlpha = a * clamp((t - 0.15 - i * 0.05) / 0.2, 0, 1);
      if (me) { ctx.fillStyle = C.cyan; ctx.globalAlpha *= 0.22; rrect(CX - 170, y - 13, 340, 26, 8); ctx.fill(); ctx.globalAlpha = a; }
      text(ORD(i + 1), CX - 130, y, 15, PLACE_COL(i + 1), 900, 'right', 'italic ');
      ctx.fillStyle = e.r.col; circ(CX - 110, y, 5); ctx.fill();
      text(e.r.name, CX - 96, y, 15, me ? C.cyan : C.text, 800, 'left');
      text(e.done ? fmtTime(e.time) : '…', CX + 150, y, 14, C.dim, 700, 'right');
    });
    ctx.globalAlpha = a;
    const last = S.sel.m === MAPS.length - 1 && S.sel.l === 2;
    pill(`${pinchWord()}: ${last ? 'BACK TO MAP 1' : 'NEXT RACE'}`, 424, pc, t > 0.8);
    text('↓ retry        ← menu', CX, 474, 15, C.dim, 700);
    ctx.globalAlpha = 1;
  }

  function drawPaused() {
    dim(200, 190, 0.75);
    chroma('PAUSED', 262, 40);
    text(`${pinchWord()} resume   ·   ↓ restart   ·   ← menu`, CX, 318, 15, C.dim, 700);
  }

  function drawHud() {
    ctx.globalAlpha = 1;
    if (S.redFlash > 0) { ctx.strokeStyle = C.red; ctx.globalAlpha = 0.8 * S.redFlash; ctx.lineWidth = 8; ctx.strokeRect(4, 4, W - 8, H - 8); ctx.globalAlpha = 1; }
    if (S.mode === 'title') drawTitle();
    else if (S.mode === 'menu') drawMenu();
    else {
      drawRaceHud();
      if (S.mode === 'results') drawResults();
      else if (S.mode === 'paused') drawPaused();
    }
  }

  const PROF = { skip: null };
  const prof = (name, fn) => { if (PROF.skip && PROF.skip.has(name)) return; fn(); };
  function render() {
    poolN = 0; DBG.faces = 0;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (S.shake > 0) { const m = S.shake * 18; ctx.translate((Math.random() - 0.5) * m, (Math.random() - 0.5) * m); }
    ctx.translate(CX, 330); ctx.rotate(Cam.bank); ctx.translate(-CX, -330);
    prof('sky', drawSky);
    prof('grid', drawGrid);
    prof('road', drawRoad);
    if (!S.lite) prof('fog', () => ctx.drawImage(FOG, -40, HOR - 1));
    prof('trails', () => { for (const r of S.racers) drawTrail(r); });
    drawAttackArrows();
    prof('world', drawWorld);
    prof('parts', drawParts);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    drawSpeedLines();
    prof('hud', drawHud);
  }

  // Desktop testing hooks (not used by the game itself).
  window.__rampRivals = S;
  window.__rampRivalsDebug = {
    frame: () => frameEMA, startRace, update, render, simulate, tryLane, useBoost, brake, spinOut, knock, onDir, onSelect, proj, rank, standings, threats,
    geometry, buildTrack, topSpeed, MAPS, PROF, DBG, models: { HERO, BUG }, track: () => T, cam: () => Cam, consts: { LANES, VIEW, FADE, RL, RW, V_BASE, COIN_MAX, BOOST_MAX, RAMP_LEN },
  };

  // ---------- loop: capped at ~30 fps to match the 30 Hz panel ----------
  let raf = 0, last = 0, frameEMA = 33, slowFor = 0;
  function tick(t) {
    raf = requestAnimationFrame(tick);
    if (!last) { last = t; return; }
    const elapsed = t - last;
    if (elapsed < 30) return;
    last = t;
    const t0 = performance.now();
    update(Math.min(elapsed / 1000, 0.05));
    render();
    // If the device can't hold ~24 fps in a race, switch to lighter drawing for the rest of the session.
    const work = performance.now() - t0;
    frameEMA = frameEMA * 0.93 + Math.max(elapsed, work) * 0.07;
    if (!S.lite && S.mode === 'race' && frameEMA > 42) { if ((slowFor += elapsed) > 1500) S.lite = true; } else slowFor = 0;
  }
  function startLoop() { if (!raf) { last = 0; raf = requestAnimationFrame(tick); } }
  function stopLoop() { if (raf) { cancelAnimationFrame(raf); raf = 0; } }

  // Nothing may run while hidden.
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      if (S.mode === 'race' || S.mode === 'count') { S.pausedFrom = S.mode; S.mode = 'paused'; }
      engine(false);
      stopLoop();
      if (actx && actx.state === 'running') actx.suspend();
    } else startLoop();
  });

  // ?race=m-l drops straight into a race, ?menu=m-l opens the menu there (used after reloading for a fresh build).
  const pick2 = (v) => { const [m, l] = String(v).split('-').map(Number); return [clamp(m | 0, 0, MAPS.length - 1), clamp(l | 0, 0, 2)]; };
  if (QS.has('race')) { const [m, l] = pick2(QS.get('race')); startRace(m, l); }
  else if (QS.has('menu')) { const [m, l] = pick2(QS.get('menu')); S.mode = 'menu'; startRace(m, l, true); }
  else startRace(Math.floor(Math.random() * 3), 0, true);
  render();
  startLoop();
})();
</script>
</body>
</html>
